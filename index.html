<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Policy Annotation Tool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .line-clamp-2 { display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden }
    .line-clamp-4 { display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden }
    /* Tree visualization */
    .tree-block    { font-family:'Courier New',monospace; font-size:12.5px; line-height:1.65;
                     white-space:pre-wrap; word-break:break-word; }
    .tree-matched  { background:#f0fdf4; color:#166534; border-left:3px solid #4ade80; }
    .tree-missed   { background:#fff1f2; color:#9f1239; border-left:3px solid #f87171; }
    .tree-extra    { background:#fff7ed; color:#9a3412; border-left:3px solid #fb923c; }
    .tree-operator { background:#eff6ff; color:#1e40af; font-weight:600; }
    .tree-meta     { color:#6b7280; font-style:italic; font-size:11px; }
    .tree-default  { color:#374151; }
    /* Diff spans */
    .diff-equal  { color:#374151; }
    .diff-insert { background:#fef9c3; color:#854d0e; text-decoration:underline; }
    .diff-delete { background:#fee2e2; color:#991b1b; text-decoration:line-through; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;

/* ── ICONS ── */
const ChevronRight = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m9 18 6-6-6-6"/></svg>);
const ChevronDown  = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m6 9 6 6 6-6"/></svg>);

const Download     = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>);
const ArrowLeft    = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>);
const ArrowRight   = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>);
const FileText     = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>);
const Layers       = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg>);
const GitBranch    = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>);
const LinkIcon     = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>);
const Info         = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>);
const MessageSquare= ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>);
const Upload       = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>);
const BarChart     = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg>);

/* ── CONSTANTS ── */
const EVIDENCE_SOURCES = ['clinical_note','imaging_report','therapy_records','lab_result','prior_auth_form','operative_report','pathology_report','referral_letter','other'];

const ANNOTATOR_COLORS = [
  { bg:'bg-blue-50',   border:'border-blue-200',   text:'text-blue-700',   badge:'bg-blue-100 text-blue-800',   header:'bg-blue-100 text-blue-900',   dot:'bg-blue-500'   },
  { bg:'bg-violet-50', border:'border-violet-200', text:'text-violet-700', badge:'bg-violet-100 text-violet-800', header:'bg-violet-100 text-violet-900', dot:'bg-violet-500' },
  { bg:'bg-teal-50',   border:'border-teal-200',   text:'text-teal-700',   badge:'bg-teal-100 text-teal-800',   header:'bg-teal-100 text-teal-900',   dot:'bg-teal-500'   },
  { bg:'bg-orange-50', border:'border-orange-200', text:'text-orange-700', badge:'bg-orange-100 text-orange-800', header:'bg-orange-100 text-orange-900', dot:'bg-orange-500' },
  { bg:'bg-pink-50',   border:'border-pink-200',   text:'text-pink-700',   badge:'bg-pink-100 text-pink-800',   header:'bg-pink-100 text-pink-900',   dot:'bg-pink-500'   },
  { bg:'bg-indigo-50', border:'border-indigo-200', text:'text-indigo-700', badge:'bg-indigo-100 text-indigo-800', header:'bg-indigo-100 text-indigo-900', dot:'bg-indigo-500' },
];
const acol      = idx  => ANNOTATOR_COLORS[idx % ANNOTATOR_COLORS.length];
const agreePct  = (n, total) => total === 0 ? 0 : n / total;
const agreeBg   = (p, total) => { if (total < 2) return 'bg-gray-100'; if (p === 1) return 'bg-green-100'; if (p >= 0.5) return 'bg-yellow-100'; return 'bg-red-100'; };
const agreeText = (p, total) => { if (total < 2) return 'text-gray-500'; if (p === 1) return 'text-green-700'; if (p >= 0.5) return 'text-yellow-700'; return 'text-red-700'; };

/* ── HELPERS ── */
const generateSectionId = (existingSections) => `sec${String(existingSections.length + 1).padStart(3, '0')}`;

const convertTreeToExportFormat = (node) => {
  if (!node) return null;
  if (['ALL','ANY'].includes(node.type)) {
    return { type: node.type, children: (node.children || []).map(convertTreeToExportFormat).filter(Boolean) };
  }
  return {
    type: 'leaf',
    text: node.text || '',
    evidence_sources: Array.isArray(node.evidence_sources) ? node.evidence_sources : (node.evidence_source ? [node.evidence_source] : [])
  };
};

/* Evaluation helpers */
const pct    = v => v != null ? `${(v * 100).toFixed(1)}%` : 'N/A';
const sColor = v => { if (v == null) return 'text-gray-400'; if (v >= 0.8) return 'text-green-700'; if (v >= 0.5) return 'text-yellow-700'; return 'text-red-600'; };
const sBg    = v => { if (v == null) return 'bg-gray-100'; if (v >= 0.8) return 'bg-green-100'; if (v >= 0.5) return 'bg-yellow-100'; return 'bg-red-100'; };

/* ── INSTRUCTIONS PANEL ── */
function InstructionsPanel({ title, children, defaultOpen = true }) {
  const [isOpen, setIsOpen] = useState(defaultOpen);
  return (
    <div className="bg-blue-50 border border-blue-200 rounded-xl mb-6">
      <button onClick={() => setIsOpen(!isOpen)} className="w-full flex items-center justify-between p-4 text-left">
        <div className="flex items-center gap-2">
          <Info size={20} className="text-blue-600" />
          <span className="font-semibold text-blue-900">{title}</span>
        </div>
        {isOpen ? <ChevronDown size={20} className="text-blue-600" /> : <ChevronRight size={20} className="text-blue-600" />}
      </button>
      {isOpen && <div className="px-4 pb-4 text-sm text-blue-800">{children}</div>}
    </div>
  );
}

/* ── METRIC CARD (for evaluation) ── */
function MCard({ label, value, sub, raw }) {
  const disp = raw != null ? raw : pct(value);
  return (
    <div className={`rounded-xl p-4 border border-gray-100 ${sBg(value)}`}>
      <div className={`text-2xl font-bold ${sColor(value)}`}>{disp}</div>
      <div className="text-sm font-medium text-gray-700 mt-1">{label}</div>
      {sub && <div className="text-xs text-gray-500 mt-0.5">{sub}</div>}
    </div>
  );
}

/* ── TREE LINE CLASSIFIER (evaluation) ── */
function classLine(line) {
  if (/\[✓/.test(line))           return 'tree-matched';
  if (/\[✗ MISSED\]/.test(line))  return 'tree-missed';
  if (/\[\+ EXTRA\]/.test(line))  return 'tree-extra';
  if (/\[(ALL|ANY)\]/.test(line)) return 'tree-operator';
  if (/·\s*(ts:|ev:)/.test(line)) return 'tree-meta';
  return 'tree-default';
}

/* ── TREE LEAF PARSER (evaluation) ── */
function parseTreeLeaves(treeStr) {
  if (!treeStr) return [];
  const rows = [];
  let last = null;
  for (const line of treeStr.split('\n')) {
    if (/·\s*(ts:|ev:)/.test(line)) {
      if (last) {
        const evM = line.match(/ev:\[([^\]]*)\]/);
        last.ev = evM ? evM[1].split(',').map(s => s.trim()).filter(Boolean) : [];
      }
      continue;
    }
    const mM    = line.match(/\[✓\s*([\d.]+)\]\s+(.*)/);
    const missM = line.match(/\[✗ MISSED\]\s+(.*)/);
    const extM  = line.match(/\[\+\s*EXTRA\]\s+(.*)/);
    if (mM)    { last = { status:'matched', score:parseFloat(mM[1]), text:mM[2].trim(), ev:[] }; rows.push(last); }
    else if (missM) { last = { status:'missed',  text:missM[1].trim(), ev:[] }; rows.push(last); }
    else if (extM)  { last = { status:'extra',   text:extM[1].trim(),  ev:[] }; rows.push(last); }
  }
  return rows;
}
function evSetsEqual(a, b) {
  if (!a || !b) return a === b;
  if (a.length !== b.length) return false;
  const sa = new Set(a);
  return b.every(x => sa.has(x));
}
function buildLeafRows(refStr, predStr) {
  const refAll  = parseTreeLeaves(refStr);
  const predAll = parseTreeLeaves(predStr);
  const refMatched  = refAll.filter(l => l.status === 'matched');
  const predMatched = predAll.filter(l => l.status === 'matched');
  const rows = [];
  const n = Math.min(refMatched.length, predMatched.length);
  for (let i = 0; i < n; i++) {
    const r = refMatched[i], p = predMatched[i];
    rows.push({ type:'matched', score:r.score, refText:r.text, predText:p.text, refEv:r.ev, predEv:p.ev, evMatch:evSetsEqual(r.ev,p.ev) });
  }
  for (const l of refAll.filter(x => x.status === 'missed'))
    rows.push({ type:'missed', refText:l.text, predText:null, refEv:l.ev, predEv:null, evMatch:false });
  for (const l of predAll.filter(x => x.status === 'extra'))
    rows.push({ type:'extra', refText:null, predText:l.text, refEv:null, predEv:l.ev, evMatch:false });
  return rows;
}

function TreeTextPanel({ treeStr, label, labelColor }) {
  if (!treeStr) return <div className="text-gray-400 italic text-xs py-6 text-center">No tree data</div>;
  const lines = treeStr.split('\n');
  return (
    <div className="rounded-lg border border-gray-200 overflow-hidden">
      <div className={`px-3 py-1.5 text-xs font-semibold border-b border-gray-200 ${labelColor}`}>{label}</div>
      <div className="p-3 overflow-x-auto bg-white space-y-0.5">
        {lines.map((line, i) => (
          <div key={i} className={`tree-block px-2 py-0.5 rounded ${classLine(line)}`}>{line || '\u00A0'}</div>
        ))}
      </div>
    </div>
  );
}

/* ── DIFF SPAN RENDERER (evaluation) ── */
function DiffView({ spans }) {
  if (!spans || spans.length === 0) return null;
  return (
    <div className="text-sm leading-relaxed p-3 bg-gray-50 rounded-lg border border-gray-200">
      {spans.map((sp, i) => {
        if (sp.op === 'equal') return <span key={i} className="diff-equal">{sp.ref}</span>;
        return (
          <span key={i}>
            {sp.ref  && <span className="diff-delete">{sp.ref}</span>}
            {sp.pred && <span className="diff-insert"> {sp.pred}</span>}
          </span>
        );
      })}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   REPORT VIEWER
══════════════════════════════════════════════════════════ */
function ReportViewer({ reportData, onBack }) {
  const [activeTab,    setActiveTab]    = useState('s1');
  const [expandedSec,  setExpandedSec]  = useState(null);
  const [filterLow,    setFilterLow]    = useState(false);
  const [annotData,    setAnnotData]    = useState(null);

  /* optional: load annotation JSON to resolve truncated leaf text */
  const loadAnnot = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = ev => { try { setAnnotData(JSON.parse(ev.target.result)); } catch(err) { alert('Annotation load failed: ' + err.message); } };
    r.readAsText(f); e.target.value = '';
  };

  const annotTextLookup = useMemo(() => {
    if (!annotData?.logic_trees) return {};
    const lookup = {};
    const collect = (node, secId) => {
      if (!node) return;
      if (node.type === 'leaf' && node.text) {
        const full = node.text.trim();
        lookup[secId + '::' + full.slice(0, 35)] = full;
      }
      (node.children || []).forEach(c => collect(c, secId));
    };
    Object.entries(annotData.logic_trees).forEach(([secId, tree]) => collect(tree, secId));
    return lookup;
  }, [annotData]);

  const resolveText = (secId, truncated) => {
    if (!truncated) return truncated;
    const clean = truncated.replace(/…$/, '').trim();
    if (!truncated.endsWith('…')) return truncated;
    for (const [k, v] of Object.entries(annotTextLookup)) {
      if (k.startsWith(secId + '::') && v.startsWith(clean)) return v;
    }
    return truncated;
  };

  const s1     = reportData.stage1  || {};
  const s2     = reportData.stage2  || {};
  const s3     = reportData.stage3  || {};
  const iaa    = reportData.inter_annotator_agreement || {};
  const errSum = reportData.error_summary || {};
  const errLog = reportData.error_log || [];
  const perSec = s2.per_section || {};

  const secTextMap = useMemo(() => {
    const m = {};
    (s1.matches || []).forEach(match => {
      if (match.ref_id)  m[match.ref_id]           = { ref:match.ref_text, pred:match.pred_text, predId:match.pred_id, sim:match.similarity, isSubset:match.is_subset, subsetDir:match.subset_direction, diffSpans:match.diff_spans };
      if (match.pred_id) m['pred_' + match.pred_id] = { text:match.pred_text };
    });
    (s1.unmatched_ref  || []).forEach(s => { m[s.id]           = { ref:s.text, pred:null }; });
    (s1.unmatched_pred || []).forEach(s => { m['pred_' + s.id] = { text:s.text }; });
    return m;
  }, [s1]);

  const exactMatches   = (s1.matches || []).filter(m => !m.is_subset);
  const subsetMatches  = (s1.matches || []).filter(m =>  m.is_subset);
  const missedSecs     = s1.unmatched_ref  || [];
  const spuriousSecs   = s1.unmatched_pred || [];

  const secIds  = Object.keys(perSec);
  const shownIds = filterLow ? secIds.filter(id => (perSec[id].leaf_f1 || 0) < 0.8) : secIds;

  const tabs = [
    { id:'s1',  label:'Stage 1 — Sections', icon:FileText  },
    { id:'s2',  label:'Stage 2 — Trees',    icon:GitBranch },
    { id:'s3',  label:'Stage 3 — CPT',      icon:LinkIcon  },
    { id:'iaa', label:'Agreement',          icon:Layers    },
  ];

  return (
    <div className="min-h-screen bg-gray-50">
      {/* Report header */}
      <header className="bg-white border-b border-gray-200 px-6 py-4 sticky top-0 z-30">
        <div className="max-w-7xl mx-auto flex items-center justify-between">
          <div className="flex items-center gap-3">
            <button onClick={onBack} className="flex items-center gap-1.5 px-3 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 text-sm">
              <ArrowLeft size={16}/> Back to Annotation
            </button>
            <div>
              <h1 className="text-lg font-bold text-gray-900 flex items-center gap-2"><BarChart size={18} className="text-teal-600"/> Evaluation Report</h1>
              <p className="text-xs text-gray-400 mt-0.5">Inter-annotator: {iaa.pairs?.[0]?.annotator_a} vs {iaa.pairs?.[0]?.annotator_b}</p>
            </div>
          </div>
          {/* Summary chips */}
          <div className="flex gap-3 text-sm">
            {[['§1 F1', s1.section_f1], ['Leaf F1', s2.macro_leaf_f1], ['Op.Acc', s2.macro_operator_accuracy]].map(([l, v]) => (
              <div key={l} className={`px-3 py-1.5 rounded-lg ${sBg(v)}`}>
                <span className="text-xs text-gray-500">{l} </span>
                <span className={`font-bold ${sColor(v)}`}>{pct(v)}</span>
              </div>
            ))}
          </div>
        </div>
        {/* Sub tabs */}
        <div className="max-w-7xl mx-auto mt-3 flex gap-1">
          {tabs.map(t => (
            <button key={t.id} onClick={() => setActiveTab(t.id)}
              className={`flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm transition-all ${activeTab === t.id ? 'bg-teal-100 text-teal-700 font-semibold' : 'bg-gray-100 text-gray-500 hover:bg-gray-200'}`}>
              <t.icon size={15}/>{t.label}
            </button>
          ))}
        </div>
      </header>

      <main className="max-w-7xl mx-auto px-6 py-6">

        {/* ── STAGE 1 ── */}
        {activeTab === 's1' && (
          <div className="space-y-6">
            <div className="grid grid-cols-3 sm:grid-cols-6 gap-3">
              <MCard label="Precision"   value={s1.section_precision}/>
              <MCard label="Recall"      value={s1.section_recall}/>
              <MCard label="F1"          value={s1.section_f1}/>
              <MCard label="Text Sim."   value={s1.mean_text_similarity}/>
              <MCard label="Matched"     raw={s1.n_matched ?? '—'} value={null} sub={`of ${s1.n_ref_total ?? '?'} ref`}/>
              <MCard label="Spurious"    raw={s1.n_spurious ?? '—'} value={s1.n_spurious === 0 ? 1 : 0} sub="extra predicted"/>
            </div>
            {[
              { title:`Matched — Exact (${exactMatches.length})`,          bg:'bg-green-50',  border:'border-green-200',  badge:'bg-green-100 text-green-800',   items:exactMatches,  kind:'match'    },
              { title:`Matched — Subset (${subsetMatches.length})`,         bg:'bg-yellow-50', border:'border-yellow-200', badge:'bg-yellow-100 text-yellow-800', items:subsetMatches, kind:'match'    },
              { title:`Missed — Not Predicted (${missedSecs.length})`,      bg:'bg-red-50',    border:'border-red-200',    badge:'bg-red-100 text-red-800',       items:missedSecs,    kind:'missed'   },
              { title:`Spurious — Extra Predicted (${spuriousSecs.length})`,bg:'bg-orange-50', border:'border-orange-200', badge:'bg-orange-100 text-orange-800', items:spuriousSecs,  kind:'spurious' },
            ].map(cat => <SectionCategory key={cat.title} cat={cat}/>)}
          </div>
        )}

        {/* ── STAGE 2 ── */}
        {activeTab === 's2' && (
          <div className="space-y-5">
            <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
              <MCard label="Leaf F1 (macro)"   value={s2.macro_leaf_f1}/>
              <MCard label="Operator Accuracy" value={s2.macro_operator_accuracy}/>
              <MCard label="Evidence Accuracy" value={s2.macro_evidence_accuracy}/>
            </div>

            <div className="rounded-lg bg-amber-50 border border-amber-200 p-3 text-xs text-amber-800 flex items-start gap-2">
              <Info size={14} className="text-amber-600 shrink-0 mt-0.5"/>
              <span>Leaf text ending in <code className="bg-amber-100 px-1 rounded font-mono">…</code> is truncated by the report generator. Load the Annotation JSON (optional button below) to show the full untruncated text.</span>
            </div>

            {/* Legend */}
            <div className="flex flex-wrap gap-4 text-xs text-gray-500">
              {[['tree-matched border-l-4 border-green-400','Matched leaf (✓)'],['tree-missed border-l-4 border-red-400','Missed (in ref, not in pred)'],['tree-extra border-l-4 border-orange-400','Extra (in pred, not in ref)'],['tree-operator','Operator node']].map(([cls,lbl]) => (
                <span key={lbl} className="flex items-center gap-1.5">
                  <span className={`inline-block w-4 h-4 rounded-sm text-xs font-mono flex items-center justify-center ${cls}`}></span>{lbl}
                </span>
              ))}
            </div>

            {/* annotation loader + filter */}
            <div className="flex items-center gap-4 flex-wrap">
              <span className="text-sm font-semibold text-gray-700">Per-Section ({shownIds.length} of {secIds.length})</span>
              <label className="flex items-center gap-1.5 text-sm text-gray-600 cursor-pointer select-none">
                <input type="checkbox" checked={filterLow} onChange={e => setFilterLow(e.target.checked)} className="rounded text-red-500"/>
                Show low F1 only (&lt;80%)
              </label>
              <label className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs cursor-pointer border ${annotData ? 'bg-teal-50 border-teal-300 text-teal-700' : 'bg-white border-gray-300 text-gray-600 hover:border-teal-400 hover:text-teal-600'}`}>
                <FileText size={13}/>
                {annotData ? 'Annotation loaded ✓ — showing full leaf text' : 'Load Annotation JSON (optional — for full leaf text)'}
                <input type="file" accept=".json" onChange={loadAnnot} className="hidden"/>
              </label>
              {annotData && <button onClick={() => setAnnotData(null)} className="text-xs text-gray-400 hover:text-red-500 px-1">✕ clear</button>}
            </div>

            <div className="space-y-2">
              {shownIds.map(secId => {
                const sec  = perSec[secId];
                const info = secTextMap[secId] || {};
                const open = expandedSec === secId;
                return (
                  <SecTreeRow key={secId} secId={secId} sec={sec} info={info}
                    open={open} onToggle={() => setExpandedSec(open ? null : secId)}
                    resolveText={t => resolveText(secId, t)}/>
                );
              })}
              {shownIds.length === 0 && <div className="text-center py-8 text-gray-400 text-sm">No sections match filter.</div>}
            </div>
          </div>
        )}

        {/* ── STAGE 3 ── */}
        {activeTab === 's3' && (() => {
          /* New format: s3.per_code array with {code, result, pred_sections, ref_sections, is_addition} */
          /* Fallback: error_log entries for older reports */
          const perCode   = s3.per_code || [];
          const usePerCode = perCode.length > 0;

          const correct   = usePerCode
            ? perCode.filter(e => e.result === 'correct')
            : errLog.filter(e => e.stage === 'stage3' && e.error_type === 'correct_code');
          const missed    = usePerCode
            ? perCode.filter(e => e.result === 'missing_code' || e.result === 'missed_code')
            : errLog.filter(e => e.stage === 'stage3' && (e.error_type === 'missing_code' || e.error_type === 'missed_code'));
          const spurious  = usePerCode
            ? perCode.filter(e => e.result === 'spurious_code')
            : errLog.filter(e => e.stage === 'stage3' && e.error_type === 'spurious_code');
          const wrongLink = usePerCode
            ? perCode.filter(e => e.result === 'wrong_section_link')
            : errLog.filter(e => e.stage === 'stage3' && e.error_type === 'wrong_section_link');

          /* Resolve section IDs — prefer dedicated array fields, fallback to text parsing */
          const getSecIds = (entry, field) => {
            if (usePerCode) {
              const arr = field === 'ref' ? entry.ref_sections : entry.pred_sections;
              return Array.isArray(arr) ? arr : [];
            }
            const dedicated = field === 'ref' ? entry.ref_sections : entry.pred_sections;
            if (Array.isArray(dedicated) && dedicated.length > 0) return dedicated;
            const txt = field === 'ref' ? (entry.ref_text || '') : (entry.pred_text || '');
            const matches = txt.match(/sec\d+/g);
            return matches ? [...new Set(matches)] : [];
          };

          /* Get CPT code string from entry */
          const getCode = (entry) => {
            if (usePerCode) return String(entry.code || '');
            return ((entry.pred_text || entry.ref_text || entry.cpt_code || '')).replace(/^\+\s*/, '');
          };

          /* Get add-on flag */
          const isAddon = (entry) => usePerCode ? !!entry.is_addition : !!(entry.is_addon);

          /* Resolve section text from secTextMap — full content, no truncation */
          const getSecText = (secId) => {
            if (!secId) return null;
            const entry = secTextMap[secId];
            return entry ? (entry.ref || entry.pred || null) : null;
          };

          const SecBlock = ({ secId, borderColor, textColor }) => {
            const txt = getSecText(secId);
            return (
              <div className={`pl-2 border-l-2 ${borderColor} mb-3`}>
                <span className={`font-mono text-xs font-bold ${textColor}`}>{secId}</span>
                {txt
                  ? <div className="text-gray-700 text-xs mt-1 leading-relaxed" style={{whiteSpace:'pre-wrap'}}>{txt}</div>
                  : <div className="text-gray-400 text-xs italic mt-0.5">Section content not available</div>
                }
              </div>
            );
          };

          const CodeCard = ({ entry, chipColor, borderColor, textColor, secField }) => {
            const code   = getCode(entry);
            const secIds = getSecIds(entry, secField);
            return (
              <div className={`rounded-lg border ${borderColor} bg-white p-3 space-y-2`}>
                <div className="flex items-center gap-2">
                  <span className={`font-mono text-sm font-bold px-2 py-0.5 rounded ${chipColor}`}>{code}</span>
                  {isAddon(entry) && <span className="text-xs bg-orange-100 text-orange-700 font-bold px-1.5 py-0.5 rounded">Add-on</span>}
                </div>
                {secIds.length > 0
                  ? secIds.map((sid, i) => <SecBlock key={i} secId={sid} borderColor={borderColor} textColor={textColor}/>)
                  : <div className="text-xs text-gray-400 italic">No section links</div>
                }
              </div>
            );
          };

          return (
            <div className="space-y-5">
              {/* Metric cards */}
              <div className="grid grid-cols-2 sm:grid-cols-5 gap-3">
                <MCard label="Code Precision"       value={s3.code_precision}/>
                <MCard label="Code Recall"          value={s3.code_recall}/>
                <MCard label="Code F1"              value={s3.code_f1}/>
                <MCard label="Section Link Jaccard" value={s3.mean_section_link_jaccard}/>
                <MCard label="Add-on Accuracy"      value={s3.is_addition_accuracy}/>
              </div>

              <div className="text-sm font-semibold text-gray-700">CPT Code Breakdown</div>

              {/* ── CORRECT CODES ── */}
              <div className={`rounded-lg border p-4 ${correct.length > 0 ? 'border-green-200 bg-green-50' : 'border-gray-200 bg-gray-50'}`}>
                <div className="flex items-center gap-2 mb-3">
                  <span className="text-sm font-semibold text-green-800">✓ Correct Codes</span>
                  <span className={`text-xs px-2 py-0.5 rounded-full font-bold ${correct.length > 0 ? 'bg-green-200 text-green-900' : 'bg-gray-200 text-gray-600'}`}>{correct.length}</span>
                  <span className="text-xs text-gray-500">— code and section links match reference</span>
                </div>
                {correct.length > 0
                  ? <div className="space-y-2">{correct.map((e,i) => <CodeCard key={i} entry={e} secField="pred"
                      chipColor="bg-green-100 text-green-800 border border-green-300"
                      borderColor="border-green-200" textColor="text-green-800"/>)}</div>
                  : <div className="text-xs text-gray-400 italic">No correct codes</div>
                }
              </div>

              {/* ── MISSED CODES ── */}
              <div className={`rounded-lg border p-4 ${missed.length > 0 ? 'border-red-200 bg-red-50' : 'border-gray-200 bg-gray-50'}`}>
                <div className="flex items-center gap-2 mb-3">
                  <span className="text-sm font-semibold text-red-800">✗ Missed Codes</span>
                  <span className={`text-xs px-2 py-0.5 rounded-full font-bold ${missed.length > 0 ? 'bg-red-200 text-red-900' : 'bg-gray-200 text-gray-600'}`}>{missed.length}</span>
                  <span className="text-xs text-gray-500">— in reference but not predicted</span>
                </div>
                {missed.length > 0
                  ? <div className="space-y-2">{missed.map((e,i) => <CodeCard key={i} entry={e} secField="ref"
                      chipColor="bg-red-100 text-red-800 border border-red-300"
                      borderColor="border-red-200" textColor="text-red-800"/>)}</div>
                  : <div className="text-xs text-gray-400 italic">No missed codes</div>
                }
              </div>

              {/* ── EXTRA CODES (spurious) ── */}
              <div className={`rounded-lg border p-4 ${spurious.length > 0 ? 'border-orange-200 bg-orange-50' : 'border-gray-200 bg-gray-50'}`}>
                <div className="flex items-center gap-2 mb-3">
                  <span className="text-sm font-semibold text-orange-800">+ Extra Codes</span>
                  <span className={`text-xs px-2 py-0.5 rounded-full font-bold ${spurious.length > 0 ? 'bg-orange-200 text-orange-900' : 'bg-gray-200 text-gray-600'}`}>{spurious.length}</span>
                  <span className="text-xs text-gray-500">— predicted but not in reference</span>
                </div>
                {spurious.length > 0
                  ? <div className="space-y-2">{spurious.map((e,i) => <CodeCard key={i} entry={e} secField="pred"
                      chipColor="bg-orange-100 text-orange-800 border border-orange-300"
                      borderColor="border-orange-200" textColor="text-orange-800"/>)}</div>
                  : <div className="text-xs text-gray-400 italic">No extra codes</div>
                }
              </div>

              {/* ── WRONG SECTION LINKS ── */}
              <div className={`rounded-lg border p-4 ${wrongLink.length > 0 ? 'border-yellow-200 bg-yellow-50' : 'border-gray-200 bg-gray-50'}`}>
                <div className="flex items-center gap-2 mb-3">
                  <span className="text-sm font-semibold text-yellow-800">⚠ Wrong Section Links</span>
                  <span className={`text-xs px-2 py-0.5 rounded-full font-bold ${wrongLink.length > 0 ? 'bg-yellow-200 text-yellow-900' : 'bg-gray-200 text-gray-600'}`}>{wrongLink.length}</span>
                  <span className="text-xs text-gray-500">— code matched but linked sections differ</span>
                </div>
                {wrongLink.length > 0
                  ? <div className="space-y-4">
                      {wrongLink.map((e, i) => {
                        const code       = getCode(e);
                        const refSecIds  = getSecIds(e, 'ref');
                        const predSecIds = getSecIds(e, 'pred');
                        return (
                          <div key={i} className="rounded-lg border border-yellow-200 bg-white p-3 space-y-3">
                            <div className="flex items-center gap-2">
                              <span className="font-mono text-sm font-bold px-2 py-0.5 rounded bg-yellow-100 text-yellow-900 border border-yellow-300">{code}</span>
                              {isAddon(e) && <span className="text-xs bg-orange-100 text-orange-700 font-bold px-1.5 py-0.5 rounded">Add-on</span>}
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                              <div className="rounded border border-blue-200 bg-blue-50 p-3">
                                <div className="text-xs font-bold text-blue-700 mb-2">Reference Sections ({refSecIds.length})</div>
                                {refSecIds.length > 0
                                  ? refSecIds.map((sid,j) => <SecBlock key={j} secId={sid} borderColor="border-blue-300" textColor="text-blue-800"/>)
                                  : <div className="text-xs text-gray-400 italic">None</div>}
                              </div>
                              <div className="rounded border border-purple-200 bg-purple-50 p-3">
                                <div className="text-xs font-bold text-purple-700 mb-2">Predicted Sections ({predSecIds.length})</div>
                                {predSecIds.length > 0
                                  ? predSecIds.map((sid,j) => <SecBlock key={j} secId={sid} borderColor="border-purple-300" textColor="text-purple-800"/>)
                                  : <div className="text-xs text-gray-400 italic">None</div>}
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  : <div className="text-xs text-gray-400 italic">No wrong section links</div>
                }
              </div>

            </div>
          );
        })()}

        {/* ── INTER-ANNOTATOR ── */}
        {activeTab === 'iaa' && (
          <div className="space-y-6">
            {iaa.pairs?.length > 0 && (
              <div className="overflow-x-auto rounded-xl border border-gray-200">
                <table className="w-full text-sm">
                  <thead className="bg-gray-50">
                    <tr>{['Annotator A','Annotator B','§1 F1','Leaf F1','Op Acc','CPT F1','Link Jaccard'].map(h => (
                      <th key={h} className="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide">{h}</th>
                    ))}</tr>
                  </thead>
                  <tbody>
                    {iaa.pairs.map((p, i) => (
                      <tr key={i} className="border-t border-gray-100 hover:bg-gray-50">
                        <td className="px-4 py-3 font-mono text-xs">{p.annotator_a}</td>
                        <td className="px-4 py-3 font-mono text-xs">{p.annotator_b}</td>
                        <td className={`px-4 py-3 font-bold text-sm ${sColor(p.stage1_section_f1)}`}>{pct(p.stage1_section_f1)}</td>
                        <td className={`px-4 py-3 font-bold text-sm ${sColor(p.stage2_leaf_f1)}`}>{pct(p.stage2_leaf_f1)}</td>
                        <td className={`px-4 py-3 font-bold text-sm ${sColor(p.stage2_operator_accuracy)}`}>{pct(p.stage2_operator_accuracy)}</td>
                        <td className={`px-4 py-3 font-bold text-sm ${sColor(p.stage3_code_f1)}`}>{pct(p.stage3_code_f1)}</td>
                        <td className={`px-4 py-3 font-bold text-sm ${sColor(p.stage3_link_jaccard)}`}>{pct(p.stage3_link_jaccard)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
            {errSum.by_type && (
              <div>
                <h3 className="font-semibold text-gray-700 mb-3">Error Breakdown</h3>
                <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-5 gap-3">
                  {Object.entries(errSum.by_type).map(([type, count]) => (
                    <div key={type} className="rounded-xl border border-gray-200 bg-gray-50 p-4">
                      <div className="text-2xl font-bold text-gray-700">{count}</div>
                      <div className="text-xs text-gray-500 mt-1">{type.replace(/_/g,' ')}</div>
                    </div>
                  ))}
                  <div className="rounded-xl border border-gray-200 bg-gray-100 p-4">
                    <div className="text-2xl font-bold text-gray-700">{errSum.total_entries ?? '—'}</div>
                    <div className="text-xs text-gray-500 mt-1">total entries</div>
                  </div>
                </div>
              </div>
            )}
          </div>
        )}
      </main>
    </div>
  );
}

/* Section category panel for Stage 1 */
function SectionCategory({ cat }) {
  const [expanded, setExpanded] = useState(null);
  if (cat.items.length === 0) return (
    <div className={`rounded-xl border ${cat.border} ${cat.bg} p-4`}>
      <h3 className="font-semibold text-gray-700 text-sm">{cat.title}</h3>
      <p className="text-xs text-gray-400 mt-2">None</p>
    </div>
  );
  return (
    <div className={`rounded-xl border ${cat.border} ${cat.bg}`}>
      <div className="p-4 border-b border-gray-200"><h3 className="font-semibold text-gray-800 text-sm">{cat.title}</h3></div>
      <div className="divide-y divide-gray-100">
        {cat.items.map((item, i) => {
          const key  = cat.kind === 'match' ? item.ref_id : item.id;
          const isOpen = expanded === key;
          const sim  = cat.kind === 'match' ? item.similarity : null;
          return (
            <div key={key}>
              <button onClick={() => setExpanded(isOpen ? null : key)} className="w-full flex items-center gap-3 px-4 py-3 text-left hover:bg-white/60 transition-colors">
                <span className="font-mono text-xs font-bold text-gray-600 w-24 shrink-0">
                  {cat.kind === 'match' ? `${item.ref_id} ↔ ${item.pred_id}` : item.id}
                </span>
                <p className="flex-1 text-sm text-gray-700 line-clamp-2">
                  {cat.kind === 'match' ? item.ref_text : (item.text || '')}
                </p>
                {sim != null && <span className={`text-xs font-medium px-2 py-0.5 rounded-full shrink-0 ${sBg(sim)} ${sColor(sim)}`}>sim {(sim * 100).toFixed(1)}%</span>}
                {cat.kind === 'match' && item.is_subset && <span className="text-xs px-2 py-0.5 bg-yellow-100 text-yellow-800 rounded-full shrink-0">{item.subset_direction === 'ref_in_pred' ? 'ref⊂pred' : 'pred⊂ref'}</span>}
                {isOpen ? <ChevronDown size={15} className="text-gray-400 shrink-0"/> : <ChevronRight size={15} className="text-gray-400 shrink-0"/>}
              </button>
              {isOpen && (
                <div className="px-4 pb-4 bg-white/70 space-y-3">
                  {cat.kind === 'match' && (
                    <>
                      <div className="grid grid-cols-1 lg:grid-cols-2 gap-3">
                        <div>
                          <div className="text-xs font-semibold text-blue-700 mb-1">Reference ({item.ref_id})</div>
                          <div className="text-xs bg-blue-50 border border-blue-100 rounded p-3 whitespace-pre-wrap">{item.ref_text}</div>
                        </div>
                        <div>
                          <div className="text-xs font-semibold text-purple-700 mb-1">Predicted ({item.pred_id})</div>
                          <div className="text-xs bg-purple-50 border border-purple-100 rounded p-3 whitespace-pre-wrap">{item.pred_text}</div>
                        </div>
                      </div>
                      {item.diff_spans && item.diff_spans.length > 0 && (
                        <div>
                          <div className="text-xs font-semibold text-gray-600 mb-1">Diff view <span className="font-normal text-gray-400">(yellow = inserted in pred, red = removed from ref)</span></div>
                          <DiffView spans={item.diff_spans}/>
                        </div>
                      )}
                    </>
                  )}
                  {cat.kind !== 'match' && (
                    <div className="text-xs bg-white border border-gray-100 rounded p-3 whitespace-pre-wrap">{item.text}</div>
                  )}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* Per-section tree row for Stage 2 */
function SecTreeRow({ secId, sec, info, open, onToggle, resolveText }) {
  return (
    <div className="rounded-xl border border-gray-200 bg-white overflow-hidden">
      <button onClick={onToggle} className="w-full flex items-center gap-3 px-4 py-3 text-left hover:bg-gray-50 transition-colors">
        <span className="font-mono text-sm font-bold text-gray-600 w-16 shrink-0">{secId}</span>
        <div className="flex flex-wrap gap-1.5 flex-1">
          {[['Leaf F1', sec.leaf_f1], ['Op.Acc', sec.operator_accuracy], ['Evid.Acc', sec.evidence_accuracy]].map(([l, v]) => (
            <span key={l} className={`text-xs px-2 py-0.5 rounded-full font-medium ${sBg(v)} ${sColor(v)}`}>{l}: {pct(v)}</span>
          ))}
        </div>
        {open ? <ChevronDown size={16} className="text-gray-400 shrink-0"/> : <ChevronRight size={16} className="text-gray-400 shrink-0"/>}
      </button>
      {open && (
        <div className="border-t border-gray-100 p-4 bg-gray-50 space-y-4">
          <div className="flex flex-wrap gap-5 text-xs text-gray-500 border-b border-gray-200 pb-3">
            <span>Leaf precision: <strong className={sColor(sec.leaf_precision)}>{pct(sec.leaf_precision)}</strong></span>
            <span>Leaf recall: <strong className={sColor(sec.leaf_recall)}>{pct(sec.leaf_recall)}</strong></span>
            <span>Mean leaf sim: <strong>{sec.mean_leaf_similarity != null ? sec.mean_leaf_similarity.toFixed(4) : 'N/A'}</strong></span>
          </div>
          {(info.ref || info.pred) && (
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-3">
              {info.ref && <div>
                <div className="text-xs font-semibold text-blue-700 mb-1">Reference section text</div>
                <div className="text-xs bg-blue-50 border border-blue-100 rounded p-3 whitespace-pre-wrap leading-relaxed">{info.ref}</div>
              </div>}
              {info.pred && <div>
                <div className="text-xs font-semibold text-purple-700 mb-1">Predicted section text {info.predId && <span className="font-normal text-gray-400">({info.predId})</span>}</div>
                <div className="text-xs bg-purple-50 border border-purple-100 rounded p-3 whitespace-pre-wrap leading-relaxed">{info.pred}</div>
              </div>}
            </div>
          )}
          {!info.ref && !info.pred && <div className="text-xs text-gray-400 italic">Section text not available.</div>}
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div className={`rounded-lg p-3 border ${sBg(sec.evidence_accuracy)} border-gray-200`}>
              <div className="text-xs font-semibold text-gray-600 mb-1">Evidence Type Accuracy</div>
              <div className={`text-2xl font-bold ${sColor(sec.evidence_accuracy)}`}>{pct(sec.evidence_accuracy)}</div>
            </div>
          </div>
          {(sec.ref_tree || sec.pred_tree) && (
            <LeafComparisonPanel rows={buildLeafRows(sec.ref_tree, sec.pred_tree)} resolveText={resolveText}/>
          )}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <TreeTextPanel treeStr={sec.ref_tree}  label="Reference Tree (Ground Truth)" labelColor="bg-blue-50 text-blue-800"/>
            <TreeTextPanel treeStr={sec.pred_tree} label="Predicted Tree"                labelColor="bg-purple-50 text-purple-800"/>
          </div>
        </div>
      )}
    </div>
  );
}

/* Per-leaf evidence comparison */
function EvBadge({ ev, bad }) {
  if (!ev || ev.length === 0) return <span className="text-gray-300 text-xs">—</span>;
  return (
    <div className="flex flex-wrap gap-1 justify-center">
      {ev.map((e, i) => (
        <span key={i} className={`inline-block px-1.5 py-0.5 rounded text-xs font-mono whitespace-nowrap ${bad ? 'bg-red-100 text-red-700 font-semibold' : 'bg-blue-50 text-blue-700'}`}>{e}</span>
      ))}
    </div>
  );
}
function LeafComparisonPanel({ rows, resolveText }) {
  if (!rows || rows.length === 0) return <div className="text-xs text-gray-400 italic py-2">No leaf data parsed from trees.</div>;
  const evBad  = rows.filter(r => r.type === 'matched' && !r.evMatch).length;
  const missed = rows.filter(r => r.type === 'missed').length;
  const extra  = rows.filter(r => r.type === 'extra').length;
  return (
    <div>
      <div className="flex items-center gap-2 mb-2 flex-wrap">
        <span className="text-xs font-semibold text-gray-700">Per-Leaf Ref vs Pred</span>
        {missed > 0 && <span className="text-xs px-2 py-0.5 bg-red-100 text-red-700 rounded-full">{missed} missed leaf{missed > 1 ? 's' : ''}</span>}
        {extra  > 0 && <span className="text-xs px-2 py-0.5 bg-orange-100 text-orange-700 rounded-full">{extra} extra leaf{extra > 1 ? 's' : ''}</span>}
        {evBad  > 0 && <span className="text-xs px-2 py-0.5 bg-rose-100 text-rose-700 rounded-full">{evBad} evidence mismatch{evBad > 1 ? 'es' : ''}</span>}
        {evBad === 0 && missed === 0 && extra === 0 && <span className="text-xs px-2 py-0.5 bg-green-100 text-green-700 rounded-full">All match ✓</span>}
      </div>
      <div className="rounded-lg border border-gray-200 overflow-x-auto">
        <table className="w-full text-xs border-collapse">
          <thead>
            <tr className="bg-gray-50 border-b border-gray-200">
              <th className="px-2 py-2 text-left text-gray-500 font-semibold w-6">#</th>
              <th className="px-3 py-2 text-left text-gray-500 font-semibold">Leaf Requirement</th>
              <th className="px-3 py-2 text-center text-blue-600 font-semibold whitespace-nowrap">Ref Evidence</th>
              <th className="px-3 py-2 text-center text-purple-600 font-semibold whitespace-nowrap">Pred Evidence</th>
              <th className="px-2 py-2 text-center text-gray-400 font-semibold w-6">Ev</th>
            </tr>
          </thead>
          <tbody>
            {rows.map((row, i) => {
              let rowBg = 'bg-green-50';
              if (row.type === 'missed')              rowBg = 'bg-red-50';
              else if (row.type === 'extra')          rowBg = 'bg-orange-50';
              else if (!row.evMatch)                  rowBg = 'bg-yellow-50';
              const refTxt  = resolveText ? resolveText(row.refText  || '') : row.refText  || '';
              const predTxt = resolveText ? resolveText(row.predText || '') : row.predText || '';
              return (
                <tr key={i} className={`border-b border-gray-100 ${rowBg}`}>
                  <td className="px-2 py-2 text-gray-400 font-mono align-top text-center">{i + 1}</td>
                  <td className="px-3 py-2 align-top" style={{minWidth:'220px',maxWidth:'420px',wordBreak:'break-word'}}>
                    {row.type === 'matched' && <>
                      {refTxt  && <div className="text-gray-800 mb-0.5" style={{whiteSpace:'pre-wrap'}}>{refTxt}</div>}
                      {predTxt && predTxt !== refTxt && <div className="text-purple-700 text-xs mt-1 italic" style={{whiteSpace:'pre-wrap'}}>pred: {predTxt}</div>}
                    </>}
                    {row.type === 'missed' && <div className="text-red-700"    style={{whiteSpace:'pre-wrap'}}><span className="font-semibold">MISSED: </span>{refTxt  || row.refText}</div>}
                    {row.type === 'extra'  && <div className="text-orange-700" style={{whiteSpace:'pre-wrap'}}><span className="font-semibold">EXTRA: </span>{predTxt || row.predText}</div>}
                  </td>
                  <td className="px-3 py-2 align-top text-center"><EvBadge ev={row.refEv}  bad={!row.evMatch && row.type === 'matched'}/></td>
                  <td className="px-3 py-2 align-top text-center"><EvBadge ev={row.predEv} bad={!row.evMatch && row.type === 'matched'}/></td>
                  <td className={`px-2 py-2 text-center text-base align-top font-bold ${row.evMatch ? 'text-green-500' : 'text-red-500'}`}>{row.type === 'matched' ? (row.evMatch ? '✓' : '✗') : '—'}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ── READ-ONLY RECURSIVE TREE DISPLAY (from annotation JSON) ── */
function AnnotationTreeDisplay({ node, depth = 0 }) {
  const [expanded, setExpanded] = useState(true);
  if (!node) return null;
  const isOp = ['ALL','ANY'].includes(node.type);
  if (isOp) {
    const opCls = node.type === 'ALL' ? 'bg-green-100 text-green-800 border-green-300' : 'bg-yellow-100 text-yellow-800 border-yellow-300';
    return (
      <div className={depth > 0 ? 'ml-4 pl-3 border-l-2 border-gray-200' : ''}>
        <div className="flex items-center gap-1.5 py-0.5 cursor-pointer select-none" onClick={() => setExpanded(!expanded)}>
          <span className="text-gray-400 text-xs">{expanded ? '▾' : '▸'}</span>
          <span className={`font-mono text-xs font-bold px-1.5 py-0.5 rounded border ${opCls}`}>{node.type}</span>
          <span className="text-xs text-gray-400">({(node.children||[]).length})</span>
        </div>
        {expanded && (node.children||[]).map((c,i) => <AnnotationTreeDisplay key={i} node={c} depth={depth+1}/>)}
      </div>
    );
  }
  return (
    <div className="ml-4 pl-3 border-l-2 border-gray-200 py-0.5 mb-1">
      <div className="text-xs text-gray-800 leading-relaxed whitespace-pre-wrap">{node.text || <em className="text-gray-400">empty</em>}</div>
      {node.evidence_sources?.length > 0 && (
        <div className="flex gap-1 flex-wrap mt-0.5">
          {node.evidence_sources.map((ev,i) => <span key={i} className="text-xs bg-gray-100 text-gray-500 px-1.5 py-0.5 rounded font-mono">{ev}</span>)}
        </div>
      )}
    </div>
  );
}

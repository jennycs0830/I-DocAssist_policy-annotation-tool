<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Policy Annotation Tool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-4 { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    // Icons
    const ChevronRight = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m9 18 6-6-6-6"/></svg>);
    const ChevronDown = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m6 9 6 6 6-6"/></svg>);
    const Plus = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="M12 5v14"/></svg>);
    const Trash2 = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>);
    const GripVertical = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="9" cy="12" r="1"/><circle cx="9" cy="5" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="19" r="1"/></svg>);
    const Download = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>);
    const ArrowLeft = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>);
    const ArrowRight = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>);
    const FileText = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>);
    const Layers = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg>);
    const GitBranch = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>);
    const Link = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>);
    const Info = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>);
    const MessageSquare = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>);
    const Upload = ({ size = 24, className = "" }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>);

    // Instructions Panel
    function InstructionsPanel({ title, children, defaultOpen = true }) {
      const [isOpen, setIsOpen] = useState(defaultOpen);
      return (
        <div className="bg-blue-50 border border-blue-200 rounded-xl mb-6">
          <button onClick={() => setIsOpen(!isOpen)} className="w-full flex items-center justify-between p-4 text-left">
            <div className="flex items-center gap-2">
              <Info size={20} className="text-blue-600" />
              <span className="font-semibold text-blue-900">{title}</span>
            </div>
            {isOpen ? <ChevronDown size={20} className="text-blue-600" /> : <ChevronRight size={20} className="text-blue-600" />}
          </button>
          {isOpen && <div className="px-4 pb-4 text-sm text-blue-800">{children}</div>}
        </div>
      );
    }

    // Helpers
    const generateSectionId = (existingSections) => {
      return `sec${String(existingSections.length + 1).padStart(3, '0')}`;
    };

    const convertTreeToExportFormat = (node) => {
      if (!node) return null;
      const isOperator = ['ALL', 'ANY', 'NOT', 'IF', 'UNLESS'].includes(node.type);
      if (isOperator) {
        return { type: node.type, children: (node.children || []).map(convertTreeToExportFormat).filter(Boolean) };
      } else {
        return { type: 'leaf', text: node.text || '', evidence_sources: Array.isArray(node.evidence_sources) ? node.evidence_sources : (node.evidence_source ? [node.evidence_source] : []), time_sensitive: node.time_sensitive || false };
      }
    };

    // Fixed labels (controlled vocabulary - do not allow custom additions)
    const EVIDENCE_SOURCES = ['clinical_note', 'imaging_report', 'therapy_records', 'lab_result', 'prior_auth_form', 'operative_report', 'pathology_report', 'referral_letter', 'other'];

    // Main App
    function AnnotationTool() {
      const [currentStage, setCurrentStage] = useState(1);
      const [documentTitle, setDocumentTitle] = useState('');
      const [sections, setSections] = useState([]);
      const [sectionTrees, setSectionTrees] = useState({});
      const [cptMappings, setCptMappings] = useState([]);

      // Feedback state
      const [annotatorNotes, setAnnotatorNotes] = useState('');
      const [appFeedback, setAppFeedback] = useState('');
      const [showFeedbackPanel, setShowFeedbackPanel] = useState(false);

      const stages = [
        { id: 1, name: 'Section Extraction', icon: FileText },
        { id: 2, name: 'Atomic Breakdown', icon: GitBranch },
        { id: 3, name: 'CPT Mapping', icon: Link }
      ];

      const canProceed = () => {
        if (currentStage === 1) return sections.length > 0 && documentTitle.trim() !== '';
        if (currentStage === 2) return Object.keys(sectionTrees).length > 0;
        return true;
      };

      const exportData = () => {
        const sectionsExport = sections.map(s => ({ id: s.id, text: s.text }));

        const logicTreesExport = {};
        Object.keys(sectionTrees).forEach(sectionId => {
          const tree = sectionTrees[sectionId];
          if (tree) logicTreesExport[sectionId] = convertTreeToExportFormat(tree);
        });

        const cptMappingsExport = {};
        cptMappings.forEach(mapping => {
          cptMappingsExport[mapping.cpt_code] = {
            sections: mapping.sections || []
          };
        });

        const timestamp = new Date().toISOString();
        const filePrefix = documentTitle.replace(/\s+/g, '_') || 'annotation';

        // Main annotation export (without notes/feedback)
        const mainExport = {
          document_title: documentTitle,
          sections: sectionsExport,
          logic_trees: logicTreesExport,
          cpt_mappings: cptMappingsExport,
          exported_at: timestamp
        };

        // Notes/feedback export (separate file)
        const feedbackExport = {
          document_title: documentTitle,
          annotator_notes: annotatorNotes,
          app_feedback: appFeedback,
          exported_at: timestamp
        };

        // Download main annotation file
        const mainBlob = new Blob([JSON.stringify(mainExport, null, 2)], { type: 'application/json' });
        const mainUrl = URL.createObjectURL(mainBlob);
        const mainLink = document.createElement('a');
        mainLink.href = mainUrl;
        mainLink.download = `${filePrefix}_annotation.json`;
        mainLink.click();
        URL.revokeObjectURL(mainUrl);

        // Download feedback file only if there's content
        if (annotatorNotes.trim() || appFeedback.trim()) {
          setTimeout(() => {
            const feedbackBlob = new Blob([JSON.stringify(feedbackExport, null, 2)], { type: 'application/json' });
            const feedbackUrl = URL.createObjectURL(feedbackBlob);
            const feedbackLink = document.createElement('a');
            feedbackLink.href = feedbackUrl;
            feedbackLink.download = `${filePrefix}_feedback.json`;
            feedbackLink.click();
            URL.revokeObjectURL(feedbackUrl);
          }, 500);
        }
      };

      // Convert imported tree format back to internal format with IDs
      const convertImportedTree = (node) => {
        if (!node) return null;
        const id = `node_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
        if (node.type === 'leaf') {
          return { id, type: 'leaf', text: node.text || '', children: [], evidence_sources: Array.isArray(node.evidence_sources) ? node.evidence_sources : (node.evidence_source ? [node.evidence_source] : []), time_sensitive: node.time_sensitive || false };
        } else {
          return { id, type: node.type, text: '', children: (node.children || []).map(convertImportedTree).filter(Boolean), evidence_sources: [], time_sensitive: false };
        }
      };

      const importData = (event) => {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = JSON.parse(e.target.result);

            // Set document title
            if (data.document_title) setDocumentTitle(data.document_title);

            // Import sections (flat array)
            if (data.sections) {
              const importedSections = (Array.isArray(data.sections) ? data.sections : []).map(s => ({
                id: s.id, text: s.text, created_at: new Date().toISOString()
              }));
              setSections(importedSections);
            }

            // Import logic trees (convert to internal format with IDs)
            if (data.logic_trees) {
              const importedTrees = {};
              Object.keys(data.logic_trees).forEach(sectionId => {
                importedTrees[sectionId] = convertImportedTree(data.logic_trees[sectionId]);
              });
              setSectionTrees(importedTrees);
            }

            // Import CPT mappings
            if (data.cpt_mappings) {
              const importedMappings = [];
              Object.keys(data.cpt_mappings).forEach(cptCode => {
                const m = data.cpt_mappings[cptCode];
                importedMappings.push({
                  cpt_code: cptCode,
                  sections: m.sections || [],
                  created_at: new Date().toISOString()
                });
              });
              setCptMappings(importedMappings);
            }

            // Import notes/feedback if present (for backward compatibility)
            if (data.annotator_notes) setAnnotatorNotes(data.annotator_notes);
            if (data.app_feedback) setAppFeedback(data.app_feedback);

            alert('Import successful! Annotation data has been loaded.');
          } catch (err) {
            alert('Import failed: Invalid JSON file. Please check the file format.');
            console.error('Import error:', err);
          }
        };
        reader.readAsText(file);
        // Reset file input so the same file can be re-imported
        event.target.value = '';
      };

      return (
        <div className="min-h-screen bg-gray-50">
          <header className="bg-white border-b border-gray-200 px-6 py-4">
            <div className="max-w-7xl mx-auto">
              <div className="flex items-center justify-between mb-4">
                <h1 className="text-2xl font-bold text-gray-900">Policy Annotation Tool</h1>
                <div className="flex items-center gap-3">
                  <button onClick={() => setShowFeedbackPanel(!showFeedbackPanel)} className={`flex items-center gap-2 px-4 py-2 rounded-lg transition-colors ${showFeedbackPanel ? 'bg-purple-100 text-purple-700' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`}>
                    <MessageSquare size={18} /> Notes & Feedback
                  </button>
                  <label className="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors cursor-pointer">
                    <Upload size={18} /> Import JSON
                    <input type="file" accept=".json" onChange={importData} className="hidden" />
                  </label>
                  <button onClick={exportData} className="flex items-center gap-2 px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors">
                    <Download size={18} /> Export JSON
                  </button>
                </div>
              </div>
              <div className="flex items-center gap-2">
                {stages.map((stage, idx) => (
                  <React.Fragment key={stage.id}>
                    <button onClick={() => setCurrentStage(stage.id)} className={`flex items-center gap-2 px-4 py-2 rounded-lg transition-all ${currentStage === stage.id ? 'bg-blue-100 text-blue-700 font-medium' : currentStage > stage.id ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'}`}>
                      <stage.icon size={18} />
                      <span className="hidden sm:inline">Stage {stage.id}:</span> {stage.name}
                    </button>
                    {idx < stages.length - 1 && <ChevronRight className="text-gray-400" size={20} />}
                  </React.Fragment>
                ))}
              </div>
            </div>
          </header>

          {/* Feedback Panel */}
          {showFeedbackPanel && (
            <div className="max-w-7xl mx-auto px-6 py-4">
              <div className="bg-purple-50 border border-purple-200 rounded-xl p-6">
                <div className="flex items-center justify-between mb-4">
                  <h2 className="text-lg font-semibold text-purple-900 flex items-center gap-2">
                    <MessageSquare size={20} /> Annotator Notes & App Feedback
                  </h2>
                  <button onClick={() => setShowFeedbackPanel(false)} className="text-purple-600 hover:text-purple-800">
                    <span className="text-sm">Close</span>
                  </button>
                </div>
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                  <div>
                    <label className="block text-sm font-medium text-purple-800 mb-2">
                      Annotator Notes <span className="text-purple-500 font-normal">(notes about this document annotation)</span>
                    </label>
                    <textarea
                      value={annotatorNotes}
                      onChange={(e) => setAnnotatorNotes(e.target.value)}
                      placeholder="Add any notes about this document, special cases, ambiguities you encountered, decisions you made..."
                      rows={5}
                      className="w-full px-4 py-3 border border-purple-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent resize-none bg-white"
                    />
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-purple-800 mb-2">
                      App Feedback <span className="text-purple-500 font-normal">(suggestions for improving this tool)</span>
                    </label>
                    <textarea
                      value={appFeedback}
                      onChange={(e) => setAppFeedback(e.target.value)}
                      placeholder="Share feedback about the annotation tool: bugs, feature requests, UI improvements, confusing parts..."
                      rows={5}
                      className="w-full px-4 py-3 border border-purple-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent resize-none bg-white"
                    />
                  </div>
                </div>
                <p className="text-xs text-purple-600 mt-3">These notes will be exported to a separate feedback file (not included in the main annotation file).</p>
              </div>
            </div>
          )}

          <div className="max-w-7xl mx-auto px-6 py-4">
            <div className="bg-white rounded-lg border border-gray-200 p-4 mb-4">
              <label className="block text-sm font-medium text-gray-700 mb-2">Document Title <span className="text-red-500">*</span></label>
              <input type="text" value={documentTitle} onChange={(e) => setDocumentTitle(e.target.value)} placeholder="Enter the policy document title (e.g., Aetna CPB 0743 - Spinal Surgery)" className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
            </div>
          </div>

          <main className="max-w-7xl mx-auto px-6 pb-24">
            {currentStage === 1 && <Stage1SectionExtraction sections={sections} setSections={setSections} />}
            {currentStage === 2 && <Stage2AtomicBreakdown sections={sections} sectionTrees={sectionTrees} setSectionTrees={setSectionTrees} />}
            {currentStage === 3 && <Stage3CPTMapping sections={sections} sectionTrees={sectionTrees} cptMappings={cptMappings} setCptMappings={setCptMappings} />}
          </main>

          <footer className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-6 py-4">
            <div className="max-w-7xl mx-auto flex justify-between">
              <button onClick={() => setCurrentStage(Math.max(1, currentStage - 1))} disabled={currentStage === 1} className={`flex items-center gap-2 px-6 py-2 rounded-lg transition-colors ${currentStage === 1 ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}>
                <ArrowLeft size={18} /> Previous Stage
              </button>
              <div className="text-sm text-gray-500 flex items-center gap-3">
                <span>{sections.length} section(s)</span>
                <span>•</span>
                <span>{Object.keys(sectionTrees).length} tree(s)</span>
                <span>•</span>
                <span>{cptMappings.length} CPT mapping(s)</span>
              </div>
              <button onClick={() => setCurrentStage(Math.min(3, currentStage + 1))} disabled={currentStage === 3 || !canProceed()} className={`flex items-center gap-2 px-6 py-2 rounded-lg transition-colors ${currentStage === 3 || !canProceed() ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-blue-600 text-white hover:bg-blue-700'}`}>
                Next Stage <ArrowRight size={18} />
              </button>
            </div>
          </footer>
        </div>
      );
    }

    // Stage 1: Section-level Requirement Extraction
    function Stage1SectionExtraction({ sections, setSections }) {
      const [requirementText, setRequirementText] = useState('');
      const [editingId, setEditingId] = useState(null);

      const addSection = () => {
        if (!requirementText.trim()) return;
        if (editingId) {
          setSections(sections.map(s => s.id === editingId ? { ...s, text: requirementText } : s));
          setEditingId(null);
        } else {
          setSections([...sections, { id: generateSectionId(sections), text: requirementText, created_at: new Date().toISOString() }]);
        }
        setRequirementText('');
      };

      const editSection = (section) => {
        setRequirementText(section.text);
        setEditingId(section.id);
      };

      const deleteSection = (id) => {
        setSections(sections.filter(s => s.id !== id));
        if (editingId === id) {
          setEditingId(null);
          setRequirementText('');
        }
      };

      return (
        <div>
          <InstructionsPanel title="Stage 1 Instructions: Section-level Requirement Extraction">
            <div className="space-y-3">
              <p><strong>Goal:</strong> Extract all requirement sections from the policy document.</p>
              <div>
                <p className="font-medium mb-1">Steps:</p>
                <ol className="list-decimal list-inside space-y-1 ml-2">
                  <li>Open the policy document in a separate browser tab</li>
                  <li>Find a requirement section (e.g., under "Medical Necessity" or "Additional Notes")</li>
                  <li>Copy the entire section text and paste it into the text area below</li>
                  <li>Click "Add Section" to save</li>
                  <li>Repeat for all requirement sections in the document</li>
                </ol>
              </div>
              <p className="text-blue-600 italic">💡 Tip: Keep sections as cohesive units. If there's a clear procedure/anatomy heading with its criteria checklist, keep them together as one section.</p>
            </div>
          </InstructionsPanel>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div className="bg-white rounded-xl border border-gray-200 p-6">
              <h2 className="text-lg font-semibold text-gray-900 mb-4">{editingId ? 'Edit Section' : 'Add New Section'}</h2>
              <div className="space-y-4">
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-2">Section Requirements</label>
                  <textarea value={requirementText} onChange={(e) => setRequirementText(e.target.value)} placeholder="Paste or type the section requirement text here..." rows={12} className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none" />
                </div>
                <div className="flex gap-3">
                  <button onClick={addSection} disabled={!requirementText.trim()} className={`flex-1 flex items-center justify-center gap-2 px-6 py-3 rounded-lg font-medium transition-colors ${requirementText.trim() ? 'bg-blue-600 text-white hover:bg-blue-700' : 'bg-gray-100 text-gray-400 cursor-not-allowed'}`}>
                    <Plus size={18} /> {editingId ? 'Update Section' : 'Add Section'}
                  </button>
                  {editingId && (
                    <button onClick={() => { setEditingId(null); setRequirementText(''); }} className="px-6 py-3 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-50">Cancel</button>
                  )}
                </div>
              </div>
            </div>

            <div className="bg-white rounded-xl border border-gray-200 p-6">
              <h2 className="text-lg font-semibold text-gray-900 mb-4">Extracted Sections ({sections.length})</h2>
              {sections.length === 0 ? (

                  <Layers size={48} className="mx-auto mb-4 opacity-50" />
                  <p>No sections extracted yet.</p>
                  <p className="text-sm">Paste requirement text and add sections to begin.</p>
                </div>
              ) : (
                <div className="space-y-3 max-h-[600px] overflow-y-auto">
                  {sections.map((section) => (
                    <div key={section.id} className="p-4 rounded-lg border-2 border-gray-200 bg-gray-50">
                      <div className="flex items-start justify-between gap-3">
                        <div className="flex-1 min-w-0">
                          <div className="flex items-center gap-2 mb-2">
                            <span className="font-mono text-xs font-bold bg-white px-2 py-0.5 rounded border border-gray-300">{section.id}</span>
                          </div>
                          <p className="text-sm whitespace-pre-wrap line-clamp-4">{section.text}</p>
                        </div>
                        <div className="flex gap-1">
                          <button onClick={() => editSection(section)} className="p-2 hover:bg-white rounded-lg transition-colors" title="Edit"><FileText size={16} /></button>
                          <button onClick={() => deleteSection(section.id)} className="p-2 hover:bg-white rounded-lg transition-colors text-red-600" title="Delete"><Trash2 size={16} /></button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // Stage 2: Atomic Breakdown with Tree Builder
    function Stage2AtomicBreakdown({ sections, sectionTrees, setSectionTrees }) {
      const [selectedSectionId, setSelectedSectionId] = useState(sections.length > 0 ? sections[0].id : null);
      const currentSection = sections.find(s => s.id === selectedSectionId);
      const currentTree = sectionTrees[selectedSectionId] || null;
      const updateTree = (newTree) => setSectionTrees({ ...sectionTrees, [selectedSectionId]: newTree });

      return (
        <div>
          <InstructionsPanel title="Stage 2 Instructions: Break Section Requirements into Atomic Items">
            <div className="space-y-3">
              <p><strong>Goal:</strong> Convert each section's requirements into a structured logic tree with atomic (individual, checkable) items.</p>
              <div>
                <p className="font-medium mb-1">Steps:</p>
                <ol className="list-decimal list-inside space-y-1 ml-2">
                  <li>Select a section from the left panel</li>
                  <li>Read the section content in the middle panel</li>
                  <li>Identify atomic requirements and copy each one</li>
                  <li>Paste into the tree builder and click "+" to add</li>
                  <li>Use operators to structure the logic (see below)</li>
                  <li>For each leaf item, check all applicable <code className="bg-gray-200 px-1 rounded">evidence_sources</code> (one or more document types needed to verify)</li>
                  <li>Flag <span className="inline-block px-2 py-0.5 bg-amber-100 text-amber-800 rounded text-xs font-medium">⏱ Time Sensitive</span> for requirements involving a specific time duration or recency constraint (e.g., "6 weeks of therapy", "within 6 months")</li>
                  <li>Repeat for all sections</li>
                </ol>
              </div>
              <div>
                <p className="font-medium mb-1">Logic Operators:</p>
                <ul className="space-y-1 ml-2">
                  <li><span className="inline-block px-2 py-0.5 bg-green-100 text-green-800 rounded text-xs font-mono font-bold">ALL</span> — All children must be satisfied (AND)</li>
                  <li><span className="inline-block px-2 py-0.5 bg-yellow-100 text-yellow-800 rounded text-xs font-mono font-bold">ANY</span> — At least one child must be satisfied (OR)</li>
                  <li><span className="inline-block px-2 py-0.5 bg-red-100 text-red-800 rounded text-xs font-mono font-bold">NOT</span> — Must NOT be satisfied</li>
                  <li><span className="inline-block px-2 py-0.5 bg-blue-100 text-blue-800 rounded text-xs font-mono font-bold">IF</span> — Conditional: if first child is true, check remaining</li>
                  <li><span className="inline-block px-2 py-0.5 bg-purple-100 text-purple-800 rounded text-xs font-mono font-bold">UNLESS</span> — Required unless condition is met</li>
                </ul>
              </div>
              <div>
                <p className="font-medium mb-1">Evidence Sources (fixed vocabulary, multi-select):</p>
                <p className="ml-2 text-sm">Check all document types needed to verify each requirement — you may select more than one. If none fit, check "other" and note details in the feedback panel.</p>
                <ul className="space-y-1 ml-2 mt-1 text-sm">
                  <li><code className="bg-gray-200 px-1 rounded">clinical_note</code> — Progress notes, H&P, clinical assessments</li>
                  <li><code className="bg-gray-200 px-1 rounded">imaging_report</code> — MRI, CT, X-ray reports</li>
                  <li><code className="bg-gray-200 px-1 rounded">therapy_records</code> — PT/OT notes, conservative treatment records</li>
                  <li><code className="bg-gray-200 px-1 rounded">lab_result</code> — Lab tests, blood work</li>
                  <li><code className="bg-gray-200 px-1 rounded">prior_auth_form</code> — Prior authorization documentation</li>
                  <li><code className="bg-gray-200 px-1 rounded">operative_report</code> — Surgical notes, procedure records</li>
                  <li><code className="bg-gray-200 px-1 rounded">pathology_report</code> — Biopsy results, pathology findings</li>
                  <li><code className="bg-gray-200 px-1 rounded">referral_letter</code> — Specialist referrals, consultation requests</li>
                </ul>
              </div>
              <p className="text-orange-600 italic">⚠️ Important: Do NOT create custom labels. If a category doesn't fit, select "other" and describe the issue in Notes & Feedback.</p>
            </div>
          </InstructionsPanel>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div className="lg:col-span-3 bg-white rounded-xl border border-gray-200 p-4">
              <h2 className="text-lg font-semibold text-gray-900 mb-4">Sections</h2>
              <div className="space-y-2 max-h-[600px] overflow-y-auto">
                {sections.map((section) => (
                  <button key={section.id} onClick={() => setSelectedSectionId(section.id)} className={`w-full text-left p-3 rounded-lg border-2 transition-all ${selectedSectionId === section.id ? 'border-blue-500 bg-blue-50' : 'border-gray-200 hover:border-gray-300'}`}>
                    <div className="flex items-center justify-between">
                      <span className="font-mono text-sm font-bold">{section.id}</span>
                      {sectionTrees[section.id] && <span className="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded">✓ Tree</span>}
                    </div>
                  </button>
                ))}
              </div>
            </div>

            <div className="lg:col-span-4 bg-white rounded-xl border border-gray-200 p-4">
              <h2 className="text-lg font-semibold text-gray-900 mb-4">Section Content</h2>
              {currentSection ? (
                <div className="p-4 rounded-lg border border-gray-200 bg-gray-50 max-h-[600px] overflow-y-auto">
                  <div className="mb-2">
                    <span className="font-mono text-xs font-bold bg-white px-2 py-0.5 rounded border border-gray-300">{currentSection.id}</span>
                  </div>
                  <p className="text-sm whitespace-pre-wrap select-all">{currentSection.text}</p>
                </div>
              ) : <p className="text-gray-500 text-center py-8">Select a section</p>}
            </div>

            <div className="lg:col-span-5 bg-white rounded-xl border border-gray-200 p-4">
              <h2 className="text-lg font-semibold text-gray-900 mb-4">Logic Tree Builder</h2>
              {selectedSectionId && <TreeBuilder tree={currentTree} setTree={updateTree} />}
            </div>
          </div>
        </div>
      );
    }

    // Tree Builder Component
    function TreeBuilder({ tree, setTree }) {
      const [newItemText, setNewItemText] = useState('');
      const createNode = (type, children = [], text = '') => ({ id: `node_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`, type, text, children, evidence_sources: [], time_sensitive: false });
      const operators = ['ALL', 'ANY', 'NOT', 'IF', 'UNLESS'];

      const initializeTree = () => setTree(createNode('ALL', []));

      const addLeafNode = () => {
        if (!newItemText.trim()) return;
        if (!tree) setTree(createNode('ALL', [createNode('leaf', [], newItemText)]));
        else setTree({ ...tree, children: [...tree.children, createNode('leaf', [], newItemText)] });
        setNewItemText('');
      };

      const wrapWithOperator = (op) => {
        if (!tree) setTree(createNode(op, []));
        else setTree(createNode(op, [tree]));
      };

      const updateNode = (nodeId, updates) => {
        const updateRec = (node) => {
          if (node.id === nodeId) return { ...node, ...updates };
          if (node.children) return { ...node, children: node.children.map(updateRec) };
          return node;
        };
        setTree(updateRec(tree));
      };

      const deleteNode = (nodeId) => {
        const deleteRec = (node) => {
          if (node.id === nodeId) return null;
          if (node.children) return { ...node, children: node.children.map(deleteRec).filter(Boolean) };
          return node;
        };
        setTree(deleteRec(tree));
      };

      const addChildToNode = (parentId, newChild) => {
        const addRec = (node) => {
          if (node.id === parentId) return { ...node, children: [...(node.children || []), newChild] };
          if (node.children) return { ...node, children: node.children.map(addRec) };
          return node;
        };
        setTree(addRec(tree));
      };

      // Convert a leaf node into an operator (the leaf becomes the first child)
      const convertNodeToOperator = (nodeId, operatorType) => {
        const convertRec = (node) => {
          if (node.id === nodeId) {
            // Create a new leaf with the original text and evidence_sources
            const childLeaf = createNode('leaf', [], node.text);
            childLeaf.evidence_sources = node.evidence_sources || [];
            // Return new operator with the leaf as first child
            return { ...node, type: operatorType, text: '', children: [childLeaf], evidence_sources: [] };
          }
          if (node.children) return { ...node, children: node.children.map(convertRec) };
          return node;
        };
        setTree(convertRec(tree));
      };

      return (
        <div className="space-y-4">
          <div className="flex gap-2">
            <input type="text" value={newItemText} onChange={(e) => setNewItemText(e.target.value)} placeholder="Paste atomic requirement text..." className="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500" onKeyPress={(e) => e.key === 'Enter' && addLeafNode()} />
            <button onClick={addLeafNode} disabled={!newItemText.trim()} className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed"><Plus size={18} /></button>
          </div>

          <div className="flex flex-wrap gap-2">
            <span className="text-sm text-gray-600 py-1">Wrap tree with:</span>
            {operators.map(op => <button key={op} onClick={() => wrapWithOperator(op)} className="px-3 py-1 text-sm bg-gray-100 hover:bg-gray-200 rounded-lg font-mono">{op}</button>)}
          </div>

          <div className="border border-gray-200 rounded-lg p-4 min-h-[300px] max-h-[400px] overflow-y-auto bg-gray-50">
            {!tree ? (
              <div className="text-center py-8 text-gray-500">
                <p>No tree structure yet.</p>
                <p className="text-sm">Add atomic items or initialize with an operator.</p>
                <button onClick={initializeTree} className="mt-4 px-4 py-2 bg-blue-100 text-blue-700 rounded-lg hover:bg-blue-200">Initialize with ALL</button>
              </div>
            ) : <TreeNode node={tree} depth={0} updateNode={updateNode} deleteNode={deleteNode} addChildToNode={addChildToNode} createNode={createNode} convertNodeToOperator={convertNodeToOperator} />}
          </div>
        </div>
      );
    }

    // Tree Node Component (recursive)
    function TreeNode({ node, depth, updateNode, deleteNode, addChildToNode, createNode, convertNodeToOperator }) {
      const [isExpanded, setIsExpanded] = useState(true);
      const [isEditing, setIsEditing] = useState(false);
      const [editText, setEditText] = useState(node.text);
      const [showAddChild, setShowAddChild] = useState(false);
      const [newChildText, setNewChildText] = useState('');
      const [newChildOp, setNewChildOp] = useState('leaf');
      const [showConvertMenu, setShowConvertMenu] = useState(false);

      const isOperator = ['ALL', 'ANY', 'NOT', 'IF', 'UNLESS'].includes(node.type);
      const operators = ['ALL', 'ANY', 'NOT', 'IF', 'UNLESS'];
      const opColors = { ALL: 'bg-green-100 text-green-800 border-green-300', ANY: 'bg-yellow-100 text-yellow-800 border-yellow-300', NOT: 'bg-red-100 text-red-800 border-red-300', IF: 'bg-blue-100 text-blue-800 border-blue-300', UNLESS: 'bg-purple-100 text-purple-800 border-purple-300', leaf: 'bg-white border-gray-300' };

      const saveEdit = () => { updateNode(node.id, { text: editText }); setIsEditing(false); };
      const addChild = () => {
        if (newChildOp === 'leaf' && !newChildText.trim()) return;
        addChildToNode(node.id, createNode(newChildOp, [], newChildOp === 'leaf' ? newChildText : ''));
        setNewChildText(''); setShowAddChild(false);
      };

      return (
        <div className={`${depth > 0 ? 'ml-6 border-l-2 border-gray-200 pl-4' : ''}`}>
          <div className={`flex items-start gap-2 p-2 rounded-lg border ${opColors[node.type]} mb-2`}>
            {isOperator && node.children?.length > 0 && <button onClick={() => setIsExpanded(!isExpanded)} className="mt-1 p-0.5 hover:bg-black/10 rounded">{isExpanded ? <ChevronDown size={16} /> : <ChevronRight size={16} />}</button>}
            <div className="flex-1 min-w-0">
              {isOperator ? (
                <div className="flex items-center gap-2">
                  <select value={node.type} onChange={(e) => updateNode(node.id, { type: e.target.value })} className="font-mono font-bold text-sm bg-transparent border-none focus:ring-0 cursor-pointer">{operators.map(op => <option key={op} value={op}>{op}</option>)}</select>
                  <span className="text-xs text-gray-500">({node.children?.length || 0} items)</span>
                </div>
              ) : isEditing ? (
                <div className="flex gap-2">
                  <input type="text" value={editText} onChange={(e) => setEditText(e.target.value)} className="flex-1 px-2 py-1 text-sm border border-gray-300 rounded" onKeyPress={(e) => e.key === 'Enter' && saveEdit()} autoFocus />
                  <button onClick={saveEdit} className="text-xs text-blue-600 hover:underline">Save</button>
                </div>
              ) : <p className="text-sm cursor-pointer hover:bg-black/5 rounded p-1 -m-1" onClick={() => setIsEditing(true)}>{node.text || <em className="text-gray-400">Click to edit</em>}</p>}

              {/* Leaf node - evidence source, time sensitive flag, and convert to operator */}
              {!isOperator && (
                <div className="mt-2 space-y-2">
                  <div className="flex gap-2 items-start flex-wrap">
                    <span className="text-xs text-gray-500 mt-0.5">Evidence:</span>
                    <div className="flex flex-wrap gap-x-3 gap-y-1">
                      {EVIDENCE_SOURCES.map(src => {
                        const checked = (node.evidence_sources || []).includes(src);
                        return (
                          <label key={src} className="flex items-center gap-1 cursor-pointer">
                            <input
                              type="checkbox"
                              checked={checked}
                              onChange={() => {
                                const current = node.evidence_sources || [];
                                const updated = checked ? current.filter(s => s !== src) : [...current, src];
                                updateNode(node.id, { evidence_sources: updated });
                              }}
                              className="accent-indigo-600"
                            />
                            <span className="text-xs text-gray-600">{src}</span>
                          </label>
                        );
                      })}
                    </div>
                    <span className="text-gray-300">|</span>
                    <div className="relative">
                      <button
                        onClick={() => setShowConvertMenu(!showConvertMenu)}
                        className="text-xs px-2 py-1 bg-indigo-100 text-indigo-700 rounded hover:bg-indigo-200"
                        title="Convert this item to an operator with children"
                      >
                        ↳ Expand to...
                      </button>
                      {showConvertMenu && (
                        <div className="absolute top-full left-0 mt-1 bg-white border border-gray-200 rounded shadow-lg z-10">
                          {operators.map(op => (
                            <button
                              key={op}
                              onClick={() => { convertNodeToOperator(node.id, op); setShowConvertMenu(false); }}
                              className={`block w-full text-left px-3 py-1 text-xs hover:bg-gray-100 ${opColors[op].split(' ')[0]}`}
                            >
                              {op}
                            </button>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => updateNode(node.id, { time_sensitive: !node.time_sensitive })}
                      className={`flex items-center gap-1.5 text-xs px-2 py-1 rounded border transition-all ${node.time_sensitive ? 'bg-amber-100 text-amber-800 border-amber-400 font-medium' : 'bg-white text-gray-400 border-gray-200 hover:border-amber-300 hover:text-amber-600'}`}
                      title="Flag if this requirement involves a time duration or recency constraint that cannot be compensated retroactively"
                    >
                      ⏱ Time Sensitive
                    </button>
                    {node.time_sensitive && <span className="text-xs text-amber-600 italic">Cannot be compensated retroactively</span>}
                  </div>
                </div>
              )}
            </div>

            <div className="flex gap-1">
              {isOperator && <button onClick={() => setShowAddChild(!showAddChild)} className="p-1 hover:bg-black/10 rounded text-gray-600" title="Add child"><Plus size={14} /></button>}
              <button onClick={() => deleteNode(node.id)} className="p-1 hover:bg-black/10 rounded text-red-600" title="Delete"><Trash2 size={14} /></button>
            </div>
          </div>

          {showAddChild && (
            <div className="ml-6 mb-2 p-2 bg-gray-100 rounded-lg flex gap-2 items-center">
              <select value={newChildOp} onChange={(e) => setNewChildOp(e.target.value)} className="text-xs px-2 py-1 border border-gray-300 rounded">
                <option value="leaf">Leaf (text)</option>
                {operators.map(op => <option key={op} value={op}>{op}</option>)}
              </select>
              {newChildOp === 'leaf' && <input type="text" value={newChildText} onChange={(e) => setNewChildText(e.target.value)} placeholder="Requirement text..." className="flex-1 px-2 py-1 text-xs border border-gray-300 rounded" onKeyPress={(e) => e.key === 'Enter' && addChild()} />}
              <button onClick={addChild} className="px-2 py-1 text-xs bg-blue-600 text-white rounded hover:bg-blue-700">Add</button>
              <button onClick={() => setShowAddChild(false)} className="px-2 py-1 text-xs text-gray-600 hover:underline">Cancel</button>
            </div>
          )}

          {isExpanded && node.children?.map(child => <TreeNode key={child.id} node={child} depth={depth + 1} updateNode={updateNode} deleteNode={deleteNode} addChildToNode={addChildToNode} createNode={createNode} convertNodeToOperator={convertNodeToOperator} />)}
        </div>
      );
    }

    // Stage 3: CPT Code Mapping
    function Stage3CPTMapping({ sections, sectionTrees, cptMappings, setCptMappings }) {
      const [currentCPT, setCurrentCPT] = useState('');
      const [currentMappings, setCurrentMappings] = useState({ sections: [] });

      const handleDragStart = (e, section) => {
        e.dataTransfer.setData('sectionId', section.id);
      };

      const handleDrop = (e) => {
        e.preventDefault();
        const sectionId = e.dataTransfer.getData('sectionId');
        if (!sectionId || currentMappings.sections.includes(sectionId)) return;
        setCurrentMappings({ sections: [...currentMappings.sections, sectionId] });
      };

      const removeMapping = (sectionId) => {
        setCurrentMappings({ sections: currentMappings.sections.filter(id => id !== sectionId) });
      };

      const resetForm = () => {
        setCurrentCPT('');
        setCurrentMappings({ sections: [] });
      };

      const saveCPTMapping = () => {
        if (!currentCPT.trim()) return;
        const mapping = {
          cpt_code: currentCPT,
          sections: currentMappings.sections,
          created_at: new Date().toISOString()
        };
        const existingIdx = cptMappings.findIndex(m => m.cpt_code === currentCPT);
        if (existingIdx >= 0) {
          const updated = [...cptMappings];
          updated[existingIdx] = mapping;
          setCptMappings(updated);
        } else {
          setCptMappings([...cptMappings, mapping]);
        }
        resetForm();
      };

      const loadMapping = (mapping) => {
        setCurrentCPT(mapping.cpt_code);
        setCurrentMappings({ sections: mapping.sections || [] });
      };

      const deleteMapping = (cptCode) => {
        setCptMappings(cptMappings.filter(m => m.cpt_code !== cptCode));
      };

      const getSectionById = (id) => sections.find(s => s.id === id);

      return (
        <div>
          <InstructionsPanel title="Stage 3 Instructions: CPT Code Mapping">
            <div className="space-y-3">
              <p><strong>Goal:</strong> Map each CPT/HCPCS code from the policy's code table to its relevant requirement sections.</p>
              <div>
                <p className="font-medium mb-1">Steps:</p>
                <ol className="list-decimal list-inside space-y-1 ml-2">
                  <li>Find the CPT/HCPCS codes table in the policy document</li>
                  <li>Enter the CPT code in the input box</li>
                  <li>Drag all relevant sections from the middle panel into the Requirements drop zone</li>
                  <li>Click "Save CPT Mapping"</li>
                </ol>
              </div>
              <p className="text-blue-600 italic">💡 Tip: Map ALL sections that apply to this CPT code — ICD-10 filtering happens downstream at implementation time.</p>
            </div>
          </InstructionsPanel>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div className="lg:col-span-2 bg-white rounded-xl border border-gray-200 p-4">
              <h2 className="text-lg font-semibold text-gray-900 mb-4">Saved Mappings</h2>
              <div className="space-y-2 max-h-[700px] overflow-y-auto">
                {cptMappings.length === 0 ? (
                  <p className="text-sm text-gray-500 text-center py-4">No mappings yet</p>
                ) : cptMappings.map(mapping => (
                  <div key={mapping.cpt_code} className="p-2 bg-gray-50 rounded-lg border border-gray-200 group">
                    <div className="flex items-center justify-between">
                      <button onClick={() => loadMapping(mapping)} className="font-mono text-sm font-medium text-blue-600 hover:underline">{mapping.cpt_code}</button>
                      <button onClick={() => deleteMapping(mapping.cpt_code)} className="opacity-0 group-hover:opacity-100 text-red-500 hover:text-red-700"><Trash2 size={14} /></button>
                    </div>
                    <div className="text-xs text-gray-500 mt-1">
                      {mapping.sections?.length || 0} section(s)
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div className="lg:col-span-3 bg-white rounded-xl border border-gray-200 p-4">
              <h2 className="text-lg font-semibold text-gray-900 mb-4">Available Sections</h2>
              <p className="text-sm text-gray-600 mb-4">Drag sections to map them</p>
              <div className="space-y-2 max-h-[650px] overflow-y-auto">
                {sections.map((section) => (
                  <div key={section.id} draggable onDragStart={(e) => handleDragStart(e, section)} className="p-3 rounded-lg border-2 border-gray-200 bg-gray-50 cursor-grab active:cursor-grabbing hover:shadow-md hover:border-gray-300 transition-shadow">
                    <div className="flex items-center gap-2">
                      <GripVertical size={16} className="text-gray-400 flex-shrink-0" />
                      <div className="flex-1 min-w-0">
                        <span className="font-mono text-xs font-bold bg-white px-2 py-0.5 rounded border border-gray-300 mb-1 inline-block">{section.id}</span>
                        <p className="text-sm line-clamp-2 mt-1">{section.text}</p>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div className="lg:col-span-7 bg-white rounded-xl border border-gray-200 p-4 max-h-[800px] overflow-y-auto">
              <h2 className="text-lg font-semibold text-gray-900 mb-4">CPT Code Mapping</h2>

              <div className="mb-4">
                <label className="block text-sm font-medium text-gray-700 mb-2">CPT/HCPCS Code</label>
                <input type="text" value={currentCPT} onChange={(e) => setCurrentCPT(e.target.value.toUpperCase())} placeholder="Enter CPT code (e.g., 27447)" className="w-full px-4 py-2 border border-gray-300 rounded-lg font-mono focus:ring-2 focus:ring-blue-500" />
              </div>

              <div>
                <label className="block text-sm font-medium text-gray-700 mb-2">Requirements</label>
                <div onDragOver={(e) => e.preventDefault()} onDrop={handleDrop} className="min-h-[120px] border-2 border-dashed border-blue-300 bg-blue-50 rounded-lg p-2">
                  {currentMappings.sections.length > 0 ? (
                    <div className="space-y-1">
                      {currentMappings.sections.map(sectionId => {
                        const section = getSectionById(sectionId);
                        return section ? (
                          <div key={sectionId} className="flex items-center justify-between bg-white p-2 rounded text-sm border border-gray-200">
                            <span className="font-mono text-xs font-bold mr-2 text-blue-700">{sectionId}</span>
                            <span className="flex-1 truncate text-xs text-gray-700">{section.text}</span>
                            <button onClick={() => removeMapping(sectionId)} className="text-red-500 ml-2 hover:text-red-700"><Trash2 size={12} /></button>
                          </div>
                        ) : null;
                      })}
                    </div>
                  ) : <p className="text-center text-gray-400 text-xs py-4">Drag sections here to map them to this CPT code</p>}
                </div>
              </div>

              <button onClick={saveCPTMapping} disabled={!currentCPT.trim()} className={`w-full mt-4 py-3 rounded-lg font-medium ${currentCPT.trim() ? 'bg-blue-600 text-white hover:bg-blue-700' : 'bg-gray-100 text-gray-400 cursor-not-allowed'}`}>
                Save CPT Mapping
              </button>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AnnotationTool />);
  </script>
</body>
</html>

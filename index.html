            <div className="bg-white rounded-xl border border-gray-200 p-6">
              <h2 className="text-lg font-semibold text-gray-900 mb-4">Extracted Sections ({sections.length})</h2>
              {sections.length === 0 ? (
                <div className="text-center py-12 text-gray-500">
                  <Layers size={48} className="mx-auto mb-4 opacity-50" />
                  <p>No sections extracted yet.</p>
                  <p className="text-sm">Paste requirement text and add sections to begin.</p>
                </div>
              ) : (
                <div className="space-y-3 max-h-[600px] overflow-y-auto">
                  {sections.map((section) => (
                    <div key={section.id} className="p-4 rounded-lg border-2 border-gray-200 bg-gray-50">
                      <div className="flex items-start justify-between gap-3">
                        <div className="flex-1 min-w-0">
                          <div className="flex items-center gap-2 mb-2">
                            <span className="font-mono text-xs font-bold bg-white px-2 py-0.5 rounded border border-gray-300">{section.id}</span>
                          </div>
                          <p className="text-sm whitespace-pre-wrap line-clamp-4">{section.text}</p>
                        </div>
                        <div className="flex gap-1">
                          <button onClick={() => editSection(section)} className="p-2 hover:bg-white rounded-lg transition-colors" title="Edit"><FileText size={16} /></button>
                          <button onClick={() => deleteSection(section.id)} className="p-2 hover:bg-white rounded-lg transition-colors text-red-600" title="Delete"><Trash2 size={16} /></button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // Stage 2: Atomic Breakdown with Tree Builder
    function Stage2AtomicBreakdown({ sections, sectionTrees, setSectionTrees }) {
      const [selectedSectionId, setSelectedSectionId] = useState(sections.length > 0 ? sections[0].id : null);
      const currentSection = sections.find(s => s.id === selectedSectionId);
      const currentTree = sectionTrees[selectedSectionId] || null;
      const updateTree = (newTree) => setSectionTrees({ ...sectionTrees, [selectedSectionId]: newTree });

      return (
        <div>
          <InstructionsPanel title="Stage 2 Instructions: Break Section Requirements into Atomic Items">
            <div className="space-y-3">
              <p><strong>Goal:</strong> Convert each section's requirements into a structured logic tree with atomic (individual, checkable) items.</p>
              <div>
                <p className="font-medium mb-1">Steps:</p>
                <ol className="list-decimal list-inside space-y-1 ml-2">
                  <li>Select a section from the left panel</li>
                  <li>Read the section content in the middle panel</li>
                  <li>Identify atomic requirements and copy each one</li>
                  <li>Paste into the tree builder and click "+" to add</li>
                  <li>Use operators to structure the logic (see below)</li>
                  <li>For each leaf item, check all applicable <code className="bg-gray-200 px-1 rounded">evidence_sources</code> (one or more document types needed to verify)</li>
                  <li>Flag <span className="inline-block px-2 py-0.5 bg-amber-100 text-amber-800 rounded text-xs font-medium">⏱ Time Sensitive</span> for requirements involving a specific time duration or recency constraint (e.g., "6 weeks of therapy", "within 6 months")</li>
                  <li>Repeat for all sections</li>
                </ol>
              </div>
              <div>
                <p className="font-medium mb-1">Logic Operators:</p>
                <ul className="space-y-1 ml-2">
                  <li><span className="inline-block px-2 py-0.5 bg-green-100 text-green-800 rounded text-xs font-mono font-bold">ALL</span> — All children must be satisfied (AND)</li>
                  <li><span className="inline-block px-2 py-0.5 bg-yellow-100 text-yellow-800 rounded text-xs font-mono font-bold">ANY</span> — At least one child must be satisfied (OR)</li>
                  <li><span className="inline-block px-2 py-0.5 bg-red-100 text-red-800 rounded text-xs font-mono font-bold">NOT</span> — Must NOT be satisfied</li>
                  <li><span className="inline-block px-2 py-0.5 bg-blue-100 text-blue-800 rounded text-xs font-mono font-bold">IF</span> — Conditional: if first child is true, check remaining</li>
                  <li><span className="inline-block px-2 py-0.5 bg-purple-100 text-purple-800 rounded text-xs font-mono font-bold">UNLESS</span> — Required unless condition is met</li>
                </ul>
              </div>
              <div>
                <p className="font-medium mb-1">Evidence Sources (fixed vocabulary, multi-select):</p>
                <p className="ml-2 text-sm">Check all document types needed to verify each requirement — you may select more than one. If none fit, check "other" and note details in the feedback panel.</p>
                <ul className="space-y-1 ml-2 mt-1 text-sm">
                  <li><code className="bg-gray-200 px-1 rounded">clinical_note</code> — Progress notes, H&P, clinical assessments</li>
                  <li><code className="bg-gray-200 px-1 rounded">imaging_report</code> — MRI, CT, X-ray reports</li>
                  <li><code className="bg-gray-200 px-1 rounded">therapy_records</code> — PT/OT notes, conservative treatment records</li>
                  <li><code className="bg-gray-200 px-1 rounded">lab_result</code> — Lab tests, blood work</li>
                  <li><code className="bg-gray-200 px-1 rounded">prior_auth_form</code> — Prior authorization documentation</li>
                  <li><code className="bg-gray-200 px-1 rounded">operative_report</code> — Surgical notes, procedure records</li>
                  <li><code className="bg-gray-200 px-1 rounded">pathology_report</code> — Biopsy results, pathology findings</li>
                  <li><code className="bg-gray-200 px-1 rounded">referral_letter</code> — Specialist referrals, consultation requests</li>
                </ul>
              </div>
              <p className="text-orange-600 italic">⚠️ Important: Do NOT create custom labels. If a category doesn't fit, select "other" and describe the issue in Notes & Feedback.</p>
            </div>
          </InstructionsPanel>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div className="lg:col-span-3 bg-white rounded-xl border border-gray-200 p-4">
              <h2 className="text-lg font-semibold text-gray-900 mb-4">Sections</h2>
              <div className="space-y-2 max-h-[600px] overflow-y-auto">
                {sections.map((section) => (
                  <button key={section.id} onClick={() => setSelectedSectionId(section.id)} className={`w-full text-left p-3 rounded-lg border-2 transition-all ${selectedSectionId === section.id ? 'border-blue-500 bg-blue-50' : 'border-gray-200 hover:border-gray-300'}`}>
                    <div className="flex items-center justify-between">
                      <span className="font-mono text-sm font-bold">{section.id}</span>
                      {sectionTrees[section.id] && <span className="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded">✓ Tree</span>}
                    </div>
                  </button>
                ))}
              </div>
            </div>

            <div className="lg:col-span-4 bg-white rounded-xl border border-gray-200 p-4">
              <h2 className="text-lg font-semibold text-gray-900 mb-4">Section Content</h2>
              {currentSection ? (
                <div className="p-4 rounded-lg border border-gray-200 bg-gray-50 max-h-[600px] overflow-y-auto">
                  <div className="mb-2">
                    <span className="font-mono text-xs font-bold bg-white px-2 py-0.5 rounded border border-gray-300">{currentSection.id}</span>
                  </div>
                  <p className="text-sm whitespace-pre-wrap select-all">{currentSection.text}</p>
                </div>
              ) : <p className="text-gray-500 text-center py-8">Select a section</p>}
            </div>

            <div className="lg:col-span-5 bg-white rounded-xl border border-gray-200 p-4">
              <h2 className="text-lg font-semibold text-gray-900 mb-4">Logic Tree Builder</h2>
              {selectedSectionId && <TreeBuilder tree={currentTree} setTree={updateTree} />}
            </div>
          </div>
        </div>
      );
    }

    // Tree Builder Component
    function TreeBuilder({ tree, setTree }) {
      const [newItemText, setNewItemText] = useState('');
      const createNode = (type, children = [], text = '') => ({ id: `node_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`, type, text, children, evidence_sources: [], time_sensitive: false });

      const operators = ['ALL', 'ANY', 'NOT', 'IF', 'UNLESS'];

      const initializeTree = () => setTree(createNode('ALL', []));

      const addLeafNode = () => {
        if (!newItemText.trim()) return;
        if (!tree) setTree(createNode('ALL', [createNode('leaf', [], newItemText)]));
        else setTree({ ...tree, children: [...tree.children, createNode('leaf', [], newItemText)] });
        setNewItemText('');
      };

      const wrapWithOperator = (op) => {
        if (!tree) setTree(createNode(op, []));
        else setTree(createNode(op, [tree]));
      };

      const updateNode = (nodeId, updates) => {
        const updateRec = (node) => {
          if (node.id === nodeId) return { ...node, ...updates };
          if (node.children) return { ...node, children: node.children.map(updateRec) };
          return node;
        };
        setTree(updateRec(tree));
      };

      const deleteNode = (nodeId) => {
        const deleteRec = (node) => {
          if (node.id === nodeId) return null;
          if (node.children) return { ...node, children: node.children.map(deleteRec).filter(Boolean) };
          return node;
        };
        setTree(deleteRec(tree));
      };

      const addChildToNode = (parentId, newChild) => {
        const addRec = (node) => {
          if (node.id === parentId) return { ...node, children: [...(node.children || []), newChild] };
          if (node.children) return { ...node, children: node.children.map(addRec) };
          return node;
        };
        setTree(addRec(tree));
      };

      // Convert a leaf node into an operator (the leaf becomes the first child)
      const convertNodeToOperator = (nodeId, operatorType) => {
        const convertRec = (node) => {
          if (node.id === nodeId) {
            // Create a new leaf with the original text and evidence_sources
            const childLeaf = createNode('leaf', [], node.text);
            childLeaf.evidence_sources = node.evidence_sources || [];
            // Return new operator with the leaf as first child
            return { ...node, type: operatorType, text: '', children: [childLeaf], evidence_sources: [] };
          }
          if (node.children) return { ...node, children: node.children.map(convertRec) };
          return node;
        };
        setTree(convertRec(tree));
      };

      return (
        <div className="space-y-4">
          <div className="flex gap-2">
            <input type="text" value={newItemText} onChange={(e) => setNewItemText(e.target.value)} placeholder="Paste atomic requirement text..." className="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500" onKeyPress={(e) => e.key === 'Enter' && addLeafNode()} />
            <button onClick={addLeafNode} disabled={!newItemText.trim()} className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed"><Plus size={18} /></button>
          </div>

          <div className="flex flex-wrap gap-2">
            <span className="text-sm text-gray-600 py-1">Wrap tree with:</span>
            {operators.map(op => <button key={op} onClick={() => wrapWithOperator(op)} className="px-3 py-1 text-sm bg-gray-100 hover:bg-gray-200 rounded-lg font-mono">{op}</button>)}
          </div>

          <div className="border border-gray-200 rounded-lg p-4 min-h-[300px] max-h-[400px] overflow-y-auto bg-gray-50">
            {!tree ? (
              <div className="text-center py-8 text-gray-500">
                <p>No tree structure yet.</p>
                <p className="text-sm">Add atomic items or initialize with an operator.</p>
                <button onClick={initializeTree} className="mt-4 px-4 py-2 bg-blue-100 text-blue-700 rounded-lg hover:bg-blue-200">Initialize with ALL</button>
              </div>
            ) : <TreeNode node={tree} depth={0} updateNode={updateNode} deleteNode={deleteNode} addChildToNode={addChildToNode} createNode={createNode} convertNodeToOperator={convertNodeToOperator} />}
          </div>
        </div>
      );
    }

    // Tree Node Component (recursive)
    function TreeNode({ node, depth, updateNode, deleteNode, addChildToNode, createNode, convertNodeToOperator }) {
      const [isExpanded, setIsExpanded] = useState(true);
      const [isEditing, setIsEditing] = useState(false);
      const [editText, setEditText] = useState(node.text);
      const [showAddChild, setShowAddChild] = useState(false);
      const [newChildText, setNewChildText] = useState('');
      const [newChildOp, setNewChildOp] = useState('leaf');
      const [showConvertMenu, setShowConvertMenu] = useState(false);

      const isOperator = ['ALL', 'ANY', 'NOT', 'IF', 'UNLESS'].includes(node.type);
      const operators = ['ALL', 'ANY', 'NOT', 'IF', 'UNLESS'];
      const opColors = { ALL: 'bg-green-100 text-green-800 border-green-300', ANY: 'bg-yellow-100 text-yellow-800 border-yellow-300', NOT: 'bg-red-100 text-red-800 border-red-300', IF: 'bg-blue-100 text-blue-800 border-blue-300', UNLESS: 'bg-purple-100 text-purple-800 border-purple-300', leaf: 'bg-white border-gray-300' };

      const saveEdit = () => { updateNode(node.id, { text: editText }); setIsEditing(false); };
      const addChild = () => {
        if (newChildOp === 'leaf' && !newChildText.trim()) return;
        addChildToNode(node.id, createNode(newChildOp, [], newChildOp === 'leaf' ? newChildText : ''));
        setNewChildText(''); setShowAddChild(false);
      };

      return (
        <div className={`${depth > 0 ? 'ml-6 border-l-2 border-gray-200 pl-4' : ''}`}>
          <div className={`flex items-start gap-2 p-2 rounded-lg border ${opColors[node.type]} mb-2`}>
            {isOperator && node.children?.length > 0 && <button onClick={() => setIsExpanded(!isExpanded)} className="mt-1 p-0.5 hover:bg-black/10 rounded">{isExpanded ? <ChevronDown size={16} /> : <ChevronRight size={16} />}</button>}
            <div className="flex-1 min-w-0">
              {isOperator ? (
                <div className="flex items-center gap-2">
                  <select value={node.type} onChange={(e) => updateNode(node.id, { type: e.target.value })} className="font-mono font-bold text-sm bg-transparent border-none focus:ring-0 cursor-pointer">{operators.map(op => <option key={op} value={op}>{op}</option>)}</select>
                  <span className="text-xs text-gray-500">({node.children?.length || 0} items)</span>
                </div>
              ) : isEditing ? (
                <div className="flex gap-2">
                  <input type="text" value={editText} onChange={(e) => setEditText(e.target.value)} className="flex-1 px-2 py-1 text-sm border border-gray-300 rounded" onKeyPress={(e) => e.key === 'Enter' && saveEdit()} autoFocus />
                  <button onClick={saveEdit} className="text-xs text-blue-600 hover:underline">Save</button>
                </div>
              ) : <p className="text-sm cursor-pointer hover:bg-black/5 rounded p-1 -m-1" onClick={() => setIsEditing(true)}>{node.text || <em className="text-gray-400">Click to edit</em>}</p>}

              {/* Leaf node - evidence source, time sensitive flag, and convert to operator */}
              {!isOperator && (
                <div className="mt-2 space-y-2">
                  <div className="flex gap-2 items-start flex-wrap">
                    <span className="text-xs text-gray-500 mt-0.5">Evidence:</span>
                    <div className="flex flex-wrap gap-x-3 gap-y-1">
                      {EVIDENCE_SOURCES.map(src => {
                        const checked = (node.evidence_sources || []).includes(src);
                        return (
                          <label key={src} className="flex items-center gap-1 cursor-pointer">
                            <input
                              type="checkbox"
                              checked={checked}
                              onChange={() => {
                                const current = node.evidence_sources || [];
                                const updated = checked ? current.filter(s => s !== src) : [...current, src];
                                updateNode(node.id, { evidence_sources: updated });
                              }}
                              className="accent-indigo-600"
                            />
                            <span className="text-xs text-gray-600">{src}</span>
                          </label>
                        );
                      })}
                    </div>
                    <span className="text-gray-300">|</span>
                    <div className="relative">
                      <button
                        onClick={() => setShowConvertMenu(!showConvertMenu)}
                        className="text-xs px-2 py-1 bg-indigo-100 text-indigo-700 rounded hover:bg-indigo-200"
                        title="Convert this item to an operator with children"
                      >
                        ↳ Expand to...
                      </button>
                      {showConvertMenu && (
                        <div className="absolute top-full left-0 mt-1 bg-white border border-gray-200 rounded shadow-lg z-10">
                          {operators.map(op => (
                            <button
                              key={op}
                              onClick={() => { convertNodeToOperator(node.id, op); setShowConvertMenu(false); }}
                              className={`block w-full text-left px-3 py-1 text-xs hover:bg-gray-100 ${opColors[op].split(' ')[0]}`}
                            >
                              {op}
                            </button>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => updateNode(node.id, { time_sensitive: !node.time_sensitive })}
                      className={`flex items-center gap-1.5 text-xs px-2 py-1 rounded border transition-all ${node.time_sensitive ? 'bg-amber-100 text-amber-800 border-amber-400 font-medium' : 'bg-white text-gray-400 border-gray-200 hover:border-amber-300 hover:text-amber-600'}`}
                      title="Flag if this requirement involves a time duration or recency constraint that cannot be compensated retroactively"
                    >
                      ⏱ Time Sensitive
                    </button>
                    {node.time_sensitive && <span className="text-xs text-amber-600 italic">Cannot be compensated retroactively</span>}
                  </div>
                </div>
              )}
            </div>

            <div className="flex gap-1">
              {isOperator && <button onClick={() => setShowAddChild(!showAddChild)} className="p-1 hover:bg-black/10 rounded text-gray-600" title="Add child"><Plus size={14} /></button>}
              <button onClick={() => deleteNode(node.id)} className="p-1 hover:bg-black/10 rounded text-red-600" title="Delete"><Trash2 size={14} /></button>
            </div>
          </div>

          {showAddChild && (
            <div className="ml-6 mb-2 p-2 bg-gray-100 rounded-lg flex gap-2 items-center">
              <select value={newChildOp} onChange={(e) => setNewChildOp(e.target.value)} className="text-xs px-2 py-1 border border-gray-300 rounded">
                <option value="leaf">Leaf (text)</option>
                {operators.map(op => <option key={op} value={op}>{op}</option>)}
              </select>
              {newChildOp === 'leaf' && <input type="text" value={newChildText} onChange={(e) => setNewChildText(e.target.value)} placeholder="Requirement text..." className="flex-1 px-2 py-1 text-xs border border-gray-300 rounded" onKeyPress={(e) => e.key === 'Enter' && addChild()} />}
              <button onClick={addChild} className="px-2 py-1 text-xs bg-blue-600 text-white rounded hover:bg-blue-700">Add</button>
              <button onClick={() => setShowAddChild(false)} className="px-2 py-1 text-xs text-gray-600 hover:underline">Cancel</button>
            </div>
          )}

          {isExpanded && node.children?.map(child => <TreeNode key={child.id} node={child} depth={depth + 1} updateNode={updateNode} deleteNode={deleteNode} addChildToNode={addChildToNode} createNode={createNode} convertNodeToOperator={convertNodeToOperator} />)}
        </div>
      );
    }

    // Stage 3: CPT Code Mapping
    function Stage3CPTMapping({ sections, sectionTrees, cptMappings, setCptMappings }) {
      const [currentCPT, setCurrentCPT] = useState('');
      const [isAddon, setIsAddon] = useState(false);
      const [currentMappings, setCurrentMappings] = useState({ sections: [] });

      const handleDragStart = (e, section) => {
        e.dataTransfer.setData('sectionId', section.id);
      };

      const handleDrop = (e) => {
        e.preventDefault();
        const sectionId = e.dataTransfer.getData('sectionId');
        if (!sectionId || currentMappings.sections.includes(sectionId)) return;
        setCurrentMappings({ sections: [...currentMappings.sections, sectionId] });
      };

      const removeMapping = (sectionId) => {
        setCurrentMappings({ sections: currentMappings.sections.filter(id => id !== sectionId) });
      };

      const resetForm = () => {
        setCurrentCPT('');
        setIsAddon(false);
        setCurrentMappings({ sections: [] });
      };

      const saveCPTMapping = () => {
        if (!currentCPT.trim()) return;
        const mapping = {
          cpt_code: currentCPT,
          sections: currentMappings.sections,
          is_addon: isAddon,
          created_at: new Date().toISOString()
        };
        const existingIdx = cptMappings.findIndex(m => m.cpt_code === currentCPT);
        if (existingIdx >= 0) {
          const updated = [...cptMappings];
          updated[existingIdx] = mapping;
          setCptMappings(updated);
        } else {
          setCptMappings([...cptMappings, mapping]);
        }
        resetForm();
      };

      const loadMapping = (mapping) => {
        setCurrentCPT(mapping.cpt_code);
        setIsAddon(mapping.is_addon || false);
        setCurrentMappings({ sections: mapping.sections || [] });
      };

      const deleteMapping = (cptCode) => {
        setCptMappings(cptMappings.filter(m => m.cpt_code !== cptCode));
      };

      const getSectionById = (id) => sections.find(s => s.id === id);

      return (
        <div>
          <InstructionsPanel title="Stage 3 Instructions: CPT Code Mapping">
            <div className="space-y-3">
              <p><strong>Goal:</strong> Map each CPT/HCPCS code from the policy's code table to its relevant requirement sections.</p>
              <div>
                <p className="font-medium mb-1">Steps:</p>
                <ol className="list-decimal list-inside space-y-1 ml-2">
                  <li>Find the CPT/HCPCS codes table in the policy document</li>
                  <li>Enter the CPT code in the input box</li>
                  <li>Drag all relevant sections from the middle panel into the Requirements drop zone</li>
                  <li>Click "Save CPT Mapping"</li>
                </ol>
              </div>
              <p className="text-blue-600 italic">💡 Tip: Map ALL sections that apply to this CPT code — ICD-10 filtering happens downstream at implementation time.</p>
              <p className="text-orange-600 italic">➕ Add-on codes: If the CPT code is an add-on code (typically marked with "+" in the policy's code table), check the "Add-on code" box. The code will still be fully annotated — the flag is used to trigger a reminder during the checklist stage.</p>
            </div>
          </InstructionsPanel>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div className="lg:col-span-2 bg-white rounded-xl border border-gray-200 p-4">
              <h2 className="text-lg font-semibold text-gray-900 mb-4">Saved Mappings</h2>
              <div className="space-y-2 max-h-[700px] overflow-y-auto">
                {cptMappings.length === 0 ? (
                  <p className="text-sm text-gray-500 text-center py-4">No mappings yet</p>
                ) : cptMappings.map(mapping => (
                  <div key={mapping.cpt_code} className="p-2 bg-gray-50 rounded-lg border border-gray-200 group">
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-1">
                        <button onClick={() => loadMapping(mapping)} className="font-mono text-sm font-medium text-blue-600 hover:underline">{mapping.cpt_code}</button>
                        {mapping.is_addon && <span className="text-xs bg-orange-100 text-orange-700 font-bold px-1.5 py-0.5 rounded" title="Add-on code">+</span>}
                      </div>
                      <button onClick={() => deleteMapping(mapping.cpt_code)} className="opacity-0 group-hover:opacity-100 text-red-500 hover:text-red-700"><Trash2 size={14} /></button>
                    </div>
                    <div className="text-xs text-gray-500 mt-1">
                      {mapping.sections?.length || 0} section(s)
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div className="lg:col-span-3 bg-white rounded-xl border border-gray-200 p-4">
              <h2 className="text-lg font-semibold text-gray-900 mb-4">Available Sections</h2>
              <p className="text-sm text-gray-600 mb-4">Drag sections to map them</p>
              <div className="space-y-2 max-h-[650px] overflow-y-auto">
                {sections.map((section) => (
                  <div key={section.id} draggable onDragStart={(e) => handleDragStart(e, section)} className="p-3 rounded-lg border-2 border-gray-200 bg-gray-50 cursor-grab active:cursor-grabbing hover:shadow-md hover:border-gray-300 transition-shadow">
                    <div className="flex items-center gap-2">
                      <GripVertical size={16} className="text-gray-400 flex-shrink-0" />
                      <div className="flex-1 min-w-0">
                        <span className="font-mono text-xs font-bold bg-white px-2 py-0.5 rounded border border-gray-300 mb-1 inline-block">{section.id}</span>
                        <p className="text-sm line-clamp-2 mt-1">{section.text}</p>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div className="lg:col-span-7 bg-white rounded-xl border border-gray-200 p-4 max-h-[800px] overflow-y-auto">
              <h2 className="text-lg font-semibold text-gray-900 mb-4">CPT Code Mapping</h2>

              <div className="mb-4">
                <label className="block text-sm font-medium text-gray-700 mb-2">CPT/HCPCS Code</label>
                <input type="text" value={currentCPT} onChange={(e) => setCurrentCPT(e.target.value.toUpperCase())} placeholder="Enter CPT code (e.g., 27447)" className="w-full px-4 py-2 border border-gray-300 rounded-lg font-mono focus:ring-2 focus:ring-blue-500" />
                <label className="flex items-center gap-2 mt-2 cursor-pointer w-fit">
                  <input type="checkbox" checked={isAddon} onChange={(e) => setIsAddon(e.target.checked)} className="accent-orange-500 w-4 h-4" />
                  <span className="text-sm text-gray-600">Add-on code <span className="font-mono font-bold text-orange-600">(+)</span></span>
                </label>
                {isAddon && (
                  <div className="mt-2 flex items-start gap-2 bg-orange-50 border border-orange-200 rounded-lg px-3 py-2">
                    <span className="text-orange-500 text-base mt-0.5">⚠️</span>
                    <p className="text-xs text-orange-800">This is an <strong>add-on code</strong> — it cannot be billed alone and must always accompany a primary procedure code. The checklist will display a reminder during PA preparation.</p>
                  </div>
                )}
              </div>

              <div>
                <label className="block text-sm font-medium text-gray-700 mb-2">Requirements</label>
                <div onDragOver={(e) => e.preventDefault()} onDrop={handleDrop} className="min-h-[120px] border-2 border-dashed border-blue-300 bg-blue-50 rounded-lg p-2">
                  {currentMappings.sections.length > 0 ? (
                    <div className="space-y-1">
                      {currentMappings.sections.map(sectionId => {
                        const section = getSectionById(sectionId);
                        return section ? (
                          <div key={sectionId} className="flex items-center justify-between bg-white p-2 rounded text-sm border border-gray-200">
                            <span className="font-mono text-xs font-bold mr-2 text-blue-700">{sectionId}</span>
                            <span className="flex-1 truncate text-xs text-gray-700">{section.text}</span>
                            <button onClick={() => removeMapping(sectionId)} className="text-red-500 ml-2 hover:text-red-700"><Trash2 size={12} /></button>
                          </div>
                        ) : null;
                      })}
                    </div>
                  ) : <p className="text-center text-gray-400 text-xs py-4">Drag sections here to map them to this CPT code</p>}
                </div>
              </div>

              <button onClick={saveCPTMapping} disabled={!currentCPT.trim()} className={`w-full mt-4 py-3 rounded-lg font-medium ${currentCPT.trim() ? 'bg-blue-600 text-white hover:bg-blue-700' : 'bg-gray-100 text-gray-400 cursor-not-allowed'}`}>
                Save CPT Mapping
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ── Expandable text helper ───────────────────────────────────────────────
    function ExpandableText({ text, previewLength = 160, className = '' }) {
      const [expanded, setExpanded] = useState(false);
      if (!text) return <span className={`text-gray-400 italic ${className}`}>(none)</span>;
      const needsTrunc = text.length > previewLength;
      return (
        <div className={className}>
          <span className="whitespace-pre-wrap leading-relaxed">
            {expanded || !needsTrunc ? text : text.slice(0, previewLength) + '…'}
          </span>
          {needsTrunc && (
            <button onClick={(e) => { e.stopPropagation(); setExpanded(!expanded); }}
              className="ml-1.5 text-indigo-500 hover:text-indigo-700 text-xs font-medium underline-offset-2 underline">
              {expanded ? 'Show less' : 'Show more'}
            </button>
          )}
        </div>
      );
    }

    // ── Evaluation Report Viewer ────────────────────────────────────────────
    function EvaluationReport() {
      const [reportData, setReportData] = useState(null);
      const [activeTab, setActiveTab] = useState('overview');
      const [errorFilter, setErrorFilter] = useState('all');
      const [expandedErrors, setExpandedErrors] = useState(new Set());

      const importReport = (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = JSON.parse(e.target.result);
            setReportData(data);
            setActiveTab('overview');
            setErrorFilter('all');
            setExpandedErrors(new Set());
          } catch (err) {
            alert('Invalid JSON file. Please select a valid evaluation report.');
          }
        };
        reader.readAsText(file);
        event.target.value = '';
      };

      const pct = (v) => v == null ? '—' : `${(v * 100).toFixed(1)}%`;
      const scoreColor = (v) => v == null ? 'text-gray-400' : v >= 0.8 ? 'text-green-700' : v >= 0.6 ? 'text-yellow-700' : 'text-red-700';
      const scoreBg   = (v) => v == null ? 'bg-gray-50 border-gray-200' : v >= 0.8 ? 'bg-green-50 border-green-200' : v >= 0.6 ? 'bg-yellow-50 border-yellow-200' : 'bg-red-50 border-red-200';
      const scoreBar  = (v) => v == null ? 'bg-gray-300' : v >= 0.8 ? 'bg-green-500' : v >= 0.6 ? 'bg-yellow-400' : 'bg-red-500';
      const barW      = (v) => v == null ? '0%' : `${Math.min(100, (v * 100)).toFixed(1)}%`;

      const ERR_COLORS = {
        missed_section: 'bg-red-500', spurious_section: 'bg-orange-500',
        missed_leaf: 'bg-pink-500', spurious_leaf: 'bg-amber-500',
        operator_mismatch: 'bg-purple-500', evidence_mismatch: 'bg-blue-500',
        time_sensitive_mismatch: 'bg-cyan-500',
      };
      const ERR_LABELS = {
        missed_section: 'Missed Section', spurious_section: 'Extra Section',
        missed_leaf: 'Missed Leaf', spurious_leaf: 'Extra Leaf',
        operator_mismatch: 'Operator Mismatch', evidence_mismatch: 'Evidence Mismatch',
        time_sensitive_mismatch: 'Time-Sensitive Mismatch',
      };
      const ERR_BADGE = {
        missed_section: 'bg-red-100 text-red-800', spurious_section: 'bg-orange-100 text-orange-800',
        missed_leaf: 'bg-pink-100 text-pink-800', spurious_leaf: 'bg-amber-100 text-amber-800',
        operator_mismatch: 'bg-purple-100 text-purple-800', evidence_mismatch: 'bg-blue-100 text-blue-800',
        time_sensitive_mismatch: 'bg-cyan-100 text-cyan-800',
      };

      if (!reportData) {
        return (
          <div className="flex flex-col items-center justify-center py-28 text-center">
            <div className="text-7xl mb-4">📊</div>
            <h2 className="text-xl font-semibold text-gray-700 mb-2">No Evaluation Report Loaded</h2>
            <p className="text-sm text-gray-400 mb-8 max-w-sm">Import a JSON evaluation report to see a visual breakdown of annotation quality across all stages.</p>
            <label className="flex items-center gap-2 px-6 py-3 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 cursor-pointer font-medium shadow">
              <Upload size={18} /> Import Evaluation Report
              <input type="file" accept=".json" onChange={importReport} className="hidden" />
            </label>
          </div>
        );
      }

      const s1 = reportData.stage1 || {};
      const s2 = reportData.stage2 || {};
      const iam = reportData.inter_annotator_agreement || {};
      const errSummary = reportData.error_summary || {};
      const errLog = reportData.error_log || [];
      const perSection = s2.per_section || {};
      const totalErrors = errSummary.total_entries || errLog.length;
      const errTypes = errSummary.by_type || {};
      const filteredErrors = errorFilter === 'all' ? errLog : errLog.filter(e => e.error_type === errorFilter);

      const tabs = [
        { id: 'overview',   label: '📋 Overview' },
        { id: 'stage1',     label: `🗂 Stage 1: Sections` },
        { id: 'stage2',     label: `🌿 Stage 2: Logic Trees` },
        { id: 'errors',     label: `⚠️ Error Log (${totalErrors})` },
        ...(iam.n_pairs ? [{ id: 'agreement', label: '🤝 Agreement' }] : []),
      ];

      const overviewCards = [
        { label: 'Section F1',          value: s1.section_f1,                    sub: `P ${pct(s1.section_precision)} / R ${pct(s1.section_recall)}` },
        { label: 'Leaf F1',             value: s2.macro_leaf_f1,                 sub: 'Logic tree text match' },
        { label: 'Operator Accuracy',   value: s2.macro_operator_accuracy,       sub: 'ALL / ANY / NOT logic' },
        { label: 'Evidence Accuracy',   value: s2.macro_evidence_accuracy,       sub: 'Evidence source labels' },
        { label: 'Time-Sensitive Acc.', value: s2.macro_time_sensitive_accuracy, sub: 'Time flag correctness' },
      ];

      return (
        <div className="max-w-7xl mx-auto px-6 py-6">
          {/* Header row */}
          <div className="flex items-center justify-between mb-6">
            <div className="text-sm text-gray-400">Loaded report · {Object.keys(perSection).length} sections · {totalErrors} errors</div>
            <label className="flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 cursor-pointer text-sm font-medium">
              <Upload size={15} /> Load Different Report
              <input type="file" accept=".json" onChange={importReport} className="hidden" />
            </label>
          </div>

          {/* Tabs */}
          <div className="flex gap-1 border-b border-gray-200 mb-6 overflow-x-auto pb-px">
            {tabs.map(tab => (
              <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                className={`shrink-0 px-4 py-2 text-sm font-medium rounded-t-lg border border-transparent transition-all ${activeTab === tab.id ? 'border-gray-200 border-b-white bg-white -mb-px text-indigo-700' : 'text-gray-500 hover:text-gray-700'}`}>
                {tab.label}
              </button>
            ))}
          </div>

          {/* ── OVERVIEW ────────────────────── */}
          {activeTab === 'overview' && (
            <div className="space-y-5">
              {/* Score cards */}
              <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
                {overviewCards.map(m => (
                  <div key={m.label} className={`rounded-xl border p-4 ${scoreBg(m.value)}`}>
                    <div className={`text-2xl font-bold ${scoreColor(m.value)}`}>{pct(m.value)}</div>
                    <div className="text-xs font-semibold text-gray-700 mt-1 leading-tight">{m.label}</div>
                    <div className="text-xs text-gray-400 mt-0.5">{m.sub}</div>
                    <div className="mt-2 h-1.5 bg-gray-200 rounded-full overflow-hidden">
                      <div className={`h-full rounded-full ${scoreBar(m.value)}`} style={{width: barW(m.value)}}></div>
                    </div>
                  </div>
                ))}
              </div>

              {/* Error breakdown */}
              <div className="bg-white border border-gray-200 rounded-xl p-5">
                <h3 className="text-sm font-semibold text-gray-900 mb-4">Error Breakdown <span className="text-gray-400 font-normal">({totalErrors} total)</span></h3>
                <div className="space-y-2.5">
                  {Object.entries(errTypes).sort((a,b) => b[1]-a[1]).map(([type, count]) => (
                    <div key={type} className="flex items-center gap-3">
                      <div className="w-44 text-xs text-gray-500 text-right truncate">{ERR_LABELS[type] || type}</div>
                      <div className="flex-1 h-4 bg-gray-100 rounded overflow-hidden">
                        <div className={`h-full ${ERR_COLORS[type] || 'bg-gray-400'} rounded`}
                          style={{width: totalErrors ? `${(count/totalErrors)*100}%` : '0%'}}></div>
                      </div>
                      <div className="w-7 text-xs text-gray-700 font-semibold text-right">{count}</div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Stage mini-panels */}
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                <div className="bg-white border border-gray-200 rounded-xl p-5">
                  <h4 className="text-sm font-semibold text-gray-800 mb-3">Stage 1 — Section Coverage</h4>
                  <div className="grid grid-cols-3 gap-1 text-center mb-2">
                    {[
                      ['Match',    s1.n_matched,                                                                                              'text-green-600'],
                      ['Subset',   (s1.n_pred_in_ref ?? (s1.pred_in_ref || []).length) + (s1.n_ref_in_pred ?? (s1.ref_in_pred || []).length), 'text-yellow-600'],
                      ['Mismatch', (s1.n_missed ?? (s1.unmatched_ref || []).length) + (s1.n_spurious ?? (s1.unmatched_pred || []).length),    'text-red-500'],
                    ].map(([label, val, cls]) => (
                      <div key={label}>
                        <div className={`text-xl font-bold ${cls}`}>{val ?? 0}</div>
                        <div className="text-xs text-gray-400 leading-tight">{label}</div>
                      </div>
                    ))}
                  </div>
                  <div className="flex justify-center gap-4 text-xs text-gray-400 border-t border-gray-100 pt-2 mt-1">
                    <span>Ref sections: <span className="font-semibold text-gray-600">{s1.n_ref ?? ((s1.n_matched ?? 0) + (s1.n_pred_in_ref ?? 0) + (s1.n_ref_in_pred ?? 0) + (s1.n_missed ?? (s1.unmatched_ref || []).length))}</span></span>
                    <span>Pred sections: <span className="font-semibold text-gray-600">{s1.n_pred ?? ((s1.n_matched ?? 0) + (s1.n_pred_in_ref ?? 0) + (s1.n_ref_in_pred ?? 0) + (s1.n_spurious ?? (s1.unmatched_pred || []).length))}</span></span>
                  </div>
                  <div className="mt-2 text-center text-xs text-gray-400">
                    Avg text similarity: <span className="font-semibold text-gray-600">{pct(s1.mean_text_similarity)}</span>
                  </div>
                </div>
                <div className="bg-white border border-gray-200 rounded-xl p-5">
                  <h4 className="text-sm font-semibold text-gray-800 mb-3">Stage 2 — Logic Tree Quality</h4>
                  <div className="space-y-2">
                    {[['Leaf F1', s2.macro_leaf_f1], ['Operator Accuracy', s2.macro_operator_accuracy],
                      ['Evidence Accuracy', s2.macro_evidence_accuracy], ['Time-Sensitive Acc.', s2.macro_time_sensitive_accuracy]
                    ].map(([label, v]) => (
                      <div key={label} className="flex items-center gap-2">
                        <span className="text-xs text-gray-500 w-40">{label}</span>
                        <div className="flex-1 h-2 bg-gray-100 rounded overflow-hidden">
                          <div className={`h-full rounded ${scoreBar(v)}`} style={{width: barW(v)}}></div>
                        </div>
                        <span className={`text-xs font-bold w-12 text-right ${scoreColor(v)}`}>{pct(v)}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ── STAGE 1 ─────────────────────── */}
          {activeTab === 'stage1' && (
            <div className="space-y-4">
              {/* Metric cards */}
              <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
                {[['Precision', s1.section_precision], ['Recall', s1.section_recall],
                  ['F1 Score', s1.section_f1], ['Text Similarity', s1.mean_text_similarity]].map(([label, v]) => (
                  <div key={label} className={`rounded-xl border p-4 ${scoreBg(v)}`}>
                    <div className={`text-2xl font-bold ${scoreColor(v)}`}>{pct(v)}</div>
                    <div className="text-sm text-gray-600 mt-0.5">{label}</div>
                  </div>
                ))}
              </div>

              {/* Count summary row */}
              <div className="bg-white border border-gray-200 rounded-xl px-5 py-3 flex flex-wrap items-center gap-x-6 gap-y-2 text-sm">
                <span className="text-gray-500">✅ Match: <strong className="text-green-700">{s1.n_matched ?? 0}</strong></span>
                <span className="text-gray-500">⊂ Subset: <strong className="text-yellow-700">{(s1.n_pred_in_ref ?? (s1.pred_in_ref || []).length) + (s1.n_ref_in_pred ?? (s1.ref_in_pred || []).length)}</strong>
                  <span className="text-xs text-gray-400 ml-1">(pred⊂ref: {s1.n_pred_in_ref ?? (s1.pred_in_ref || []).length} / ref⊂pred: {s1.n_ref_in_pred ?? (s1.ref_in_pred || []).length})</span>
                </span>
                <span className="text-gray-500">❌ Mismatch: <strong className="text-red-600">{(s1.n_missed ?? (s1.unmatched_ref || []).length) + (s1.n_spurious ?? (s1.unmatched_pred || []).length)}</strong>
                  <span className="text-xs text-gray-400 ml-1">(missed: {s1.n_missed ?? (s1.unmatched_ref || []).length} / spurious: {s1.n_spurious ?? (s1.unmatched_pred || []).length})</span>
                </span>
                <span className="ml-auto text-xs text-gray-400 flex gap-3">
                  <span>Ref: <strong className="text-gray-600">{s1.n_ref ?? ((s1.n_matched ?? 0) + (s1.n_pred_in_ref ?? 0) + (s1.n_ref_in_pred ?? 0) + (s1.n_missed ?? (s1.unmatched_ref || []).length))}</strong></span>
                  <span>Pred: <strong className="text-gray-600">{s1.n_pred ?? ((s1.n_matched ?? 0) + (s1.n_pred_in_ref ?? 0) + (s1.n_ref_in_pred ?? 0) + (s1.n_spurious ?? (s1.unmatched_pred || []).length))}</strong></span>
                </span>
              </div>

              {/* ✅ Matched */}
              {(s1.matches || []).length > 0 && (
                <div className="bg-white border border-gray-200 rounded-xl p-5">
                  <h3 className="text-sm font-semibold text-gray-900 mb-3">✅ Matched Sections ({(s1.matches || []).length})</h3>
                  <div className="space-y-3">
                    {(s1.matches || []).map((m, i) => (
                      <div key={i} className="border border-gray-100 rounded-lg p-3">
                        <div className="flex items-center gap-2 mb-2">
                          <span className="font-mono bg-blue-100 text-blue-800 px-2 py-0.5 rounded text-xs">{m.pred_id}</span>
                          <span className="text-gray-300 text-xs">↔</span>
                          <span className="font-mono bg-green-100 text-green-800 px-2 py-0.5 rounded text-xs">{m.ref_id}</span>
                          <span className={`ml-auto text-xs font-semibold ${scoreColor(m.similarity)}`}>{pct(m.similarity)}</span>
                        </div>
                        <ExpandableText text={m.pred_text} className="text-xs text-gray-500" />
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* ⊂ Subset Sections: pred ⊂ ref */}
              {(s1.pred_in_ref || []).length > 0 && (
                <div className="bg-yellow-50 border border-yellow-200 rounded-xl p-5">
                  <h3 className="text-sm font-semibold text-yellow-900 mb-1">⊂ Subset Sections: pred_id ⊂ ref_id ({(s1.pred_in_ref || []).length})</h3>
                  <p className="text-xs text-yellow-700 mb-3">Prediction is contained within the reference — annotator under-extracted or split the section.</p>
                  <div className="space-y-3">
                    {(s1.pred_in_ref || []).map((m, i) => (
                      <div key={i} className="bg-white rounded-lg p-3 border border-yellow-200">
                        <div className="flex items-center gap-2 mb-2">
                          <span className="font-mono bg-blue-100 text-blue-800 px-2 py-0.5 rounded text-xs">{m.pred_id}</span>
                          <span className="text-yellow-500 text-xs font-bold">⊂</span>
                          <span className="font-mono bg-green-100 text-green-800 px-2 py-0.5 rounded text-xs">{m.ref_id}</span>
                          {(m.partial_sim ?? m.similarity) != null && <span className={`ml-auto text-xs font-semibold ${scoreColor(m.partial_sim ?? m.similarity)}`}>partial: {pct(m.partial_sim ?? m.similarity)}</span>}
                        </div>
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-2">
                          <div>
                            <div className="text-xs font-semibold text-gray-400 mb-1">Prediction (fragment)</div>
                            <ExpandableText text={m.pred_text} className="text-xs text-gray-600 bg-blue-50 rounded p-2" />
                          </div>
                          <div>
                            <div className="text-xs font-semibold text-gray-400 mb-1">Reference (full)</div>
                            <ExpandableText text={m.ref_text} className="text-xs text-gray-600 bg-green-50 rounded p-2" />
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* ⊂ Subset Sections: ref ⊂ pred */}
              {(s1.ref_in_pred || []).length > 0 && (
                <div className="bg-purple-50 border border-purple-200 rounded-xl p-5">
                  <h3 className="text-sm font-semibold text-purple-900 mb-1">⊂ Subset Sections: ref_id ⊂ pred_id ({(s1.ref_in_pred || []).length})</h3>
                  <p className="text-xs text-purple-700 mb-3">Reference is contained within the prediction — annotator over-merged multiple sections into one.</p>
                  <div className="space-y-3">
                    {(s1.ref_in_pred || []).map((m, i) => (
                      <div key={i} className="bg-white rounded-lg p-3 border border-purple-200">
                        <div className="flex items-center gap-2 mb-2">
                          <span className="font-mono bg-green-100 text-green-800 px-2 py-0.5 rounded text-xs">{m.ref_id}</span>
                          <span className="text-purple-500 text-xs font-bold">⊂</span>
                          <span className="font-mono bg-blue-100 text-blue-800 px-2 py-0.5 rounded text-xs">{m.pred_id}</span>
                          {(m.partial_sim ?? m.similarity) != null && <span className={`ml-auto text-xs font-semibold ${scoreColor(m.partial_sim ?? m.similarity)}`}>partial: {pct(m.partial_sim ?? m.similarity)}</span>}
                        </div>
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-2">
                          <div>
                            <div className="text-xs font-semibold text-gray-400 mb-1">Reference (fragment)</div>
                            <ExpandableText text={m.ref_text} className="text-xs text-gray-600 bg-green-50 rounded p-2" />
                          </div>
                          <div>
                            <div className="text-xs font-semibold text-gray-400 mb-1">Prediction (merged)</div>
                            <ExpandableText text={m.pred_text} className="text-xs text-gray-600 bg-blue-50 rounded p-2" />
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* ❌ Missed */}
              {((s1.unmatched_ref || []).length > 0 || s1.n_missed > 0) && (
                <div className="bg-red-50 border border-red-200 rounded-xl p-5">
                  <h3 className="text-sm font-semibold text-red-900 mb-3">❌ Missed Sections <span className="font-normal text-red-600">(in reference, not found in annotation)</span> — {s1.n_missed ?? (s1.unmatched_ref || []).length}</h3>
                  <div className="space-y-2">
                    {(s1.unmatched_ref || []).map((sec, i) => (
                      <div key={i} className="bg-white rounded-lg p-3 border border-red-100">
                        <div className="font-mono text-xs text-red-700 font-bold mb-1">{sec.id}</div>
                        <ExpandableText text={sec.text} className="text-xs text-gray-500" />
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* ⚠️ Spurious */}
              {((s1.unmatched_pred || []).length > 0 || s1.n_spurious > 0) && (
                <div className="bg-orange-50 border border-orange-200 rounded-xl p-5">
                  <h3 className="text-sm font-semibold text-orange-900 mb-3">⚠️ Spurious Sections <span className="font-normal text-orange-600">(in annotation, not in reference)</span> — {s1.n_spurious ?? (s1.unmatched_pred || []).length}</h3>
                  <div className="space-y-2">
                    {(s1.unmatched_pred || []).map((sec, i) => (
                      <div key={i} className="bg-white rounded-lg p-3 border border-orange-100">
                        <div className="font-mono text-xs text-orange-700 font-bold mb-1">{sec.id}</div>
                        <ExpandableText text={sec.text} className="text-xs text-gray-500" />
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}

          {/* ── STAGE 2 ─────────────────────── */}
          {activeTab === 'stage2' && (
            <div className="space-y-4">
              <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
                {[['Leaf F1', s2.macro_leaf_f1, 'Req. text matching'],
                  ['Operator Accuracy', s2.macro_operator_accuracy, 'ALL/ANY/NOT logic'],
                  ['Evidence Accuracy', s2.macro_evidence_accuracy, 'Evidence source labels'],
                  ['Time-Sensitive Acc.', s2.macro_time_sensitive_accuracy, 'Time flag correctness']].map(([label, v, sub]) => (
                  <div key={label} className={`rounded-xl border p-4 ${scoreBg(v)}`}>
                    <div className={`text-2xl font-bold ${scoreColor(v)}`}>{pct(v)}</div>
                    <div className="text-sm font-medium text-gray-700 mt-0.5">{label}</div>
                    <div className="text-xs text-gray-400">{sub}</div>
                  </div>
                ))}
              </div>

              <div className="bg-white border border-gray-200 rounded-xl overflow-hidden">
                <div className="px-5 py-3 bg-gray-50 border-b border-gray-200 flex items-center gap-2">
                  <h3 className="text-sm font-semibold text-gray-900">Per-Section Breakdown</h3>
                  <span className="text-xs text-gray-400">({Object.keys(perSection).length} sections)</span>
                </div>
                <div className="overflow-x-auto">
                  <table className="w-full text-xs">
                    <thead>
                      <tr className="border-b border-gray-100">
                        {['Section', 'Leaf P', 'Leaf R', 'Leaf F1', 'Operator', 'Evidence', 'Time-Sens.'].map(h => (
                          <th key={h} className={`px-4 py-2 font-semibold text-gray-500 ${h === 'Section' ? 'text-left' : 'text-center'}`}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {Object.values(perSection).map((s, i) => (
                        <tr key={s.section_id} className={`border-b border-gray-50 ${i % 2 ? 'bg-gray-50/40' : ''}`}>
                          <td className="px-4 py-2 font-mono font-bold text-indigo-700">{s.section_id}</td>
                          {[s.leaf_precision, s.leaf_recall, s.leaf_f1, s.operator_accuracy, s.evidence_accuracy, s.time_sensitive_accuracy].map((v, j) => (
                            <td key={j} className={`px-4 py-2 text-center font-semibold ${scoreColor(v)}`}>{pct(v)}</td>
                          ))}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {/* ── ERROR LOG ───────────────────── */}
          {activeTab === 'errors' && (
            <div>
              {/* Filter chips */}
              <div className="flex items-center gap-2 mb-4 flex-wrap">
                <span className="text-xs text-gray-400 mr-1">Filter:</span>
                <button onClick={() => setErrorFilter('all')}
                  className={`px-3 py-1 rounded-full text-xs font-medium ${errorFilter === 'all' ? 'bg-gray-800 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>
                  All ({totalErrors})
                </button>
                {Object.entries(errTypes).sort((a,b) => b[1]-a[1]).map(([type, count]) => (
                  <button key={type} onClick={() => setErrorFilter(type)}
                    className={`px-3 py-1 rounded-full text-xs font-medium ${errorFilter === type ? 'bg-gray-800 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>
                    {ERR_LABELS[type] || type} ({count})
                  </button>
                ))}
              </div>

              {/* Error cards */}
              <div className="space-y-2">
                {filteredErrors.map((err, i) => {
                  const isExp = expandedErrors.has(i);
                  return (
                    <div key={i} className="bg-white border border-gray-200 rounded-lg overflow-hidden">
                      <button className="w-full flex items-center gap-2.5 px-4 py-3 text-left hover:bg-gray-50 transition-colors"
                        onClick={() => {
                          const next = new Set(expandedErrors);
                          isExp ? next.delete(i) : next.add(i);
                          setExpandedErrors(next);
                        }}>
                        <span className={`shrink-0 px-2 py-0.5 rounded text-xs font-medium ${err.stage === 'stage1' ? 'bg-blue-100 text-blue-800' : 'bg-purple-100 text-purple-800'}`}>{err.stage}</span>
                        {err.section_id && <span className="font-mono text-xs text-indigo-700 font-bold">{err.section_id}</span>}
                        <span className={`px-2 py-0.5 rounded text-xs font-medium ${ERR_BADGE[err.error_type] || 'bg-gray-100 text-gray-700'}`}>{ERR_LABELS[err.error_type] || err.error_type}</span>
                        {err.similarity != null && <span className={`ml-auto text-xs font-semibold ${scoreColor(err.similarity)}`}>{pct(err.similarity)}</span>}
                        <ChevronDown size={14} className={`text-gray-400 transition-transform shrink-0 ${isExp ? 'rotate-180' : ''}`} />
                      </button>
                      {isExp && (
                        <div className="px-4 pb-4 pt-3 border-t border-gray-100 grid grid-cols-1 lg:grid-cols-2 gap-3">
                          <div>
                            <div className="text-xs font-semibold text-gray-500 mb-1.5">📗 Reference (expected)</div>
                            <div className="bg-green-50 border border-green-200 rounded-lg p-3 text-xs text-gray-700 whitespace-pre-wrap leading-relaxed">{err.ref_text || '(none)'}</div>
                          </div>
                          <div>
                            <div className="text-xs font-semibold text-gray-500 mb-1.5">📙 Prediction (annotator)</div>
                            <div className="bg-orange-50 border border-orange-200 rounded-lg p-3 text-xs text-gray-700 whitespace-pre-wrap leading-relaxed">{err.pred_text || '(none — not found)'}</div>
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })}
                {filteredErrors.length === 0 && (
                  <div className="text-center py-12 text-gray-400">No errors in this category 🎉</div>
                )}
              </div>
            </div>
          )}

          {/* ── INTER-ANNOTATOR AGREEMENT ───── */}
          {activeTab === 'agreement' && (
            <div className="space-y-4">
              <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
                {[['Section F1', iam.mean_stage1_section_f1], ['Leaf F1', iam.mean_stage2_leaf_f1],
                  ['Operator Acc.', iam.mean_stage2_operator_accuracy], ['CPT Code F1', iam.mean_stage3_code_f1],
                  ['Link Jaccard', iam.mean_stage3_section_link_jaccard]].map(([label, v]) => (
                  <div key={label} className={`rounded-xl border p-4 ${scoreBg(v)}`}>
                    <div className={`text-2xl font-bold ${scoreColor(v)}`}>{pct(v)}</div>
                    <div className="text-xs font-semibold text-gray-600 mt-1">{label}</div>
                    <div className="text-xs text-gray-400">Mean across {iam.n_pairs} pair{iam.n_pairs > 1 ? 's' : ''}</div>
                  </div>
                ))}
              </div>

              <div className="bg-white border border-gray-200 rounded-xl overflow-hidden">
                <div className="px-5 py-3 bg-gray-50 border-b border-gray-200">
                  <h3 className="text-sm font-semibold text-gray-900">Annotator Pairs</h3>
                </div>
                <div className="overflow-x-auto">
                  <table className="w-full text-xs">
                    <thead>
                      <tr className="border-b border-gray-100">
                        {['Annotator A', 'Annotator B', 'Section F1', 'Leaf F1', 'Operator Acc.', 'CPT F1', 'Link Jaccard'].map(h => (
                          <th key={h} className={`px-4 py-2 font-semibold text-gray-500 ${h.startsWith('Annotator') ? 'text-left' : 'text-center'}`}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {(iam.pairs || []).map((p, i) => (
                        <tr key={i} className="border-b border-gray-50">
                          <td className="px-4 py-2 font-medium text-gray-700">{p.annotator_a}</td>
                          <td className="px-4 py-2 font-medium text-gray-700">{p.annotator_b}</td>
                          {[p.stage1_section_f1, p.stage2_leaf_f1, p.stage2_operator_accuracy, p.stage3_code_f1, p.stage3_link_jaccard].map((v, j) => (
                            <td key={j} className={`px-4 py-2 text-center font-bold ${scoreColor(v)}`}>{pct(v)}</td>
                          ))}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AnnotationTool />);
  </script>
</body>
</html>

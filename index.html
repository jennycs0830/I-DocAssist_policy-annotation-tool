/* ── SUMMARY TAB ── */
function SummaryTab({ annotators, loadedAnnotators }) {
  const pairwiseSec = useMemo(() => {
    const pairs = [];
    for (let i = 0; i < loadedAnnotators.length; i++) {
      for (let j = i+1; j < loadedAnnotators.length; j++) {
        const a = loadedAnnotators[i], b = loadedAnnotators[j];
        const sA = new Set((a.data?.sections||[]).map(s => s.id));
        const sB = new Set((b.data?.sections||[]).map(s => s.id));
        const inter = [...sA].filter(x => sB.has(x)).length;
        const union = new Set([...sA,...sB]).size;
        pairs.push({ a:a.name, b:b.name, jaccard:union>0?inter/union:0, both:inter, onlyA:[...sA].filter(x=>!sB.has(x)).length, onlyB:[...sB].filter(x=>!sA.has(x)).length });
      }
    }
    return pairs;
  }, [loadedAnnotators]);

  const pairwiseCPT = useMemo(() => {
    const pairs = [];
    for (let i = 0; i < loadedAnnotators.length; i++) {
      for (let j = i+1; j < loadedAnnotators.length; j++) {
        const a = loadedAnnotators[i], b = loadedAnnotators[j];
        const cA = new Set(Object.keys(a.data?.cpt_mappings||{}));
        const cB = new Set(Object.keys(b.data?.cpt_mappings||{}));
        const inter = [...cA].filter(x => cB.has(x)).length;
        const union = new Set([...cA,...cB]).size;
        pairs.push({ a:a.name, b:b.name, jaccard:union>0?inter/union:0 });
      }
    }
    return pairs;
  }, [loadedAnnotators]);

  if (loadedAnnotators.length < 2)
    return <div className="text-center py-16 text-gray-400">Load at least 2 annotation files to compare</div>;

  return (
    <div className="space-y-6">
      {/* Per-annotator stats */}
      <div>
        <h3 className="font-semibold text-gray-700 mb-3">Annotator Statistics</h3>
        <div className="grid gap-3" style={{gridTemplateColumns:`repeat(${loadedAnnotators.length},minmax(0,1fr))`}}>
          {loadedAnnotators.map(a => {
            const c = acol(annotators.findIndex(ann => ann.id === a.id));
            return (
              <div key={a.id} className={`rounded-xl border ${c.border} ${c.bg} p-4`}>
                <div className={`font-bold text-sm mb-3 ${c.text}`}>{a.name}</div>
                <div className="space-y-1.5 text-sm">
                  <div className="flex justify-between"><span className="text-gray-600">Sections</span><span className="font-bold text-gray-800">{(a.data?.sections||[]).length}</span></div>
                  <div className="flex justify-between"><span className="text-gray-600">Logic Trees</span><span className="font-bold text-gray-800">{Object.keys(a.data?.logic_trees||{}).length}</span></div>
                  <div className="flex justify-between"><span className="text-gray-600">CPT Codes</span><span className="font-bold text-gray-800">{Object.keys(a.data?.cpt_mappings||{}).length}</span></div>
                  {a.data?.document_title && <div className="text-xs text-gray-500 mt-2 pt-2 border-t border-gray-200 truncate" title={a.data.document_title}>{a.data.document_title}</div>}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Pairwise section agreement */}
      <div>
        <h3 className="font-semibold text-gray-700 mb-3">Pairwise Section Agreement (Jaccard)</h3>
        <div className="rounded-xl border border-gray-200 bg-white overflow-hidden">
          <table className="w-full text-sm">
            <thead className="bg-gray-50 border-b border-gray-200">
              <tr>{['Annotator A','Annotator B','Shared','Only A','Only B','Jaccard'].map(h=><th key={h} className="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">{h}</th>)}</tr>
            </thead>
            <tbody className="divide-y divide-gray-100">
              {pairwiseSec.map((p,i)=>(
                <tr key={i} className="hover:bg-gray-50">
                  <td className="px-4 py-3 font-mono text-xs text-gray-700">{p.a}</td>
                  <td className="px-4 py-3 font-mono text-xs text-gray-700">{p.b}</td>
                  <td className="px-4 py-3 font-bold text-green-700">{p.both}</td>
                  <td className="px-4 py-3 font-bold text-red-600">{p.onlyA}</td>
                  <td className="px-4 py-3 font-bold text-orange-600">{p.onlyB}</td>
                  <td className={`px-4 py-3 font-bold text-sm ${sColor(p.jaccard)}`}>{pct(p.jaccard)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {/* Pairwise CPT agreement */}
      <div>
        <h3 className="font-semibold text-gray-700 mb-3">Pairwise CPT Code Agreement (Jaccard)</h3>
        <div className="rounded-xl border border-gray-200 bg-white overflow-hidden">
          <table className="w-full text-sm">
            <thead className="bg-gray-50 border-b border-gray-200">
              <tr>{['Annotator A','Annotator B','CPT Jaccard'].map(h=><th key={h} className="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">{h}</th>)}</tr>
            </thead>
            <tbody className="divide-y divide-gray-100">
              {pairwiseCPT.map((p,i)=>(
                <tr key={i} className="hover:bg-gray-50">
                  <td className="px-4 py-3 font-mono text-xs text-gray-700">{p.a}</td>
                  <td className="px-4 py-3 font-mono text-xs text-gray-700">{p.b}</td>
                  <td className={`px-4 py-3 font-bold text-sm ${sColor(p.jaccard)}`}>{pct(p.jaccard)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ── COMPARE VIEW ROOT ── */
function CompareView() {
  const [annotators, setAnnotators] = useState([
    { id:'cmp_1', name:'Annotator 1', data:null },
    { id:'cmp_2', name:'Annotator 2', data:null },
    { id:'cmp_3', name:'Annotator 3', data:null },
  ]);
  const [activeTab, setActiveTab] = useState('sections');
  const nextIdRef = React.useRef(4);

  const loadedAnnotators = annotators.filter(a => a.data !== null);

  const loadFile = (id, e) => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        const d = JSON.parse(ev.target.result);
        setAnnotators(prev => prev.map(a => a.id === id ? {...a, data:d} : a));
      } catch(err) { alert('Failed to load JSON: ' + err.message); }
    };
    r.readAsText(f); e.target.value = '';
  };

  const updateName = (id, name) => setAnnotators(prev => prev.map(a => a.id===id ? {...a,name} : a));
  const clearSlot  = id          => setAnnotators(prev => prev.map(a => a.id===id ? {...a,data:null} : a));
  const addSlot    = () => {
    if (annotators.length >= 6) return;
    const id = 'cmp_' + nextIdRef.current++;
    setAnnotators(prev => [...prev, {id, name:`Annotator ${prev.length+1}`, data:null}]);
  };
  const removeSlot = id => { if (annotators.length <= 2) return; setAnnotators(prev => prev.filter(a => a.id !== id)); };

  const compareTabs = [
    { id:'sections', label:'Sections',    icon:FileText  },
    { id:'trees',    label:'Logic Trees', icon:GitBranch },
    { id:'cpt',      label:'CPT Codes',   icon:LinkIcon  },
    { id:'summary',  label:'Summary',     icon:BarChart  },
  ];

  return (
    <div className="min-h-screen bg-gray-50">
      {/* Compare sub-header */}
      <div className="bg-white border-b border-gray-200 px-6 py-5">
        <div className="max-w-7xl mx-auto">
          <div className="flex items-center justify-between mb-5">
            <div>
              <h2 className="text-lg font-bold text-gray-900">Compare Annotations</h2>
              <p className="text-xs text-gray-400 mt-0.5">Load 2–6 annotation JSON files to compare side by side</p>
            </div>
            <button onClick={addSlot} disabled={annotators.length >= 6}
              className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm transition-colors ${annotators.length >= 6 ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-blue-50 text-blue-700 border border-blue-200 hover:bg-blue-100'}`}>
              <Plus size={16}/> Add Annotator
            </button>
          </div>

          {/* Annotator slots */}
          <div className="flex flex-wrap gap-3">
            {annotators.map((a, i) => {
              const c = acol(i);
              return (
                <div key={a.id} className={`rounded-xl border-2 ${a.data ? c.border : 'border-dashed border-gray-300'} bg-white p-3`} style={{minWidth:'176px',maxWidth:'220px'}}>
                  <div className="flex items-center gap-2 mb-2">
                    <div className={`w-2.5 h-2.5 rounded-full shrink-0 ${a.data ? c.dot : 'bg-gray-300'}`}/>
                    <input value={a.name} onChange={e => updateName(a.id, e.target.value)}
                      className="flex-1 text-sm font-semibold text-gray-700 bg-transparent border-none focus:outline-none focus:bg-gray-50 rounded px-1 -mx-1 min-w-0"
                      placeholder="Annotator name"/>
                    {annotators.length > 2 && (
                      <button onClick={() => removeSlot(a.id)} className="text-gray-300 hover:text-red-400 p-0.5 shrink-0"><Trash2 size={13}/></button>
                    )}
                  </div>
                  {a.data ? (
                    <div className="space-y-1">
                      <div className={`text-xs font-medium ${c.text}`}>✓ Loaded</div>
                      {a.data.document_title && <div className="text-xs text-gray-400 truncate" title={a.data.document_title}>{a.data.document_title}</div>}
                      <div className="flex gap-2 text-xs text-gray-400">
                        <span>{(a.data.sections||[]).length} §</span>
                        <span>{Object.keys(a.data.cpt_mappings||{}).length} CPT</span>
                      </div>
                      <button onClick={() => clearSlot(a.id)} className="text-xs text-gray-400 hover:text-red-500 mt-0.5">Clear ✕</button>
                    </div>
                  ) : (
                    <label className="block cursor-pointer mt-1">
                      <div className={`flex items-center gap-1.5 px-2 py-1.5 rounded-lg border ${c.border} ${c.bg} ${c.text} text-xs hover:opacity-80 transition-opacity`}>
                        <Upload size={13}/> Load JSON
                      </div>
                      <input type="file" accept=".json" onChange={e => loadFile(a.id, e)} className="hidden"/>
                    </label>
                  )}
                </div>
              );
            })}
          </div>

          {/* Tabs — only show when 2+ loaded */}
          {loadedAnnotators.length >= 2 && (
            <div className="flex gap-1 mt-4">
              {compareTabs.map(t => (
                <button key={t.id} onClick={() => setActiveTab(t.id)}
                  className={`flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm transition-all ${activeTab === t.id ? 'bg-blue-100 text-blue-700 font-semibold' : 'bg-gray-100 text-gray-500 hover:bg-gray-200'}`}>
                  <t.icon size={15}/>{t.label}
                </button>
              ))}
            </div>
          )}
        </div>
      </div>

      {/* Tab content */}
      <main className="max-w-7xl mx-auto px-6 py-6">
        {loadedAnnotators.length < 2 ? (
          <div className="text-center py-20">
            <Layers size={48} className="mx-auto mb-4 text-gray-300"/>
            <p className="text-gray-500 text-lg font-medium">Load annotation files to start comparing</p>
            <p className="text-gray-400 text-sm mt-1">Minimum 2 files required · up to 6 supported</p>
          </div>
        ) : (
          <>
            {activeTab === 'sections' && <SectionsCompareTab annotators={annotators} loadedAnnotators={loadedAnnotators}/>}
            {activeTab === 'trees'    && <TreesCompareTab    annotators={annotators} loadedAnnotators={loadedAnnotators}/>}
            {activeTab === 'cpt'      && <CPTCompareTab      annotators={annotators} loadedAnnotators={loadedAnnotators}/>}
            {activeTab === 'summary'  && <SummaryTab         annotators={annotators} loadedAnnotators={loadedAnnotators}/>}
          </>
        )}
      </main>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   MAIN ANNOTATION TOOL
══════════════════════════════════════════════════════════ */
function AnnotationTool() {
  const [currentStage,      setCurrentStage]      = useState(1);
  const [documentTitle,     setDocumentTitle]      = useState('');
  const [sections,          setSections]           = useState([]);
  const [sectionTrees,      setSectionTrees]       = useState({});
  const [sectionIndications,setSectionIndications] = useState({});
  const [sectionRefs,       setSectionRefs]        = useState({});
  const [cptMappings,       setCptMappings]        = useState([]);
  const [annotatorNotes,    setAnnotatorNotes]     = useState('');
  const [appFeedback,       setAppFeedback]        = useState('');
  const [showFeedbackPanel, setShowFeedbackPanel]  = useState(false);
  const [reportData,        setReportData]         = useState(null);
  const [showReport,        setShowReport]         = useState(false);

  const stages = [
    { id:1, name:'Section Extraction', icon:FileText  },
    { id:2, name:'Atomic Breakdown',   icon:GitBranch },
    { id:3, name:'CPT Mapping',        icon:LinkIcon  }
  ];

  const canProceed = () => {
    if (currentStage === 1) return sections.length > 0 && documentTitle.trim() !== '';
    if (currentStage === 2) return sections.some(s =>
      (sectionIndications[s.id] || '').trim() &&
      (sectionTrees[s.id] || sectionRefs[s.id])
    );
    return true;
  };

  const exportData = () => {
    const sectionsExport = sections.map(s => ({ id:s.id, text:s.text }));
    const sectionAnnotationsExport = {};
    sections.forEach(s => {
      const indication = (sectionIndications[s.id] || '').trim();
      if (!indication) return;
      const ref  = sectionRefs[s.id];
      const tree = sectionTrees[s.id];
      if (ref) {
        sectionAnnotationsExport[s.id] = { indication, output_type:'reference', reference_document:ref };
      } else if (tree) {
        sectionAnnotationsExport[s.id] = { indication, output_type:'inline', logic_tree:convertTreeToExportFormat(tree) };
      }
    });
    const cptMappingsExport = {};
    cptMappings.forEach(m => { cptMappingsExport[m.cpt_code] = { sections:m.sections||[], is_addon:m.is_addon||false }; });
    const ts = new Date().toISOString();
    const fp = documentTitle.replace(/\s+/g,'_') || 'annotation';
    const dl = (d, n) => { const b = new Blob([JSON.stringify(d,null,2)],{type:'application/json'}); const u = URL.createObjectURL(b); const a = document.createElement('a'); a.href=u; a.download=n; a.click(); URL.revokeObjectURL(u); };
    dl({ document_title:documentTitle, sections:sectionsExport, section_annotations:sectionAnnotationsExport, cpt_mappings:cptMappingsExport, exported_at:ts }, `${fp}_annotation.json`);
    if (annotatorNotes.trim() || appFeedback.trim())
      setTimeout(() => dl({ document_title:documentTitle, annotator_notes:annotatorNotes, app_feedback:appFeedback, exported_at:ts }, `${fp}_feedback.json`), 500);
  };

  const convertImportedTree = n => {
    if (!n) return null;
    const id = `node_${Date.now()}_${Math.random().toString(36).substr(2,9)}`;
    if (n.type === 'leaf') return { id, type:'leaf', text:n.text||'', children:[], evidence_sources: Array.isArray(n.evidence_sources) ? n.evidence_sources : (n.evidence_source ? [n.evidence_source] : []) };
    return { id, type:n.type, text:'', children:(n.children||[]).map(convertImportedTree).filter(Boolean), evidence_sources:[] };
  };

  const importData = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        const d = JSON.parse(ev.target.result);
        if (d.document_title) setDocumentTitle(d.document_title);
        if (d.sections) setSections((Array.isArray(d.sections) ? d.sections : []).map(s => ({ id:s.id, text:s.text, created_at:new Date().toISOString() })));
        if (d.section_annotations) {
          const trees={}, refs={}, indications={};
          Object.entries(d.section_annotations).forEach(([sid, ann]) => {
            if (ann.indication) indications[sid] = ann.indication;
            if (ann.output_type === 'inline' && ann.logic_tree)
              trees[sid] = convertImportedTree(ann.logic_tree);
            else if (ann.output_type === 'reference' && ann.reference_document)
              refs[sid] = ann.reference_document;
          });
          setSectionTrees(trees); setSectionRefs(refs); setSectionIndications(indications);
        } else if (d.logic_trees) {
          // backward compat: old format without indication/output_type
          const t={};
          Object.keys(d.logic_trees).forEach(sid=>{t[sid]=convertImportedTree(d.logic_trees[sid]);});
          setSectionTrees(t);
        }
        if (d.cpt_mappings) { const m=[]; Object.keys(d.cpt_mappings).forEach(c=>{const mp=d.cpt_mappings[c];m.push({cpt_code:c,sections:mp.sections||[],is_addon:mp.is_addon||false,created_at:new Date().toISOString()});}); setCptMappings(m); }
        if (d.annotator_notes) setAnnotatorNotes(d.annotator_notes);
        if (d.app_feedback)    setAppFeedback(d.app_feedback);
        alert('Import successful!');
      } catch(err) { alert('Import failed: Invalid JSON.'); console.error(err); }
    };
    r.readAsText(f); e.target.value = '';
  };

  const importReport = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        const d = JSON.parse(ev.target.result);
        if (!d.stage1 && !d.stage2) throw new Error('Not a valid report file');
        setReportData(d); setShowReport(true);
      } catch(err) { alert('Report load failed: ' + err.message); }
    };
    r.readAsText(f); e.target.value = '';
  };

  /* Render report viewer full-screen */
  if (showReport && reportData) return <ReportViewer reportData={reportData} onBack={() => setShowReport(false)}/>;

  return (
    <div className="min-h-screen bg-gray-50">
      {/* HEADER */}
      <header className="bg-white border-b border-gray-200 px-6 py-4 sticky top-0 z-30">
        <div className="max-w-7xl mx-auto">
          <div className="flex items-center justify-between mb-4 flex-wrap gap-3">
            <h1 className="text-2xl font-bold text-gray-900">Policy Annotation Tool</h1>
            <div className="flex items-center gap-2 flex-wrap">
              <button onClick={() => setShowFeedbackPanel(!showFeedbackPanel)}
                className={`flex items-center gap-2 px-4 py-2 rounded-lg transition-colors text-sm ${showFeedbackPanel ? 'bg-purple-100 text-purple-700' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`}>
                <MessageSquare size={16}/> Notes &amp; Feedback
              </button>
              <label className="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 cursor-pointer text-sm">
                <Upload size={16}/> Import JSON
                <input type="file" accept=".json" onChange={importData} className="hidden"/>
              </label>
              {/* Report button */}
              <label className={`flex items-center gap-2 px-4 py-2 rounded-lg cursor-pointer text-sm ${reportData ? 'bg-teal-600 text-white hover:bg-teal-700' : 'bg-teal-100 text-teal-800 hover:bg-teal-200'}`}>
                <BarChart size={16}/>{reportData ? 'View Report' : 'Load Report'}
                {reportData && <button onClick={e => { e.preventDefault(); setShowReport(true); }} className="ml-1 underline text-xs" title="View loaded report">↗</button>}
                {!reportData && <input type="file" accept=".json" onChange={importReport} className="hidden"/>}
              </label>
              {reportData && <label className="flex items-center gap-1 px-3 py-2 text-xs text-teal-700 bg-teal-50 rounded-lg cursor-pointer hover:bg-teal-100">Reload<input type="file" accept=".json" onChange={importReport} className="hidden"/></label>}
              <button onClick={exportData} className="flex items-center gap-2 px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 text-sm">
                <Download size={16}/> Export JSON
              </button>
            </div>
          </div>
          {/* Stage progress */}
          <div className="flex items-center gap-2">
            {stages.map((stage, idx) => (
              <React.Fragment key={stage.id}>
                <button onClick={() => setCurrentStage(stage.id)}
                  className={`flex items-center gap-2 px-4 py-2 rounded-lg transition-all text-sm ${currentStage === stage.id ? 'bg-blue-100 text-blue-700 font-medium' : currentStage > stage.id ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'}`}>
                  <span className={`w-5 h-5 rounded-full text-xs font-bold flex items-center justify-center ${currentStage === stage.id ? 'bg-blue-600 text-white' : currentStage > stage.id ? 'bg-green-600 text-white' : 'bg-gray-300 text-gray-600'}`}>{stage.id}</span>
                  <span className="hidden sm:inline">{stage.name}</span>
                </button>
                {idx < stages.length - 1 && <div className={`h-0.5 w-8 rounded ${currentStage > stage.id ? 'bg-green-400' : 'bg-gray-200'}`}/>}
              </React.Fragment>
            ))}
          </div>
        </div>
      </header>

      {/* NOTES PANEL */}
      {showFeedbackPanel && (
        <div className="max-w-7xl mx-auto px-6 py-4">
          <div className="bg-purple-50 border border-purple-200 rounded-xl p-6">
            <div className="flex items-center justify-between mb-4">
              <h2 className="text-lg font-semibold text-purple-900 flex items-center gap-2"><MessageSquare size={20}/> Annotator Notes &amp; App Feedback</h2>
              <button onClick={() => setShowFeedbackPanel(false)} className="text-purple-600 hover:text-purple-800 text-sm">Close</button>
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
              <div>
                <label className="block text-sm font-medium text-purple-800 mb-2">Annotator Notes <span className="text-purple-500 font-normal">(notes about this document annotation)</span></label>
                <textarea value={annotatorNotes} onChange={e => setAnnotatorNotes(e.target.value)} placeholder="Add any notes about this document..." rows={5} className="w-full px-4 py-3 border border-purple-300 rounded-lg focus:ring-2 focus:ring-purple-500 resize-none bg-white"/>
              </div>
              <div>
                <label className="block text-sm font-medium text-purple-800 mb-2">App Feedback <span className="text-purple-500 font-normal">(suggestions for improving this tool)</span></label>
                <textarea value={appFeedback} onChange={e => setAppFeedback(e.target.value)} placeholder="Share feedback about the annotation tool..." rows={5} className="w-full px-4 py-3 border border-purple-300 rounded-lg focus:ring-2 focus:ring-purple-500 resize-none bg-white"/>
              </div>
            </div>
            <p className="text-xs text-purple-600 mt-3">These notes will be exported to a separate feedback file.</p>
          </div>
        </div>
      )}

      {/* DOCUMENT TITLE */}
      <div className="max-w-7xl mx-auto px-6 py-4">
        <div className="bg-white rounded-lg border border-gray-200 p-4">
          <label className="block text-sm font-medium text-gray-700 mb-2">Document Title <span className="text-red-500">*</span></label>
          <input type="text" value={documentTitle} onChange={e => setDocumentTitle(e.target.value)} placeholder="Enter the policy document title (e.g., Aetna CPB 0743 - Spinal Surgery)" className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"/>
        </div>
      </div>

      {/* STAGE CONTENT */}
      <main className="max-w-7xl mx-auto px-6 pb-24">
        {currentStage === 1 && <Stage1SectionExtraction sections={sections} setSections={setSections}/>}
        {currentStage === 2 && <Stage2AtomicBreakdown   sections={sections} sectionTrees={sectionTrees} setSectionTrees={setSectionTrees} sectionIndications={sectionIndications} setSectionIndications={setSectionIndications} sectionRefs={sectionRefs} setSectionRefs={setSectionRefs}/>}
        {currentStage === 3 && <Stage3CPTMapping        sections={sections} sectionTrees={sectionTrees} cptMappings={cptMappings} setCptMappings={setCptMappings}/>}
      </main>

      {/* FOOTER NAV */}
      <footer className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-6 py-4 z-20">
        <div className="max-w-7xl mx-auto flex justify-between items-center">
          <button onClick={() => setCurrentStage(Math.max(1, currentStage - 1))} disabled={currentStage === 1}
            className={`flex items-center gap-2 px-6 py-2 rounded-lg transition-colors ${currentStage === 1 ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}>
            <ArrowLeft size={18}/> Previous Stage
          </button>
          <div className="text-sm text-gray-500 flex items-center gap-3">
            <span>{sections.length} section(s)</span><span>•</span>
            <span>{sections.filter(s => (sectionIndications[s.id]||'').trim() && (sectionTrees[s.id] || sectionRefs[s.id])).length} annotated</span><span>•</span>
            <span>{cptMappings.length} CPT mapping(s)</span>
          </div>
          <button onClick={() => setCurrentStage(Math.min(3, currentStage + 1))} disabled={currentStage === 3 || !canProceed()}
            className={`flex items-center gap-2 px-6 py-2 rounded-lg transition-colors ${currentStage === 3 || !canProceed() ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-blue-600 text-white hover:bg-blue-700'}`}>
            Next Stage <ArrowRight size={18}/>
          </button>
        </div>
      </footer>
    </div>
  );
}

/* ── STAGE 1 ── */
function Stage1SectionExtraction({ sections, setSections }) {
  const [requirementText, setRequirementText] = useState('');
  const [editingId,       setEditingId]       = useState(null);

  const addSection = () => {
    if (!requirementText.trim()) return;
    if (editingId) { setSections(sections.map(s => s.id === editingId ? {...s, text:requirementText} : s)); setEditingId(null); }
    else setSections([...sections, { id:generateSectionId(sections), text:requirementText, created_at:new Date().toISOString() }]);
    setRequirementText('');
  };
  const editSection = s => { setRequirementText(s.text); setEditingId(s.id); };
  const deleteSection = id => { setSections(sections.filter(s => s.id !== id)); if (editingId === id) { setEditingId(null); setRequirementText(''); } };

  return (
    <div>
      <InstructionsPanel title="Stage 1 Instructions: Section-level Requirement Extraction">
        <div className="space-y-3">
          <p><strong>Goal:</strong> Extract all requirement sections from the policy document.</p>
          <ol className="list-decimal list-inside space-y-1 ml-2">
            <li>Open the policy document in a separate browser tab</li>
            <li>Find a requirement section (e.g., under "Medical Necessity")</li>
            <li>Copy the entire section text and paste it into the text area below</li>
            <li>Click "Add Section" to save</li>
            <li>Repeat for all requirement sections in the document</li>
          </ol>
          <p className="text-blue-600 italic">💡 Keep sections as cohesive units. If there's a clear procedure/anatomy heading with its criteria checklist, keep them together as one section.</p>
        </div>
      </InstructionsPanel>
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div className="bg-white rounded-xl border border-gray-200 p-6">
          <h2 className="text-lg font-semibold text-gray-900 mb-4">{editingId ? 'Edit Section' : 'Add New Section'}</h2>
          <div className="space-y-4">
            <textarea value={requirementText} onChange={e => setRequirementText(e.target.value)} placeholder="Paste or type the section requirement text here..." rows={12} className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 resize-none"/>
            <div className="flex gap-3">
              <button onClick={addSection} disabled={!requirementText.trim()}
                className={`flex-1 flex items-center justify-center gap-2 px-6 py-3 rounded-lg font-medium ${requirementText.trim() ? 'bg-blue-600 text-white hover:bg-blue-700' : 'bg-gray-100 text-gray-400 cursor-not-allowed'}`}>
                <Plus size={18}/> {editingId ? 'Update Section' : 'Add Section'}
              </button>
              {editingId && <button onClick={() => { setEditingId(null); setRequirementText(''); }} className="px-6 py-3 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-50">Cancel</button>}
            </div>
          </div>
        </div>
        <div className="bg-white rounded-xl border border-gray-200 p-6">
          <h2 className="text-lg font-semibold text-gray-900 mb-4">Extracted Sections ({sections.length})</h2>
          {sections.length === 0 ? (
            <div className="text-center py-12 text-gray-500"><Layers size={48} className="mx-auto mb-4 opacity-50"/><p>No sections extracted yet.</p></div>
          ) : (
            <div className="space-y-3 max-h-[600px] overflow-y-auto">
              {sections.map(section => (
                <div key={section.id} className="p-4 rounded-lg border-2 border-gray-200 bg-gray-50">
                  <div className="flex items-start justify-between gap-3">
                    <div className="flex-1 min-w-0">
                      <span className="font-mono text-xs font-bold bg-white px-2 py-0.5 rounded border border-gray-300 mb-2 inline-block">{section.id}</span>
                      <p className="text-sm whitespace-pre-wrap line-clamp-4">{section.text}</p>
                    </div>
                    <div className="flex gap-1">
                      <button onClick={() => editSection(section)}    className="p-2 hover:bg-white rounded-lg"><FileText size={16}/></button>
                      <button onClick={() => deleteSection(section.id)} className="p-2 hover:bg-white rounded-lg text-red-600"><Trash2 size={16}/></button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ── STAGE 2 ── */
/* ── ROUTING OR TREE PANEL ── */
function RoutingOrTreePanel({ sectionId, sectionTrees, setSectionTrees, sectionRefs, setSectionRefs }) {
  const tree      = sectionTrees[sectionId] || null;
  const ref       = sectionRefs[sectionId]  || '';
  const isRef     = !!ref && !tree;
  const [mode, setMode] = useState(isRef ? 'reference' : 'inline');

  const setModeAndClear = m => {
    setMode(m);
    if (m === 'reference') setSectionTrees({ ...sectionTrees, [sectionId]: null });
    else setSectionRefs({ ...sectionRefs, [sectionId]: '' });
  };

  return (
    <div>
      {/* Toggle */}
      <div className="flex gap-2 mb-4">
        <button onClick={() => setModeAndClear('inline')}
          className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium border transition-all ${mode === 'inline' ? 'bg-green-100 border-green-400 text-green-800' : 'bg-gray-100 border-gray-200 text-gray-500 hover:bg-gray-200'}`}>
          <GitBranch size={14}/> Inline criteria
        </button>
        <button onClick={() => setModeAndClear('reference')}
          className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium border transition-all ${mode === 'reference' ? 'bg-purple-100 border-purple-400 text-purple-800' : 'bg-gray-100 border-gray-200 text-gray-500 hover:bg-gray-200'}`}>
          <LinkIcon size={14}/> Refers to external doc
        </button>
      </div>

      {mode === 'inline' ? (
        <TreeBuilder tree={tree} setTree={t => setSectionTrees({ ...sectionTrees, [sectionId]: t })}/>
      ) : (
        <div className="space-y-3">
          <div className="bg-purple-50 border border-purple-200 rounded-lg p-3 text-xs text-purple-800">
            <strong>Use this when</strong> the section contains no extractable inline criteria and instead explicitly names an external standard or policy document that governs coverage (e.g., an NCD, LCD, InterQual guideline, or another CPB/policy document by name). Do <strong>not</strong> use this just because a section is difficult — if criteria text exists, use "Inline criteria" instead.
          </div>
          <label className="block text-sm font-medium text-gray-700">External document name / identifier</label>
          <input type="text" value={ref} onChange={e => setSectionRefs({ ...sectionRefs, [sectionId]: e.target.value })}
            placeholder="e.g., NCD 160.13, LCD L38072, InterQual 2024, Aetna CPB 0006, BCBS IL SUR712"
            className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 text-sm"/>
          <p className="text-xs text-gray-500">Copy the document name exactly as it appears in the policy text.</p>
        </div>
      )}
    </div>
  );
}

/* ── TREE BUILDER ── */
function TreeBuilder({ tree, setTree }) {
  const [newItemText, setNewItemText] = useState('');
  const operators = ['ALL', 'ANY']; // only ALL and ANY

  const createNode = (type, children = [], text = '') => ({
    id: `node_${Date.now()}_${Math.random().toString(36).substr(2,9)}`,
    type, text, children, evidence_sources: []
  });

  const addLeafNode = () => {
    if (!newItemText.trim()) return;
    if (!tree) setTree(createNode('ALL', [createNode('leaf', [], newItemText)]));
    else setTree({ ...tree, children: [...tree.children, createNode('leaf', [], newItemText)] });
    setNewItemText('');
  };
  const wrapWithOperator = op => {
    if (!tree) setTree(createNode(op, []));
    else setTree(createNode(op, [tree]));
  };
  const updateNode = (nodeId, updates) => {
    const f = n => { if (n.id === nodeId) return {...n,...updates}; if (n.children) return {...n, children:n.children.map(f)}; return n; };
    setTree(f(tree));
  };
  const deleteNode = nodeId => {
    const f = n => { if (n.id === nodeId) return null; if (n.children) return {...n, children:n.children.map(f).filter(Boolean)}; return n; };
    setTree(f(tree));
  };
  const addChildToNode = (parentId, newChild) => {
    const f = n => { if (n.id === parentId) return {...n, children:[...(n.children||[]),newChild]}; if (n.children) return {...n, children:n.children.map(f)}; return n; };
    setTree(f(tree));
  };
  const convertNodeToOperator = (nodeId, operatorType) => {
    const f = n => {
      if (n.id === nodeId) {
        const leaf = createNode('leaf', [], n.text); leaf.evidence_sources = n.evidence_sources || [];
        return { ...n, type:operatorType, text:'', children:[leaf], evidence_sources:[] };
      }
      if (n.children) return {...n, children:n.children.map(f)};
      return n;
    };
    setTree(f(tree));
  };

  return (
    <div className="space-y-4">
      <div className="flex gap-2">
        <input type="text" value={newItemText} onChange={e => setNewItemText(e.target.value)} placeholder="Paste atomic requirement text..." className="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500" onKeyPress={e => e.key === 'Enter' && addLeafNode()}/>
        <button onClick={addLeafNode} disabled={!newItemText.trim()} className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed"><Plus size={18}/></button>
      </div>
      <div className="flex flex-wrap gap-2">
        <span className="text-sm text-gray-600 py-1">Wrap tree with:</span>
        {operators.map(op => <button key={op} onClick={() => wrapWithOperator(op)} className="px-3 py-1 text-sm bg-gray-100 hover:bg-gray-200 rounded-lg font-mono">{op}</button>)}
      </div>
      <div className="border border-gray-200 rounded-lg p-4 min-h-[300px] max-h-[400px] overflow-y-auto bg-gray-50">
        {!tree ? (
          <div className="text-center py-8 text-gray-500">
            <p>No tree structure yet.</p>
            <button onClick={() => setTree(createNode('ALL',[]))} className="mt-4 px-4 py-2 bg-blue-100 text-blue-700 rounded-lg hover:bg-blue-200">Initialize with ALL</button>
          </div>
        ) : <TreeNode node={tree} depth={0} updateNode={updateNode} deleteNode={deleteNode} addChildToNode={addChildToNode} createNode={createNode} convertNodeToOperator={convertNodeToOperator}/>}
      </div>
    </div>
  );
}

/* ── TREE NODE ── */
function TreeNode({ node, depth, updateNode, deleteNode, addChildToNode, createNode, convertNodeToOperator }) {
  const [isExpanded,    setIsExpanded]    = useState(true);
  const [isEditing,     setIsEditing]     = useState(false);
  const [editText,      setEditText]      = useState(node.text);
  const [showAddChild,  setShowAddChild]  = useState(false);
  const [newChildText,  setNewChildText]  = useState('');
  const [newChildOp,    setNewChildOp]    = useState('leaf');
  const [showConvMenu,  setShowConvMenu]  = useState(false);

  const operators  = ['ALL', 'ANY']; // only ALL and ANY
  const isOperator = ['ALL','ANY'].includes(node.type);
  const opColors   = { ALL:'bg-green-100 text-green-800 border-green-300', ANY:'bg-yellow-100 text-yellow-800 border-yellow-300', leaf:'bg-white border-gray-300' };

  const saveEdit = () => { updateNode(node.id, { text:editText }); setIsEditing(false); };
  const addChild = () => {
    if (newChildOp === 'leaf' && !newChildText.trim()) return;
    addChildToNode(node.id, createNode(newChildOp, [], newChildOp === 'leaf' ? newChildText : ''));
    setNewChildText(''); setShowAddChild(false);
  };

  return (
    <div className={`${depth > 0 ? 'ml-6 border-l-2 border-gray-200 pl-4' : ''}`}>
      <div className={`flex items-start gap-2 p-2 rounded-lg border ${opColors[node.type] || 'bg-white border-gray-300'} mb-2`}>
        {isOperator && node.children?.length > 0 && (
          <button onClick={() => setIsExpanded(!isExpanded)} className="mt-1 p-0.5 hover:bg-black/10 rounded">
            {isExpanded ? <ChevronDown size={16}/> : <ChevronRight size={16}/>}
          </button>
        )}
        <div className="flex-1 min-w-0">
          {isOperator ? (
            <div className="flex items-center gap-2">
              <select value={node.type} onChange={e => updateNode(node.id, { type:e.target.value })} className="font-mono font-bold text-sm bg-transparent border-none focus:ring-0 cursor-pointer">
                {operators.map(op => <option key={op} value={op}>{op}</option>)}
              </select>
              <span className="text-xs text-gray-500">({node.children?.length || 0} items)</span>
            </div>
          ) : isEditing ? (
            <div className="flex gap-2">
              <input value={editText} onChange={e => setEditText(e.target.value)} className="flex-1 px-2 py-1 text-sm border border-gray-300 rounded" onKeyPress={e => e.key === 'Enter' && saveEdit()} autoFocus/>
              <button onClick={saveEdit} className="text-xs text-blue-600 hover:underline">Save</button>
            </div>
          ) : (
            <p className="text-sm cursor-pointer hover:bg-black/5 rounded p-1 -m-1" onClick={() => setIsEditing(true)}>
              {node.text || <em className="text-gray-400">Click to edit</em>}
            </p>
          )}

          {/* Leaf: multi-select evidence checkboxes + expand-to */}
          {!isOperator && (
            <div className="mt-2">
              <div className="flex gap-2 items-start flex-wrap">
                <span className="text-xs text-gray-500 mt-0.5">Evidence:</span>
                <div className="flex flex-wrap gap-x-3 gap-y-1">
                  {EVIDENCE_SOURCES.map(src => {
                    const checked = (node.evidence_sources || []).includes(src);
                    return (
                      <label key={src} className="flex items-center gap-1 cursor-pointer">
                        <input type="checkbox" checked={checked} onChange={() => {
                          const cur = node.evidence_sources || [];
                          updateNode(node.id, { evidence_sources: checked ? cur.filter(s => s !== src) : [...cur, src] });
                        }} className="accent-indigo-600"/>
                        <span className="text-xs text-gray-600">{src}</span>
                      </label>
                    );
                  })}
                </div>
                <span className="text-gray-300">|</span>
                <div className="relative">
                  <button onClick={() => setShowConvMenu(!showConvMenu)} className="text-xs px-2 py-1 bg-indigo-100 text-indigo-700 rounded hover:bg-indigo-200">↳ Expand to...</button>
                  {showConvMenu && (
                    <div className="absolute top-full left-0 mt-1 bg-white border border-gray-200 rounded shadow-lg z-10">
                      {operators.map(op => (
                        <button key={op} onClick={() => { convertNodeToOperator(node.id, op); setShowConvMenu(false); }}
                          className={`block w-full text-left px-3 py-1 text-xs hover:bg-gray-100 ${opColors[op].split(' ')[0]}`}>{op}</button>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
        <div className="flex gap-1">
          {isOperator && <button onClick={() => setShowAddChild(!showAddChild)} className="p-1 hover:bg-black/10 rounded text-gray-600"><Plus size={14}/></button>}
          <button onClick={() => deleteNode(node.id)} className="p-1 hover:bg-black/10 rounded text-red-600"><Trash2 size={14}/></button>
        </div>
      </div>
      {showAddChild && (
        <div className="ml-6 mb-2 p-2 bg-gray-100 rounded-lg flex gap-2 items-center">
          <select value={newChildOp} onChange={e => setNewChildOp(e.target.value)} className="text-xs px-2 py-1 border border-gray-300 rounded">
            <option value="leaf">Leaf (text)</option>
            {operators.map(op => <option key={op} value={op}>{op}</option>)}
          </select>
          {newChildOp === 'leaf' && <input value={newChildText} onChange={e => setNewChildText(e.target.value)} placeholder="Requirement text..." className="flex-1 px-2 py-1 text-xs border border-gray-300 rounded" onKeyPress={e => e.key === 'Enter' && addChild()}/>}
          <button onClick={addChild} className="px-2 py-1 text-xs bg-blue-600 text-white rounded hover:bg-blue-700">Add</button>
          <button onClick={() => setShowAddChild(false)} className="px-2 py-1 text-xs text-gray-600 hover:underline">Cancel</button>
        </div>
      )}
      {isExpanded && node.children?.map(child => (
        <TreeNode key={child.id} node={child} depth={depth+1} updateNode={updateNode} deleteNode={deleteNode} addChildToNode={addChildToNode} createNode={createNode} convertNodeToOperator={convertNodeToOperator}/>
      ))}
    </div>
  );
}

/* ── STAGE 3 ── */
function Stage3CPTMapping({ sections, sectionTrees, cptMappings, setCptMappings }) {
  const [currentCPT,    setCurrentCPT]    = useState('');
  const [isAddon,       setIsAddon]       = useState(false);
  const [currentMappings, setCurrentMappings] = useState({ sections:[] });

  const handleDragStart = (e, section) => { e.dataTransfer.setData('sectionId', section.id); };
  const handleDrop      = e => {
    e.preventDefault();
    const sid = e.dataTransfer.getData('sectionId');
    if (!sid || currentMappings.sections.includes(sid)) return;
    setCurrentMappings({ sections:[...currentMappings.sections, sid] });
  };
  const removeMapping = sid => setCurrentMappings({ sections:currentMappings.sections.filter(id => id !== sid) });
  const resetForm     = () => { setCurrentCPT(''); setIsAddon(false); setCurrentMappings({ sections:[] }); };

  const saveCPTMapping = () => {
    if (!currentCPT.trim()) return;
    const mapping = { cpt_code:currentCPT, sections:currentMappings.sections, is_addon:isAddon, created_at:new Date().toISOString() };
    const idx = cptMappings.findIndex(m => m.cpt_code === currentCPT);
    if (idx >= 0) { const u = [...cptMappings]; u[idx]=mapping; setCptMappings(u); }
    else setCptMappings([...cptMappings, mapping]);
    resetForm();
  };

  const loadMapping   = m => { setCurrentCPT(m.cpt_code); setIsAddon(m.is_addon||false); setCurrentMappings({ sections:m.sections||[] }); };
  const deleteMapping = code => setCptMappings(cptMappings.filter(m => m.cpt_code !== code));
  const getSectionById = id => sections.find(s => s.id === id);

  return (
    <div>
      <InstructionsPanel title="Stage 3 Instructions: CPT Code Mapping">
        <div className="space-y-3">
          <p><strong>Goal:</strong> Map each CPT/HCPCS code from the policy's code table to its relevant requirement sections.</p>
          <ol className="list-decimal list-inside space-y-1 ml-2">
            <li>Find the CPT/HCPCS codes table in the policy document</li>
            <li>Enter the CPT code in the input box</li>
            <li>Drag all relevant sections from the middle panel into the Requirements drop zone</li>
            <li>Click "Save CPT Mapping"</li>
          </ol>
          <p className="text-orange-600 italic">➕ Add-on codes: Check the "Add-on code" box if the CPT is marked with "+" in the policy's code table.</p>
        </div>
      </InstructionsPanel>
      <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <div className="lg:col-span-2 bg-white rounded-xl border border-gray-200 p-4">
          <h2 className="text-lg font-semibold text-gray-900 mb-4">Saved Mappings</h2>
          <div className="space-y-2 max-h-[700px] overflow-y-auto">
            {cptMappings.length === 0 ? <p className="text-sm text-gray-500 text-center py-4">None</p> : cptMappings.map(m => (
              <div key={m.cpt_code} className="p-2 bg-gray-50 rounded-lg border border-gray-200 group">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-1">
                    <button onClick={() => loadMapping(m)} className="font-mono text-sm text-blue-600 hover:underline">{m.cpt_code}</button>
                    {m.is_addon && <span className="text-xs bg-orange-100 text-orange-700 font-bold px-1.5 py-0.5 rounded">+</span>}
                  </div>
                  <button onClick={() => deleteMapping(m.cpt_code)} className="opacity-0 group-hover:opacity-100 text-red-500"><Trash2 size={14}/></button>
                </div>
                <div className="text-xs text-gray-400 mt-1">{m.sections?.length || 0} section(s)</div>
              </div>
            ))}
          </div>
        </div>
        <div className="lg:col-span-3 bg-white rounded-xl border border-gray-200 p-4">
          <h2 className="text-lg font-semibold text-gray-900 mb-4">Available Sections</h2>
          <p className="text-sm text-gray-600 mb-4">Drag sections to map them</p>
          <div className="space-y-2 max-h-[650px] overflow-y-auto">
            {sections.map(section => (
              <div key={section.id} draggable onDragStart={e => handleDragStart(e, section)}
                className="p-3 rounded-lg border-2 border-gray-200 bg-gray-50 cursor-grab active:cursor-grabbing hover:shadow-md hover:border-gray-300 transition-shadow">
                <div className="flex items-center gap-2">
                  <GripVertical size={16} className="text-gray-400 shrink-0"/>
                  <div className="flex-1 min-w-0">
                    <span className="font-mono text-xs font-bold bg-white px-2 py-0.5 rounded border border-gray-300 mb-1 inline-block">{section.id}</span>
                    <p className="text-sm line-clamp-2 mt-1">{section.text}</p>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
        <div className="lg:col-span-7 bg-white rounded-xl border border-gray-200 p-4 max-h-[800px] overflow-y-auto">
          <h2 className="text-lg font-semibold text-gray-900 mb-4">CPT Code Mapping</h2>
          <div className="mb-4">
            <label className="block text-sm font-medium text-gray-700 mb-2">CPT/HCPCS Code</label>
            <input type="text" value={currentCPT} onChange={e => setCurrentCPT(e.target.value.toUpperCase())} placeholder="Enter CPT code (e.g., 27447)" className="w-full px-4 py-2 border border-gray-300 rounded-lg font-mono focus:ring-2 focus:ring-blue-500"/>
            <label className="flex items-center gap-2 mt-2 cursor-pointer w-fit">
              <input type="checkbox" checked={isAddon} onChange={e => setIsAddon(e.target.checked)} className="accent-orange-500 w-4 h-4"/>
              <span className="text-sm text-gray-600">Add-on code <span className="font-mono font-bold text-orange-600">(+)</span></span>
            </label>
            {isAddon && (
              <div className="mt-2 flex items-start gap-2 bg-orange-50 border border-orange-200 rounded-lg px-3 py-2">
                <span className="text-orange-500 text-base mt-0.5">⚠️</span>
                <p className="text-xs text-orange-800">This is an <strong>add-on code</strong> — it cannot be billed alone and must accompany a primary procedure code.</p>
              </div>
            )}
          </div>
          <div>
            <label className="block text-sm font-medium text-gray-700 mb-2">Requirements</label>
            <div onDragOver={e => e.preventDefault()} onDrop={handleDrop} className="min-h-[120px] border-2 border-dashed border-blue-300 bg-blue-50 rounded-lg p-2">
              {currentMappings.sections.length > 0 ? (
                <div className="space-y-1">
                  {currentMappings.sections.map(sid => {
                    const sec = getSectionById(sid);
                    return sec ? (
                      <div key={sid} className="flex items-center justify-between bg-white p-2 rounded text-sm border border-gray-200">
                        <span className="font-mono text-xs font-bold mr-2 text-blue-700">{sid}</span>
                        <span className="flex-1 truncate text-xs text-gray-700">{sec.text}</span>
                        <button onClick={() => removeMapping(sid)} className="text-red-500 ml-2 hover:text-red-700"><Trash2 size={12}/></button>
                      </div>
                    ) : null;
                  })}
                </div>
              ) : <p className="text-center text-gray-400 text-xs py-4">Drag sections here to map them to this CPT code</p>}
            </div>
          </div>
          <button onClick={saveCPTMapping} disabled={!currentCPT.trim()}
            className={`w-full mt-4 py-3 rounded-lg font-medium ${currentCPT.trim() ? 'bg-blue-600 text-white hover:bg-blue-700' : 'bg-gray-100 text-gray-400 cursor-not-allowed'}`}>
            Save CPT Mapping
          </button>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   APP ROOT (top-level navigation)
══════════════════════════════════════════════════════════ */
function App() {
  const [view, setView] = useState('annotate');
  return (
    <div>
      {/* Global nav bar */}
      <div className="bg-gray-900 px-6 py-2.5 flex items-center gap-3">
        <span className="text-gray-300 text-sm font-bold mr-2 hidden sm:inline">Policy Annotation Tool</span>
        <nav className="flex gap-1">
          <button onClick={() => setView('annotate')}
            className={`flex items-center gap-2 px-4 py-1.5 rounded-lg text-sm transition-all ${view === 'annotate' ? 'bg-blue-600 text-white' : 'text-gray-400 hover:text-white hover:bg-gray-800'}`}>
            <FileText size={15}/> Annotate
          </button>
          <button onClick={() => setView('compare')}
            className={`flex items-center gap-2 px-4 py-1.5 rounded-lg text-sm transition-all ${view === 'compare' ? 'bg-blue-600 text-white' : 'text-gray-400 hover:text-white hover:bg-gray-800'}`}>
            <Layers size={15}/> Compare
          </button>
        </nav>
      </div>
      {view === 'annotate' && <AnnotationTool/>}
      {view === 'compare'  && <CompareView/>}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>

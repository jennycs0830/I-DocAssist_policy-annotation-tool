<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Policy Annotation Tool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .line-clamp-2 { display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden }
    .line-clamp-4 { display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden }
    /* Tree text: no line-clamp, mono, allow wrap */
    .tree-block { font-family:'Courier New',monospace; font-size:12.5px; line-height:1.65;
                  white-space:pre-wrap; word-break:break-word; }
    .tree-matched  { background:#f0fdf4; color:#166534; border-left:3px solid #4ade80; }
    .tree-missed   { background:#fff1f2; color:#9f1239; border-left:3px solid #f87171; }
    .tree-extra    { background:#fff7ed; color:#9a3412; border-left:3px solid #fb923c; }
    .tree-operator { background:#eff6ff; color:#1e40af; font-weight:600; }
    .tree-meta     { color:#6b7280; font-style:italic; font-size:11px; }
    .tree-default  { color:#374151; }
    /* Diff spans */
    .diff-equal  { color:#374151; }
    .diff-insert { background:#fef9c3; color:#854d0e; text-decoration:underline; }
    .diff-delete { background:#fee2e2; color:#991b1b; text-decoration:line-through; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo } = React;

    /* ── ICONS ── */
    const ChevronR  = ({s=20,c=""})=>(<svg xmlns="http://www.w3.org/2000/svg" width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={c}><path d="m9 18 6-6-6-6"/></svg>);
    const ChevronD  = ({s=20,c=""})=>(<svg xmlns="http://www.w3.org/2000/svg" width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={c}><path d="m6 9 6 6 6-6"/></svg>);
    const PlusI     = ({s=20,c=""})=>(<svg xmlns="http://www.w3.org/2000/svg" width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={c}><path d="M5 12h14"/><path d="M12 5v14"/></svg>);
    const TrashI    = ({s=20,c=""})=>(<svg xmlns="http://www.w3.org/2000/svg" width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={c}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>);
    const GripI     = ({s=20,c=""})=>(<svg xmlns="http://www.w3.org/2000/svg" width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={c}><circle cx="9" cy="12" r="1"/><circle cx="9" cy="5" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="19" r="1"/></svg>);
    const DlI       = ({s=20,c=""})=>(<svg xmlns="http://www.w3.org/2000/svg" width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={c}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>);
    const ArrL      = ({s=20,c=""})=>(<svg xmlns="http://www.w3.org/2000/svg" width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={c}><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>);
    const ArrR      = ({s=20,c=""})=>(<svg xmlns="http://www.w3.org/2000/svg" width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={c}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>);
    const FileI     = ({s=20,c=""})=>(<svg xmlns="http://www.w3.org/2000/svg" width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={c}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>);
    const LayersI   = ({s=20,c=""})=>(<svg xmlns="http://www.w3.org/2000/svg" width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={c}><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg>);
    const GitI      = ({s=20,c=""})=>(<svg xmlns="http://www.w3.org/2000/svg" width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={c}><line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>);
    const LinkI     = ({s=20,c=""})=>(<svg xmlns="http://www.w3.org/2000/svg" width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={c}><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>);
    const InfoI     = ({s=20,c=""})=>(<svg xmlns="http://www.w3.org/2000/svg" width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={c}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>);
    const MsgI      = ({s=20,c=""})=>(<svg xmlns="http://www.w3.org/2000/svg" width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={c}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>);
    const UpI       = ({s=20,c=""})=>(<svg xmlns="http://www.w3.org/2000/svg" width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={c}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>);
    const BarI      = ({s=20,c=""})=>(<svg xmlns="http://www.w3.org/2000/svg" width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={c}><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg>);

    /* ── CONSTANTS ── */
    const EVIDENCE_SOURCES=['clinical_note','imaging_report','therapy_records','lab_result','prior_auth_form','operative_report','pathology_report','referral_letter','other'];
    const DEFAULT_LOBS=['Medicare','Commercial','Medicaid'];

    /* ── HELPERS ── */
    const genId=(type,existing)=>{const p=type==='general'?'g':type==='supplementary'?'s':'e';return`${p}${String(existing.filter(s=>s.type===type).length+1).padStart(3,'0')}`;};
    const toExport=n=>{if(!n)return null;if(['ALL','ANY','NOT','IF','UNLESS'].includes(n.type))return{type:n.type,children:(n.children||[]).map(toExport).filter(Boolean)};return{type:'leaf',text:n.text||'',evidence_source:n.evidence_source||''};};
    const pct=v=>v!=null?(v*100).toFixed(1)+'%':'N/A';
    const sColor=v=>{if(v==null)return'text-gray-400';if(v>=0.8)return'text-green-700';if(v>=0.5)return'text-yellow-700';return'text-red-600';};
    const sBg=v=>{if(v==null)return'bg-gray-100';if(v>=0.8)return'bg-green-100';if(v>=0.5)return'bg-yellow-100';return'bg-red-100';};

    /* ── INSTRUCTIONS PANEL ── */
    function InstrPanel({title,children,open:initOpen=true}){
      const [open,setOpen]=useState(initOpen);
      return(<div className="bg-blue-50 border border-blue-200 rounded-xl mb-6">
        <button onClick={()=>setOpen(!open)} className="w-full flex items-center justify-between p-4 text-left">
          <div className="flex items-center gap-2"><InfoI s={18} c="text-blue-600"/><span className="font-semibold text-blue-900 text-sm">{title}</span></div>
          {open?<ChevronD s={18} c="text-blue-600"/>:<ChevronR s={18} c="text-blue-600"/>}
        </button>
        {open&&<div className="px-4 pb-4 text-sm text-blue-800">{children}</div>}
      </div>);
    }

    /* ── METRIC CARD ── */
    function MCard({label,value,sub,raw}){
      const disp=raw!=null?raw:pct(value);
      return(<div className={`rounded-xl p-4 border border-gray-100 ${sBg(value)}`}>
        <div className={`text-2xl font-bold ${sColor(value)}`}>{disp}</div>
        <div className="text-sm font-medium text-gray-700 mt-1">{label}</div>
        {sub&&<div className="text-xs text-gray-500 mt-0.5">{sub}</div>}
      </div>);
    }

    /* ── TREE LINE CLASSIFIER ── */
    function classLine(line){
      if(/\[✓/.test(line))return'tree-matched';
      if(/\[✗ MISSED\]/.test(line))return'tree-missed';
      if(/\[\+ EXTRA\]/.test(line))return'tree-extra';
      if(/\[(ALL|ANY|NOT|IF|UNLESS)\]/.test(line))return'tree-operator';
      if(/·\s*ts:/.test(line))return'tree-meta';
      return'tree-default';
    }

    /* ── TREE LEAF PARSER ── */
    /* Extracts structured leaves from the ASCII tree string.
       Each leaf line is followed by a "· ts:yes/no  ev:[...]" metadata line.
       Returns array of {status:'matched'|'missed'|'extra', score, text, ts, ev:[]} */
    function parseTreeLeaves(treeStr){
      if(!treeStr)return[];
      const rows=[];
      let last=null;
      for(const line of treeStr.split('\n')){
        if(/·\s*ts:/.test(line)){
          if(last){
            const tsM=line.match(/ts:(yes|no)/i);
            const evM=line.match(/ev:\[([^\]]*)\]/);
            last.ts=tsM?(tsM[1].toLowerCase()==='yes'):null;
            last.ev=evM?evM[1].split(',').map(s=>s.trim()).filter(Boolean):[];
          }
          continue;
        }
        const mM=line.match(/\[✓\s*([\d.]+)\]\s+(.*)/);
        const missM=line.match(/\[✗ MISSED\]\s+(.*)/);
        const extM=line.match(/\[\+\s*EXTRA\]\s+(.*)/);
        if(mM){last={status:'matched',score:parseFloat(mM[1]),text:mM[2].trim(),ts:null,ev:[]};rows.push(last);}
        else if(missM){last={status:'missed',text:missM[1].trim(),ts:null,ev:[]};rows.push(last);}
        else if(extM){last={status:'extra',text:extM[1].trim(),ts:null,ev:[]};rows.push(last);}
        // operator/structure lines don't reset last so the next meta line can still attach
      }
      return rows;
    }
    function evSetsEqual(a,b){
      if(!a||!b)return a===b;
      if(a.length!==b.length)return false;
      const sa=new Set(a);
      return b.every(x=>sa.has(x));
    }
    /* Build comparison rows from ref+pred tree strings.
       Returns [{type, refText, predText, refTs, predTs, tsMatch, refEv, predEv, evMatch, score}] */
    function buildLeafRows(refStr,predStr){
      const refAll=parseTreeLeaves(refStr);
      const predAll=parseTreeLeaves(predStr);
      const refMatched=refAll.filter(l=>l.status==='matched');
      const predMatched=predAll.filter(l=>l.status==='matched');
      const rows=[];
      const n=Math.min(refMatched.length,predMatched.length);
      for(let i=0;i<n;i++){
        const r=refMatched[i],p=predMatched[i];
        rows.push({type:'matched',score:r.score,
          refText:r.text,predText:p.text,
          refTs:r.ts,predTs:p.ts,tsMatch:r.ts===p.ts,
          refEv:r.ev,predEv:p.ev,evMatch:evSetsEqual(r.ev,p.ev)});
      }
      for(const l of refAll.filter(x=>x.status==='missed'))
        rows.push({type:'missed',refText:l.text,predText:null,refTs:l.ts,predTs:null,refEv:l.ev,predEv:null,tsMatch:false,evMatch:false});
      for(const l of predAll.filter(x=>x.status==='extra'))
        rows.push({type:'extra',refText:null,predText:l.text,refTs:null,predTs:l.ts,refEv:null,predEv:l.ev,tsMatch:false,evMatch:false});
      return rows;
    }
    function TreeTextPanel({treeStr,label,labelColor}){
      if(!treeStr)return<div className="text-gray-400 italic text-xs py-6 text-center">No tree data</div>;
      const lines=treeStr.split('\n');
      return(<div className="rounded-lg border border-gray-200 overflow-hidden">
        <div className={`px-3 py-1.5 text-xs font-semibold border-b border-gray-200 ${labelColor}`}>{label}</div>
        <div className="p-3 overflow-x-auto bg-white space-y-0.5">
          {lines.map((line,i)=>(
            <div key={i} className={`tree-block px-2 py-0.5 rounded ${classLine(line)}`}>{line||'\u00A0'}</div>
          ))}
        </div>
      </div>);
    }

    /* ── DIFF SPAN RENDERER ── */
    function DiffView({spans}){
      if(!spans||spans.length===0)return null;
      return(<div className="text-sm leading-relaxed p-3 bg-gray-50 rounded-lg border border-gray-200">
        {spans.map((sp,i)=>{
          if(sp.op==='equal') return<span key={i} className="diff-equal">{sp.ref}</span>;
          return(<span key={i}>
            {sp.ref&&<span className="diff-delete">{sp.ref}</span>}
            {sp.pred&&<span className="diff-insert"> {sp.pred}</span>}
          </span>);
        })}
      </div>);
    }

    /* ═══════════════════════════════════════════════
       REPORT VIEWER (separate full-screen page)
    ═══════════════════════════════════════════════ */
    function ReportViewer({reportData, onBack}){
      const [activeTab,setActiveTab]=useState('s1');
      const [expandedSec,setExpandedSec]=useState(null);
      const [filterLow,setFilterLow]=useState(false);
      const [annotData,setAnnotData]=useState(null);

      /* load annotation JSON to get full leaf text + evidence/time-sensitive */
      const loadAnnot=e=>{
        const f=e.target.files[0];if(!f)return;
        const r=new FileReader();
        r.onload=ev=>{try{const d=JSON.parse(ev.target.result);setAnnotData(d);}catch(err){alert('Annotation load failed: '+err.message);}};
        r.readAsText(f);e.target.value='';
      };

      /* Build a prefix→fullText lookup from annotation JSON.
         Truncated tree text ends with "…" — match it against full leaf text from annotation. */
      const annotTextLookup=useMemo(()=>{
        if(!annotData?.logic_trees)return{};
        const lookup={};// key: secId+'::'+prefix30 → fullText
        const collectLeaves=(node,secId)=>{
          if(!node)return;
          if(node.type==='leaf'&&node.text){
            const full=node.text.trim();
            // store by first 30 chars as key (enough to uniquely match)
            lookup[secId+'::'+full.slice(0,35)]=full;
          }
          (node.children||[]).forEach(c=>collectLeaves(c,secId));
        };
        Object.entries(annotData.logic_trees).forEach(([secId,tree])=>collectLeaves(tree,secId));
        return lookup;
      },[annotData]);

      /* Resolve possibly-truncated tree leaf text to full text using annotation lookup */
      const resolveText=(secId,truncated)=>{
        if(!truncated)return truncated;
        const clean=truncated.replace(/…$/, '').trim();
        if(!truncated.endsWith('…'))return truncated;// not truncated
        // find matching key
        for(const [k,v] of Object.entries(annotTextLookup)){
          if(k.startsWith(secId+'::')&&v.startsWith(clean))return v;
        }
        return truncated;// fallback: show as-is
      };

      /* build per-section leaf map for legacy RefLeafTable (when matched_leaves exists) */
      const annotLeafMap=useMemo(()=>{
        if(!annotData?.logic_trees)return{};
        const map={};
        const collectLeaves=(node,arr)=>{
          if(!node)return;
          if(node.type==='leaf'){arr.push({text:node.text||'',evidence_source:node.evidence_sources||node.evidence_source||'',time_sensitive:node.time_sensitive||false});}
          (node.children||[]).forEach(c=>collectLeaves(c,arr));
        };
        Object.entries(annotData.logic_trees).forEach(([secId,tree])=>{
          const leaves=[];collectLeaves(tree,leaves);map[secId]=leaves;
        });
        return map;
      },[annotData]);

      const s1=reportData.stage1||{};
      const s2=reportData.stage2||{};
      const s3=reportData.stage3||{};
      const iaa=reportData.inter_annotator_agreement||{};
      const perSec=s2.per_section||{};
      const errSum=reportData.error_summary||{};

      /* build section text lookup from stage1 */
      const secTextMap=useMemo(()=>{
        const m={};
        (s1.matches||[]).forEach(match=>{
          if(match.ref_id)  m[match.ref_id]  ={ref:match.ref_text,pred:match.pred_text,predId:match.pred_id,sim:match.similarity,isSubset:match.is_subset,subsetDir:match.subset_direction,diffSpans:match.diff_spans};
          if(match.pred_id) m['pred_'+match.pred_id]={text:match.pred_text};
        });
        (s1.unmatched_ref||[]).forEach(s=>{m[s.id]={ref:s.text,pred:null};});
        (s1.unmatched_pred||[]).forEach(s=>{m['pred_'+s.id]={text:s.text};});
        return m;
      },[s1]);

      /* categorise stage1 matches */
      const exactMatches=(s1.matches||[]).filter(m=>!m.is_subset);
      const subsetMatches=(s1.matches||[]).filter(m=>m.is_subset);
      const missedSecs=s1.unmatched_ref||[];
      const spuriousSecs=s1.unmatched_pred||[];

      const secIds=Object.keys(perSec);
      const shownIds=filterLow?secIds.filter(id=>(perSec[id].leaf_f1||0)<0.8):secIds;

      const tabs=[
        {id:'s1',label:'Stage 1 — Sections',icon:FileI},
        {id:'s2',label:'Stage 2 — Trees',icon:GitI},
        {id:'s3',label:'Stage 3 — CPT',icon:LinkI},
        {id:'iaa',label:'Agreement',icon:LayersI},
      ];

      return(
        <div className="min-h-screen bg-gray-50">
          {/* Report header */}
          <header className="bg-white border-b border-gray-200 px-6 py-4 sticky top-0 z-30">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-3">
                <button onClick={onBack} className="flex items-center gap-1.5 px-3 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 text-sm">
                  <ArrL s={16}/> Back to Annotation
                </button>
                <div>
                  <h1 className="text-lg font-bold text-gray-900 flex items-center gap-2"><BarI s={18} c="text-teal-600"/> Evaluation Report</h1>
                  <p className="text-xs text-gray-400 mt-0.5">Inter-annotator: {iaa.pairs?.[0]?.annotator_a} vs {iaa.pairs?.[0]?.annotator_b}</p>
                </div>
              </div>
              {/* Summary chips */}
              <div className="flex gap-3 text-sm">
                {[['§1 F1',s1.section_f1],['Leaf F1',s2.macro_leaf_f1],['Op.Acc',s2.macro_operator_accuracy]].map(([l,v])=>(
                  <div key={l} className={`px-3 py-1.5 rounded-lg ${sBg(v)}`}>
                    <span className="text-xs text-gray-500">{l} </span>
                    <span className={`font-bold ${sColor(v)}`}>{pct(v)}</span>
                  </div>
                ))}
              </div>
            </div>
            {/* Sub tabs */}
            <div className="max-w-7xl mx-auto mt-3 flex gap-1">
              {tabs.map(t=>(
                <button key={t.id} onClick={()=>setActiveTab(t.id)} className={`flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm transition-all ${activeTab===t.id?'bg-teal-100 text-teal-700 font-semibold':'bg-gray-100 text-gray-500 hover:bg-gray-200'}`}>
                  <t.icon s={15}/>{t.label}
                </button>
              ))}
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-6 py-6">

            {/* ── STAGE 1 ── */}
            {activeTab==='s1'&&(
              <div className="space-y-6">
                {/* metrics */}
                <div className="grid grid-cols-3 sm:grid-cols-6 gap-3">
                  <MCard label="Precision"       value={s1.section_precision}/>
                  <MCard label="Recall"          value={s1.section_recall}/>
                  <MCard label="F1"              value={s1.section_f1}/>
                  <MCard label="Text Sim."       value={s1.mean_text_similarity}/>
                  <MCard label="Matched"         raw={s1.n_matched??'—'} value={null} sub={`of ${s1.n_ref_total??'?'} ref`}/>
                  <MCard label="Spurious"        raw={s1.n_spurious??'—'} value={s1.n_spurious===0?1:0} sub="extra predicted"/>
                </div>

                {/* 4-column category cards */}
                {[
                  {title:`Matched — Exact (${exactMatches.length})`,bg:'bg-green-50',border:'border-green-200',badge:'bg-green-100 text-green-800',items:exactMatches,kind:'match'},
                  {title:`Matched — Subset (${subsetMatches.length})`,bg:'bg-yellow-50',border:'border-yellow-200',badge:'bg-yellow-100 text-yellow-800',items:subsetMatches,kind:'match'},
                  {title:`Missed — Not Predicted (${missedSecs.length})`,bg:'bg-red-50',border:'border-red-200',badge:'bg-red-100 text-red-800',items:missedSecs,kind:'missed'},
                  {title:`Spurious — Extra Predicted (${spuriousSecs.length})`,bg:'bg-orange-50',border:'border-orange-200',badge:'bg-orange-100 text-orange-800',items:spuriousSecs,kind:'spurious'},
                ].map(cat=>(
                  <SectionCategory key={cat.title} cat={cat}/>
                ))}
              </div>
            )}

            {/* ── STAGE 2 ── */}
            {activeTab==='s2'&&(
              <div className="space-y-5">
                {/* macro metrics */}
                <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                  <MCard label="Leaf F1 (macro)"     value={s2.macro_leaf_f1}/>
                  <MCard label="Operator Accuracy"   value={s2.macro_operator_accuracy}/>
                  <MCard label="Evidence Accuracy"   value={s2.macro_evidence_accuracy}/>
                </div>

                {/* note about leaf text truncation */}
                <div className="rounded-lg bg-amber-50 border border-amber-200 p-3 text-xs text-amber-800 flex items-start gap-2">
                  <InfoI s={14} c="text-amber-600 shrink-0 mt-0.5"/>
                  <span>Leaf text ending in <code className="bg-amber-100 px-1 rounded font-mono">…</code> is truncated by the report generator. Load the Annotation JSON (optional button below) to show the full untruncated text.</span>
                </div>

                {/* Legend */}
                <div className="flex flex-wrap gap-4 text-xs text-gray-500">
                  {[['tree-matched border-l-4 border-green-400','Matched leaf (✓)'],['tree-missed border-l-4 border-red-400','Missed (in ref, not in pred)'],['tree-extra border-l-4 border-orange-400','Extra (in pred, not in ref)'],['tree-operator','Operator node']].map(([cls,lbl])=>(
                    <span key={lbl} className="flex items-center gap-1.5">
                      <span className={`inline-block w-4 h-4 rounded-sm text-xs font-mono flex items-center justify-center ${cls}`}></span>{lbl}
                    </span>
                  ))}
                </div>

                {/* annotation loader + filter */}
                <div className="flex items-center gap-4 flex-wrap">
                  <span className="text-sm font-semibold text-gray-700">Per-Section ({shownIds.length} of {secIds.length})</span>
                  <label className="flex items-center gap-1.5 text-sm text-gray-600 cursor-pointer select-none">
                    <input type="checkbox" checked={filterLow} onChange={e=>setFilterLow(e.target.checked)} className="rounded text-red-500"/>
                    Show low F1 only (&lt;80%)
                  </label>
                  <label className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs cursor-pointer border ${annotData?'bg-teal-50 border-teal-300 text-teal-700':'bg-white border-gray-300 text-gray-600 hover:border-teal-400 hover:text-teal-600'}`}>
                    <FileI s={13}/>
                    {annotData?`Annotation loaded ✓ — showing full leaf text`:'Load Annotation JSON (optional — for full leaf text)'}
                    <input type="file" accept=".json" onChange={loadAnnot} className="hidden"/>
                  </label>
                  {annotData&&<button onClick={()=>setAnnotData(null)} className="text-xs text-gray-400 hover:text-red-500 px-1">✕ clear</button>}
                </div>

                <div className="space-y-2">
                  {shownIds.map(secId=>{
                    const sec=perSec[secId];
                    const info=secTextMap[secId]||{};
                    const open=expandedSec===secId;
                    const refLeaves=annotLeafMap[secId]||null;
                    return(
                      <SecTreeRow key={secId} secId={secId} sec={sec} info={info}
                        open={open} onToggle={()=>setExpandedSec(open?null:secId)}
                        refLeaves={refLeaves} resolveText={(t)=>resolveText(secId,t)}/>
                    );

                  {shownIds.length===0&&<div className="text-center py-8 text-gray-400 text-sm">No sections match filter.</div>}
                </div>

            )}

            {/* ── STAGE 3 ── */}
            {activeTab==='s3'&&(
              <div className="space-y-4">
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                  <MCard label="Code Precision"       value={s3.code_precision}/>
                  <MCard label="Code Recall"          value={s3.code_recall}/>
                  <MCard label="Code F1"              value={s3.code_f1}/>
                  <MCard label="Section Link Jaccard" value={s3.mean_section_link_jaccard}/>
                </div>
                {s3.code_f1===0&&<div className="rounded-lg bg-red-50 border border-red-200 p-4 text-sm text-red-800">Stage 3 metrics are all 0 — CPT code mapping may not have been evaluated or the annotator did not complete Stage 3.</div>}
              </div>
            )}

            {/* ── INTER-ANNOTATOR ── */}
            {activeTab==='iaa'&&(
              <div className="space-y-6">
                {iaa.pairs?.length>0&&(
                  <div className="overflow-x-auto rounded-xl border border-gray-200">
                    <table className="w-full text-sm">
                      <thead className="bg-gray-50">
                        <tr>{['Annotator A','Annotator B','§1 F1','Leaf F1','Op Acc','CPT F1','Link Jaccard'].map(h=>(
                          <th key={h} className="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide">{h}</th>
                        ))}</tr>
                      </thead>
                      <tbody>
                        {iaa.pairs.map((p,i)=>(
                          <tr key={i} className="border-t border-gray-100 hover:bg-gray-50">
                            <td className="px-4 py-3 font-mono text-xs">{p.annotator_a}</td>
                            <td className="px-4 py-3 font-mono text-xs">{p.annotator_b}</td>
                            <td className={`px-4 py-3 font-bold text-sm ${sColor(p.stage1_section_f1)}`}>{pct(p.stage1_section_f1)}</td>
                            <td className={`px-4 py-3 font-bold text-sm ${sColor(p.stage2_leaf_f1)}`}>{pct(p.stage2_leaf_f1)}</td>
                            <td className={`px-4 py-3 font-bold text-sm ${sColor(p.stage2_operator_accuracy)}`}>{pct(p.stage2_operator_accuracy)}</td>
                            <td className={`px-4 py-3 font-bold text-sm ${sColor(p.stage3_code_f1)}`}>{pct(p.stage3_code_f1)}</td>
                            <td className={`px-4 py-3 font-bold text-sm ${sColor(p.stage3_link_jaccard)}`}>{pct(p.stage3_link_jaccard)}</td>
                          </tr>

                    </table>

                {errSum.by_type&&(

                    <h3 className="font-semibold text-gray-700 mb-3">Error Breakdown</h3>
                    <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-5 gap-3">
                      {Object.entries(errSum.by_type).map(([type,count])=>(
                        <div key={type} className="rounded-xl border border-gray-200 bg-gray-50 p-4">
                          <div className="text-2xl font-bold text-gray-700">{count}</div>
                          <div className="text-xs text-gray-500 mt-1">{type.replace(/_/g,' ')}</div>
                        </div>
                      ))}
                      <div className="rounded-xl border border-gray-200 bg-gray-100 p-4">
                        <div className="text-2xl font-bold text-gray-700">{errSum.total_entries??'—'}</div>
                        <div className="text-xs text-gray-500 mt-1">total entries</div>
                      </div>

      );
    }

    /* Section category panel for Stage 1 */
    function SectionCategory({cat}){
      const [expanded,setExpanded]=useState(null);
      if(cat.items.length===0)return(
        <div className={`rounded-xl border ${cat.border} ${cat.bg} p-4`}>
          <h3 className="font-semibold text-gray-700 text-sm">{cat.title}</h3>
          <p className="text-xs text-gray-400 mt-2">None</p>
        </div>
      );
      return(
        <div className={`rounded-xl border ${cat.border} ${cat.bg}`}>
          <div className="p-4 border-b border-gray-200">
            <h3 className="font-semibold text-gray-800 text-sm">{cat.title}</h3>
          </div>
          <div className="divide-y divide-gray-100">
            {cat.items.map((item,i)=>{
              const key=cat.kind==='match'?item.ref_id:item.id;
              const isOpen=expanded===key;
              const sim=cat.kind==='match'?item.similarity:null;
              return(
                <div key={key}>
                  <button onClick={()=>setExpanded(isOpen?null:key)} className="w-full flex items-center gap-3 px-4 py-3 text-left hover:bg-white/60 transition-colors">
                    <span className="font-mono text-xs font-bold text-gray-600 w-16 shrink-0">
                      {cat.kind==='match'?`${item.ref_id} ↔ ${item.pred_id}`:item.id}
                    </span>
                    <p className="flex-1 text-sm text-gray-700">
                      {cat.kind==='match'?item.ref_text:(item.text||'')}
                    </p>
                    {sim!=null&&<span className={`text-xs font-medium px-2 py-0.5 rounded-full shrink-0 ${sBg(sim)} ${sColor(sim)}`}>sim {(sim*100).toFixed(1)}%</span>}
                    {cat.kind==='match'&&item.is_subset&&<span className="text-xs px-2 py-0.5 bg-yellow-100 text-yellow-800 rounded-full shrink-0">{item.subset_direction==='ref_in_pred'?'ref⊂pred':'pred⊂ref'}</span>}
                    {isOpen?<ChevronD s={15} c="text-gray-400 shrink-0"/>:<ChevronR s={15} c="text-gray-400 shrink-0"/>}
                  </button>
                  {isOpen&&(
                    <div className="px-4 pb-4 bg-white/70 space-y-3">
                      {cat.kind==='match'&&(
                        <>
                          <div className="grid grid-cols-1 lg:grid-cols-2 gap-3">
                            <div>
                              <div className="text-xs font-semibold text-blue-700 mb-1">Reference ({item.ref_id})</div>
                              <div className="text-xs bg-blue-50 border border-blue-100 rounded p-3 whitespace-pre-wrap">{item.ref_text}</div>
                            </div>
                            <div>
                              <div className="text-xs font-semibold text-purple-700 mb-1">Predicted ({item.pred_id})</div>
                              <div className="text-xs bg-purple-50 border border-purple-100 rounded p-3 whitespace-pre-wrap">{item.pred_text}</div>
                            </div>
                          </div>
                          {item.diff_spans&&item.diff_spans.length>0&&(
                            <div>
                              <div className="text-xs font-semibold text-gray-600 mb-1">Diff view <span className="font-normal text-gray-400">(yellow = inserted in pred, red = removed from ref)</span></div>
                              <DiffView spans={item.diff_spans}/>
                            </div>
                          )}
                        </>
                      )}
                      {cat.kind!=='match'&&(
                        <div className="text-xs bg-white border border-gray-100 rounded p-3 whitespace-pre-wrap">{item.text}</div>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    /* Per-section tree row for Stage 2 */
    function SecTreeRow({secId,sec,info,open,onToggle,refLeaves,resolveText}){
      return(
        <div className="rounded-xl border border-gray-200 bg-white overflow-hidden">
          <button onClick={onToggle} className="w-full flex items-center gap-3 px-4 py-3 text-left hover:bg-gray-50 transition-colors">
            <span className="font-mono text-sm font-bold text-gray-600 w-16 shrink-0">{secId}</span>
            {/* metric chips */}
            <div className="flex flex-wrap gap-1.5 flex-1">
              {[['Leaf F1',sec.leaf_f1],['Op.Acc',sec.operator_accuracy],['Evid.Acc',sec.evidence_accuracy]].map(([l,v])=>(
                <span key={l} className={`text-xs px-2 py-0.5 rounded-full font-medium ${sBg(v)} ${sColor(v)}`}>{l}: {pct(v)}</span>
              ))}
            </div>
            {open?<ChevronD s={16} c="text-gray-400 shrink-0"/>:<ChevronR s={16} c="text-gray-400 shrink-0"/>}
          </button>

          {open&&(
            <div className="border-t border-gray-100 p-4 bg-gray-50 space-y-4">
              {/* section-level stats */}
              <div className="flex flex-wrap gap-5 text-xs text-gray-500 border-b border-gray-200 pb-3">
                <span>Leaf precision: <strong className={sColor(sec.leaf_precision)}>{pct(sec.leaf_precision)}</strong></span>
                <span>Leaf recall: <strong className={sColor(sec.leaf_recall)}>{pct(sec.leaf_recall)}</strong></span>
                <span>Mean leaf sim: <strong>{sec.mean_leaf_similarity!=null?sec.mean_leaf_similarity.toFixed(4):'N/A'}</strong></span>
              </div>

              {/* section text (from stage1 lookup) */}
              {(info.ref||info.pred)&&(
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-3">
                  {info.ref&&(
                    <div>
                      <div className="text-xs font-semibold text-blue-700 mb-1">Reference section text</div>
                      <div className="text-xs bg-blue-50 border border-blue-100 rounded p-3 whitespace-pre-wrap leading-relaxed">{info.ref}</div>
                    </div>
                  )}
                  {info.pred&&(
                    <div>
                      <div className="text-xs font-semibold text-purple-700 mb-1">Predicted section text {info.predId&&<span className="font-normal text-gray-400">({info.predId})</span>}</div>
                      <div className="text-xs bg-purple-50 border border-purple-100 rounded p-3 whitespace-pre-wrap leading-relaxed">{info.pred}</div>
                    </div>
                  )}
                </div>
              )}
              {!info.ref&&!info.pred&&(
                <div className="text-xs text-gray-400 italic">Section text not available (section may not appear in stage1 matches).</div>
              )}

              {/* evidence accuracy */}
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div className={`rounded-lg p-3 border ${sBg(sec.evidence_accuracy)} border-gray-200`}>
                  <div className="text-xs font-semibold text-gray-600 mb-1">Evidence Type Accuracy</div>
                  <div className={`text-2xl font-bold ${sColor(sec.evidence_accuracy)}`}>{pct(sec.evidence_accuracy)}</div>
                </div>
              </div>

              {/* per-leaf ref vs pred evidence comparison */}
              {(sec.ref_tree||sec.pred_tree)&&(
                <LeafComparisonPanel
                  rows={buildLeafRows(sec.ref_tree,sec.pred_tree)}
                  resolveText={resolveText}/>
              )}

              {/* tree comparison — full text, no truncation */}
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                <TreeTextPanel treeStr={sec.ref_tree}  label="Reference Tree (Ground Truth)" labelColor="bg-blue-50 text-blue-800"/>
                <TreeTextPanel treeStr={sec.pred_tree} label="Predicted Tree"                labelColor="bg-purple-50 text-purple-800"/>
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ── PER-LEAF REF vs PRED COMPARISON (parsed from tree strings) ── */
    function EvBadge({ev,bad}){
      if(!ev||ev.length===0)return<span className="text-gray-300 text-xs">—</span>;
      return(<div className="flex flex-wrap gap-1 justify-center">
        {ev.map((e,i)=>(
          <span key={i} className={`inline-block px-1.5 py-0.5 rounded text-xs font-mono whitespace-nowrap ${bad?'bg-red-100 text-red-700 font-semibold':'bg-blue-50 text-blue-700'}`}>{e}</span>
        ))}
      </div>);
    }
    function LeafComparisonPanel({rows,resolveText}){
      if(!rows||rows.length===0)return<div className="text-xs text-gray-400 italic py-2">No leaf data parsed from trees.</div>;
      const evBad=rows.filter(r=>r.type==='matched'&&!r.evMatch).length;
      const missed=rows.filter(r=>r.type==='missed').length;
      const extra=rows.filter(r=>r.type==='extra').length;
      return(
        <div>
          <div className="flex items-center gap-2 mb-2 flex-wrap">
            <span className="text-xs font-semibold text-gray-700">Per-Leaf Ref vs Pred</span>
            {missed>0&&<span className="text-xs px-2 py-0.5 bg-red-100 text-red-700 rounded-full">{missed} missed leaf{missed>1?'s':''}</span>}
            {extra>0&&<span className="text-xs px-2 py-0.5 bg-orange-100 text-orange-700 rounded-full">{extra} extra leaf{extra>1?'s':''}</span>}
            {evBad>0&&<span className="text-xs px-2 py-0.5 bg-rose-100 text-rose-700 rounded-full">{evBad} evidence mismatch{evBad>1?'es':''}</span>}
            {evBad===0&&missed===0&&extra===0&&<span className="text-xs px-2 py-0.5 bg-green-100 text-green-700 rounded-full">All match ✓</span>}
          </div>
          <div className="rounded-lg border border-gray-200 overflow-x-auto">
            <table className="w-full text-xs border-collapse">
              <thead>
                <tr className="bg-gray-50 border-b border-gray-200">
                  <th className="px-2 py-2 text-left text-gray-500 font-semibold w-6">#</th>
                  <th className="px-3 py-2 text-left text-gray-500 font-semibold">Leaf Requirement</th>
                  <th className="px-3 py-2 text-center text-blue-600 font-semibold whitespace-nowrap">Ref Evidence</th>
                  <th className="px-3 py-2 text-center text-purple-600 font-semibold whitespace-nowrap">Pred Evidence</th>
                  <th className="px-2 py-2 text-center text-gray-400 font-semibold w-6">Ev</th>
                </tr>
              </thead>
              <tbody>
                {rows.map((row,i)=>{
                  let rowBg='bg-green-50';
                  if(row.type==='missed')rowBg='bg-red-50';
                  else if(row.type==='extra')rowBg='bg-orange-50';
                  else if(!row.evMatch)rowBg='bg-yellow-50';
                  const refTxt=resolveText?resolveText(row.refText||''):row.refText||'';
                  const predTxt=resolveText?resolveText(row.predText||''):row.predText||'';
                  return(
                    <tr key={i} className={`border-b border-gray-100 ${rowBg}`}>
                      <td className="px-2 py-2 text-gray-400 font-mono align-top text-center">{i+1}</td>
                      <td className="px-3 py-2 align-top" style={{minWidth:'220px',maxWidth:'420px',wordBreak:'break-word'}}>
                        {row.type==='matched'&&<>
                          {refTxt&&<div className="text-gray-800 mb-0.5" style={{whiteSpace:'pre-wrap'}}>{refTxt}</div>}
                          {predTxt&&predTxt!==refTxt&&<div className="text-purple-700 text-xs mt-1 italic" style={{whiteSpace:'pre-wrap'}}>pred: {predTxt}</div>}
                        </>}
                        {row.type==='missed'&&<div className="text-red-700" style={{whiteSpace:'pre-wrap'}}><span className="font-semibold">MISSED: </span>{refTxt||row.refText}</div>}
                        {row.type==='extra'&&<div className="text-orange-700" style={{whiteSpace:'pre-wrap'}}><span className="font-semibold">EXTRA: </span>{predTxt||row.predText}</div>}
                      </td>
                      <td className="px-3 py-2 align-top text-center"><EvBadge ev={row.refEv} bad={!row.evMatch&&row.type==='matched'}/></td>
                      <td className="px-3 py-2 align-top text-center"><EvBadge ev={row.predEv} bad={!row.evMatch&&row.type==='matched'}/></td>
                      <td className={`px-2 py-2 text-center text-base align-top font-bold ${row.evMatch?'text-green-500':'text-red-500'}`}>{row.type==='matched'?(row.evMatch?'✓':'✗'):'—'}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════════════════════════
       MAIN ANNOTATION TOOL (unchanged 3-stage flow)
    ═══════════════════════════════════════════════ */
    function AnnotationTool(){
      const [stage,setStage]=useState(1);
      const [docTitle,setDocTitle]=useState('');
      const [sections,setSections]=useState([]);
      const [trees,setTrees]=useState({});
      const [cpts,setCpts]=useState([]);
      const [customLOBs,setCustomLOBs]=useState([]);
      const [annotNotes,setAnnotNotes]=useState('');
      const [appFeedback,setAppFeedback]=useState('');
      const [showNotes,setShowNotes]=useState(false);
      const [reportData,setReportData]=useState(null);
      const [showReport,setShowReport]=useState(false);

      const allLOBs=[...DEFAULT_LOBS,...customLOBs];
      const addLOB=l=>{if(l&&!allLOBs.includes(l))setCustomLOBs([...customLOBs,l]);};
      const canNext=()=>{if(stage===1)return sections.length>0&&docTitle.trim()!=='';if(stage===2)return Object.keys(trees).length>0;return true;};

      const exportData=()=>{
        const se={general:[],supplementary:[],exception:[]};
        sections.forEach(s=>se[s.type].push({id:s.id,text:s.text}));
        const te={};Object.keys(trees).forEach(sid=>{const t=trees[sid];if(t)te[sid]=toExport(t);});
        const ce={};cpts.forEach(m=>{ce[m.cpt_code]={general:m.general||[],supplementary:m.supplementary||[],exception:m.exception||[],code_table_entries:m.code_table_entries||[]};});
        const ts=new Date().toISOString();const fp=docTitle.replace(/\s+/g,'_')||'annotation';
        const dl=(d,n)=>{const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=n;a.click();URL.revokeObjectURL(u);};
        dl({document_title:docTitle,sections:se,logic_trees:te,cpt_mappings:ce,custom_labels:{lobs:customLOBs},exported_at:ts},`${fp}_annotation.json`);
        if(annotNotes.trim()||appFeedback.trim())setTimeout(()=>dl({document_title:docTitle,annotator_notes:annotNotes,app_feedback:appFeedback,exported_at:ts},`${fp}_feedback.json`),500);
      };

      const importAnnot=e=>{
        const f=e.target.files[0];if(!f)return;
        const r=new FileReader();
        r.onload=ev=>{
          try{
            const d=JSON.parse(ev.target.result);
            if(d.document_title)setDocTitle(d.document_title);
            if(d.sections){const imp=[];['general','supplementary','exception'].forEach(t=>(d.sections[t]||[]).forEach(s=>imp.push({id:s.id,text:s.text,type:t,created_at:new Date().toISOString()})));setSections(imp);}
            if(d.logic_trees){const t={};Object.keys(d.logic_trees).forEach(sid=>{t[sid]=importTree(d.logic_trees[sid]);});setTrees(t);}
            if(d.cpt_mappings){const m=[];Object.keys(d.cpt_mappings).forEach(c=>{const mp=d.cpt_mappings[c];m.push({cpt_code:c,...mp,created_at:new Date().toISOString()});});setCpts(m);}
            if(d.custom_labels?.lobs)setCustomLOBs(d.custom_labels.lobs);
            if(d.annotator_notes)setAnnotNotes(d.annotator_notes);
            if(d.app_feedback)setAppFeedback(d.app_feedback);
            alert('Imported!');
          }catch(err){alert('Import failed');console.error(err);}
        };r.readAsText(f);e.target.value='';
      };
      const importTree=n=>{if(!n)return null;const id=`node_${Date.now()}_${Math.random().toString(36).substr(2,9)}`;if(n.type==='leaf')return{id,type:'leaf',text:n.text||'',children:[],evidence_source:n.evidence_source||''};return{id,type:n.type,text:'',children:(n.children||[]).map(importTree).filter(Boolean),evidence_source:''};};

      const importReport=e=>{
        const f=e.target.files[0];if(!f)return;
        const r=new FileReader();
        r.onload=ev=>{
          try{
            const d=JSON.parse(ev.target.result);
            if(!d.stage1&&!d.stage2)throw new Error('Not a valid report file');
            setReportData(d);setShowReport(true);
          }catch(err){alert('Report load failed: '+err.message);}
        };r.readAsText(f);e.target.value='';
      };

      /* Show report viewer instead of annotation tool */
      if(showReport&&reportData)return<ReportViewer reportData={reportData} onBack={()=>setShowReport(false)}/>;

      const stageNames=['Section Extraction','Atomic Breakdown','CPT Mapping'];

      return(
        <div className="min-h-screen bg-gray-50">
          {/* HEADER */}
          <header className="bg-white border-b border-gray-200 px-6 py-4 sticky top-0 z-30">
            <div className="max-w-7xl mx-auto flex items-center justify-between flex-wrap gap-3">
              <h1 className="text-xl font-bold text-gray-900">Policy Annotation Tool</h1>
              <div className="flex items-center gap-2 flex-wrap">
                <button onClick={()=>setShowNotes(!showNotes)} className={`flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm ${showNotes?'bg-purple-100 text-purple-700':'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}><MsgI s={15}/> Notes</button>
                <label className="flex items-center gap-1.5 px-3 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 cursor-pointer text-sm"><UpI s={15}/> Import<input type="file" accept=".json" onChange={importAnnot} className="hidden"/></label>
                <label className={`flex items-center gap-1.5 px-3 py-2 rounded-lg cursor-pointer text-sm ${reportData?'bg-teal-600 text-white hover:bg-teal-700':'bg-teal-100 text-teal-800 hover:bg-teal-200'}`}>
                  <BarI s={15}/>{reportData?'View Report':'Load Report'}
                  {reportData&&<button onClick={e=>{e.preventDefault();setShowReport(true);}} className="ml-1 underline text-xs" title="Click to view loaded report">↗</button>}
                  {!reportData&&<input type="file" accept=".json" onChange={importReport} className="hidden"/>}
                </label>
                {reportData&&<label className="flex items-center gap-1 px-2 py-2 text-xs text-teal-700 bg-teal-50 rounded-lg cursor-pointer hover:bg-teal-100">Reload<input type="file" accept=".json" onChange={importReport} className="hidden"/></label>}
                <button onClick={exportData} className="flex items-center gap-1.5 px-3 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 text-sm"><DlI s={15}/> Export</button>
              </div>
            </div>

            {/* stage progress bar */}
            <div className="max-w-7xl mx-auto mt-3 flex items-center gap-2">
              {stageNames.map((name,idx)=>{
                const sid=idx+1;
                return(<React.Fragment key={sid}>
                  <button onClick={()=>setStage(sid)} className={`flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm transition-all ${stage===sid?'bg-blue-100 text-blue-700 font-semibold':stage>sid?'bg-green-100 text-green-700':'bg-gray-100 text-gray-500 hover:bg-gray-200'}`}>
                    <span className={`w-5 h-5 rounded-full text-xs font-bold flex items-center justify-center ${stage===sid?'bg-blue-600 text-white':stage>sid?'bg-green-600 text-white':'bg-gray-300 text-gray-600'}`}>{sid}</span>
                    <span className="hidden sm:inline">{name}</span>
                  </button>
                  {idx<stageNames.length-1&&<div className={`h-0.5 w-8 rounded ${stage>sid?'bg-green-400':'bg-gray-200'}`}/>}
                </React.Fragment>);
              })}
            </div>
          </header>

          {/* NOTES PANEL */}
          {showNotes&&(
            <div className="max-w-7xl mx-auto px-6 py-4">
              <div className="bg-purple-50 border border-purple-200 rounded-xl p-5">
                <div className="flex items-center justify-between mb-4">
                  <h2 className="text-sm font-semibold text-purple-900 flex items-center gap-2"><MsgI s={16}/> Notes &amp; Feedback</h2>
                  <button onClick={()=>setShowNotes(false)} className="text-purple-600 hover:text-purple-800 text-sm">Close</button>
                </div>
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                  <div><label className="block text-xs font-medium text-purple-800 mb-1.5">Annotator Notes</label><textarea value={annotNotes} onChange={e=>setAnnotNotes(e.target.value)} rows={5} className="w-full px-3 py-2 border border-purple-300 rounded-lg text-sm resize-none bg-white focus:ring-2 focus:ring-purple-400"/></div>
                  <div><label className="block text-xs font-medium text-purple-800 mb-1.5">App Feedback</label><textarea value={appFeedback} onChange={e=>setAppFeedback(e.target.value)} rows={5} className="w-full px-3 py-2 border border-purple-300 rounded-lg text-sm resize-none bg-white focus:ring-2 focus:ring-purple-400"/></div>
                </div>
              </div>
            </div>
          )}

          {/* DOCUMENT TITLE */}
          <div className="max-w-7xl mx-auto px-6 pt-4">
            <div className="bg-white rounded-lg border border-gray-200 p-4">
              <label className="block text-sm font-medium text-gray-700 mb-1.5">Document Title <span className="text-red-500">*</span></label>
              <input type="text" value={docTitle} onChange={e=>setDocTitle(e.target.value)} placeholder="e.g., Aetna CPB 0743 - Spinal Surgery" className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500"/>
            </div>
          </div>

          {/* STAGE CONTENT */}
          <main className="max-w-7xl mx-auto px-6 py-4 pb-24">
            {stage===1&&<Stage1 sections={sections} setSections={setSections}/>}
            {stage===2&&<Stage2 sections={sections} trees={trees} setTrees={setTrees}/>}
            {stage===3&&<Stage3 sections={sections} trees={trees} cpts={cpts} setCpts={setCpts} allLOBs={allLOBs} addLOB={addLOB}/>}
          </main>

          {/* FOOTER NAV */}
          <footer className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-6 py-3 z-20">
            <div className="max-w-7xl mx-auto flex justify-between items-center">
              <button onClick={()=>setStage(Math.max(1,stage-1))} disabled={stage===1} className={`flex items-center gap-2 px-5 py-2 rounded-lg text-sm ${stage===1?'bg-gray-100 text-gray-300 cursor-not-allowed':'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}><ArrL s={16}/> Previous</button>
              <span className="text-xs text-gray-400">{sections.length} sections · {Object.keys(trees).length} trees · {cpts.length} CPT codes</span>
              <button onClick={()=>setStage(Math.min(3,stage+1))} disabled={stage===3||!canNext()} className={`flex items-center gap-2 px-5 py-2 rounded-lg text-sm ${stage===3||!canNext()?'bg-gray-100 text-gray-300 cursor-not-allowed':'bg-blue-600 text-white hover:bg-blue-700'}`}>Next <ArrR s={16}/></button>
            </div>
          </footer>
        </div>
      );
    }

    /* ── STAGE 1 ── */
    function Stage1({sections,setSections}){
      const [text,setText]=useState('');const [type,setType]=useState('general');const [editId,setEditId]=useState(null);
      const tc={general:'bg-blue-100 text-blue-800 border-blue-200',supplementary:'bg-purple-100 text-purple-800 border-purple-200',exception:'bg-orange-100 text-orange-800 border-orange-200'};
      const add=()=>{if(!text.trim())return;if(editId){setSections(sections.map(s=>s.id===editId?{...s,text,type}:s));setEditId(null);}else setSections([...sections,{id:genId(type,sections),text,type,created_at:new Date().toISOString()}]);setText('');setType('general');};
      const edit=s=>{setText(s.text);setType(s.type);setEditId(s.id);};
      const del=id=>{setSections(sections.filter(s=>s.id!==id));if(editId===id){setEditId(null);setText('');}};
      return(<div>
        <InstrPanel title="Stage 1: Section-level Requirement Extraction">
          <ol className="list-decimal list-inside space-y-1 ml-2"><li>Open the policy document in a separate tab</li><li>Copy a full requirement section</li><li>Paste below, pick type, click Add</li><li>Repeat for all sections</li></ol>
          <div className="mt-2 flex gap-3 flex-wrap text-xs">
            <span><span className="px-1.5 py-0.5 bg-blue-100 text-blue-800 rounded font-medium">General</span> primary criteria</span>
            <span><span className="px-1.5 py-0.5 bg-purple-100 text-purple-800 rounded font-medium">Supplementary</span> definitions/docs</span>
            <span><span className="px-1.5 py-0.5 bg-orange-100 text-orange-800 rounded font-medium">Exception</span> exclusions/waivers</span>
          </div>
        </InstrPanel>
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <div className="bg-white rounded-xl border border-gray-200 p-6 space-y-4">
            <h2 className="text-base font-semibold text-gray-900">{editId?'Edit Section':'Add Section'}</h2>
            <div className="flex gap-2">{['general','supplementary','exception'].map(t=><button key={t} onClick={()=>setType(t)} className={`flex-1 py-2 text-xs font-medium rounded-lg border-2 capitalize ${type===t?tc[t]+' border-current':'border-gray-200 text-gray-500'}`}>{t}</button>)}</div>
            <textarea value={text} onChange={e=>setText(e.target.value)} placeholder="Paste section text..." rows={10} className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm resize-none focus:ring-2 focus:ring-blue-500"/>
            <div className="flex gap-3">
              <button onClick={add} disabled={!text.trim()} className={`flex-1 py-2.5 rounded-lg text-sm font-medium ${text.trim()?'bg-blue-600 text-white hover:bg-blue-700':'bg-gray-100 text-gray-400 cursor-not-allowed'}`}>{editId?'Update':'Add Section'}</button>
              {editId&&<button onClick={()=>{setEditId(null);setText('');setType('general');}} className="px-4 py-2.5 bg-gray-100 text-gray-700 rounded-lg text-sm">Cancel</button>}
            </div>
          </div>
          <div className="bg-white rounded-xl border border-gray-200 p-6">
            <h2 className="text-base font-semibold text-gray-900 mb-4">Sections ({sections.length})</h2>
            {sections.length===0?<div className="text-center py-10 text-gray-400"><LayersI s={40} c="mx-auto mb-3 opacity-30"/><p className="text-sm">None yet.</p></div>:(
              <div className="space-y-2 max-h-[580px] overflow-y-auto">
                {sections.map(s=>(
                  <div key={s.id} className={`p-3 rounded-lg border-2 ${tc[s.type]}`}>
                    <div className="flex items-start justify-between gap-2">
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center gap-2 mb-1"><span className="font-mono text-xs font-bold bg-white/50 px-1.5 py-0.5 rounded">{s.id}</span><span className="text-xs font-semibold uppercase">{s.type}</span></div>
                        <p className="text-sm whitespace-pre-wrap line-clamp-4">{s.text}</p>
                      </div>
                      <div className="flex gap-1 shrink-0">
                        <button onClick={()=>edit(s)} className="p-1.5 hover:bg-white/50 rounded"><FileI s={14}/></button>
                        <button onClick={()=>del(s.id)} className="p-1.5 hover:bg-white/50 rounded text-red-600"><TrashI s={14}/></button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      </div>);
    }

    /* ── STAGE 2 ── */
    function Stage2({sections,trees,setTrees}){
      const [selId,setSelId]=useState(sections.length>0?sections[0].id:null);
      const cur=sections.find(s=>s.id===selId);
      const tc={general:'bg-blue-100 text-blue-800 border-blue-200',supplementary:'bg-purple-100 text-purple-800 border-purple-200',exception:'bg-orange-100 text-orange-800 border-orange-200'};
      return(<div>
        <InstrPanel title="Stage 2: Break Sections into Atomic Items">
          <ol className="list-decimal list-inside space-y-1 ml-2"><li>Select a section on the left</li><li>Add atomic requirements to the tree builder</li><li>Set operators (ALL/ANY/NOT) and per-leaf fields</li><li>Mark the evidence source for each leaf</li></ol>
        </InstrPanel>
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
          <div className="lg:col-span-3 bg-white rounded-xl border border-gray-200 p-4">
            <h2 className="text-base font-semibold text-gray-900 mb-3">Sections</h2>
            <div className="space-y-1.5 max-h-[600px] overflow-y-auto">
              {sections.map(s=>(
                <button key={s.id} onClick={()=>setSelId(s.id)} className={`w-full text-left p-2.5 rounded-lg border-2 ${selId===s.id?'ring-2 ring-blue-500 '+tc[s.type]:'border-gray-200 hover:border-gray-300'}`}>
                  <div className="flex items-center justify-between"><span className="font-mono text-sm font-bold">{s.id}</span>{trees[s.id]&&<span className="text-xs bg-green-100 text-green-700 px-1.5 py-0.5 rounded">✓</span>}</div>
                  <span className={`text-xs capitalize ${tc[s.type].split(' ')[1]}`}>{s.type}</span>
                </button>
              ))}
            </div>
          </div>
          <div className="lg:col-span-4 bg-white rounded-xl border border-gray-200 p-4">
            <h2 className="text-base font-semibold text-gray-900 mb-3">Section Content</h2>
            {cur?<div className={`p-3 rounded-lg border ${tc[cur.type]} max-h-[600px] overflow-y-auto`}>
              <span className="font-mono text-xs font-bold bg-white/50 px-2 py-0.5 rounded mb-2 inline-block">{cur.id}</span>
              <p className="text-sm whitespace-pre-wrap select-all mt-2">{cur.text}</p>
            </div>:<p className="text-gray-400 text-center py-8 text-sm">Select a section</p>}
          </div>
          <div className="lg:col-span-5 bg-white rounded-xl border border-gray-200 p-4">
            <h2 className="text-base font-semibold text-gray-900 mb-3">Logic Tree Builder</h2>
            {selId&&<TreeBuilder tree={trees[selId]||null} setTree={t=>setTrees({...trees,[selId]:t})}/>}
          </div>
        </div>
      </div>);
    }

    /* ── TREE BUILDER ── */
    function TreeBuilder({tree,setTree}){
      const [newText,setNewText]=useState('');
      const ops=['ALL','ANY','NOT','IF','UNLESS'];
      const mkNode=(type,children=[],text='')=>({id:`node_${Date.now()}_${Math.random().toString(36).substr(2,9)}`,type,text,children,evidence_source:''});
      const addLeaf=()=>{if(!newText.trim())return;if(!tree)setTree(mkNode('ALL',[mkNode('leaf',[],newText)]));else setTree({...tree,children:[...tree.children,mkNode('leaf',[],newText)]});setNewText('');};
      const wrap=op=>{if(!tree)setTree(mkNode(op,[]));else setTree(mkNode(op,[tree]));};
      const upd=(id,u)=>{const f=n=>{if(n.id===id)return{...n,...u};if(n.children)return{...n,children:n.children.map(f)};return n;};setTree(f(tree));};
      const del=id=>{const f=n=>{if(n.id===id)return null;if(n.children)return{...n,children:n.children.map(f).filter(Boolean)};return n;};setTree(f(tree));};
      const addChild=(pid,c)=>{const f=n=>{if(n.id===pid)return{...n,children:[...(n.children||[]),c]};if(n.children)return{...n,children:n.children.map(f)};return n;};setTree(f(tree));};
      const conv=(id,op)=>{const f=n=>{if(n.id===id){const lf=mkNode('leaf',[],n.text);lf.evidence_source=n.evidence_source||'';return{...n,type:op,text:'',children:[lf],evidence_source:''};}if(n.children)return{...n,children:n.children.map(f)};return n;};setTree(f(tree));};
      return(<div className="space-y-3">
        <div className="flex gap-2">
          <input type="text" value={newText} onChange={e=>setNewText(e.target.value)} placeholder="Paste atomic requirement..." className="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500" onKeyPress={e=>e.key==='Enter'&&addLeaf()}/>
          <button onClick={addLeaf} disabled={!newText.trim()} className="px-3 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:bg-gray-200 disabled:cursor-not-allowed"><PlusI s={16}/></button>
        </div>
        <div className="flex flex-wrap gap-1.5 items-center">
          <span className="text-xs text-gray-400">Wrap:</span>
          {ops.map(op=><button key={op} onClick={()=>wrap(op)} className="px-2.5 py-1 text-xs bg-gray-100 hover:bg-gray-200 rounded font-mono">{op}</button>)}
        </div>
        <div className="border border-gray-200 rounded-lg p-3 min-h-[300px] max-h-[450px] overflow-y-auto bg-gray-50">
          {!tree?<div className="text-center py-8 text-gray-400"><p className="text-sm mb-3">No tree.</p><button onClick={()=>setTree(mkNode('ALL',[]))} className="px-4 py-2 bg-blue-100 text-blue-700 rounded-lg text-sm">Init ALL</button></div>
          :<TreeNode node={tree} depth={0} upd={upd} del={del} addChild={addChild} mkNode={mkNode} conv={conv}/>}
        </div>
      </div>);
    }

    /* ── TREE NODE ── */
    function TreeNode({node,depth,upd,del,addChild,mkNode,conv}){
      const [exp,setExp]=useState(true);const [edit,setEdit]=useState(false);const [editTxt,setEditTxt]=useState(node.text);const [addC,setAddC]=useState(false);const [newCTxt,setNewCTxt]=useState('');const [newCOp,setNewCOp]=useState('leaf');const [showConv,setShowConv]=useState(false);
      const isOp=['ALL','ANY','NOT','IF','UNLESS'].includes(node.type);
      const ops=['ALL','ANY','NOT','IF','UNLESS'];
      const oc={ALL:'bg-green-100 text-green-800 border-green-300',ANY:'bg-yellow-100 text-yellow-800 border-yellow-300',NOT:'bg-red-100 text-red-800 border-red-300',IF:'bg-blue-100 text-blue-800 border-blue-300',UNLESS:'bg-purple-100 text-purple-800 border-purple-300',leaf:'bg-white border-gray-300'};
      const save=()=>{upd(node.id,{text:editTxt});setEdit(false);};
      const ac=()=>{if(newCOp==='leaf'&&!newCTxt.trim())return;addChild(node.id,mkNode(newCOp,[],newCOp==='leaf'?newCTxt:''));setNewCTxt('');setAddC(false);};
      return(<div className={`${depth>0?'ml-5 border-l-2 border-gray-200 pl-3':''}`}>
        <div className={`flex items-start gap-1.5 p-2 rounded-lg border ${oc[node.type]} mb-1.5`}>
          {isOp&&node.children?.length>0&&<button onClick={()=>setExp(!exp)} className="mt-0.5 p-0.5 hover:bg-black/10 rounded shrink-0">{exp?<ChevronD s={14}/>:<ChevronR s={14}/>}</button>}
          <div className="flex-1 min-w-0">
            {isOp?(<div className="flex items-center gap-2"><select value={node.type} onChange={e=>upd(node.id,{type:e.target.value})} className="font-mono font-bold text-sm bg-transparent border-none focus:ring-0">{ops.map(op=><option key={op} value={op}>{op}</option>)}</select><span className="text-xs text-gray-400">({node.children?.length||0})</span></div>)
            :edit?(<div className="flex gap-2"><input value={editTxt} onChange={e=>setEditTxt(e.target.value)} className="flex-1 px-2 py-1 text-sm border border-gray-300 rounded" onKeyPress={e=>e.key==='Enter'&&save()} autoFocus/><button onClick={save} className="text-xs text-blue-600">Save</button></div>)
            :<p className="text-sm cursor-pointer hover:bg-black/5 rounded px-1 py-0.5 break-words" onClick={()=>setEdit(true)}>{node.text||<em className="text-gray-400 text-xs">Click to edit</em>}</p>}
            {!isOp&&(
              <div className="flex gap-2 mt-1.5 items-center flex-wrap">
                <select value={node.evidence_source||''} onChange={e=>upd(node.id,{evidence_source:e.target.value})} className="text-xs px-2 py-0.5 border border-gray-200 rounded bg-white">
                  <option value="">Evidence...</option>{EVIDENCE_SOURCES.map(s=><option key={s} value={s}>{s}</option>)}
                </select>
                <div className="relative">
                  <button onClick={()=>setShowConv(!showConv)} className="text-xs px-2 py-0.5 bg-indigo-100 text-indigo-700 rounded">&#8627; Expand</button>
                  {showConv&&<div className="absolute top-full left-0 mt-1 bg-white border border-gray-200 rounded shadow-lg z-10">{ops.map(op=><button key={op} onClick={()=>{conv(node.id,op);setShowConv(false);}} className={`block w-full text-left px-3 py-1 text-xs hover:bg-gray-100 ${oc[op].split(' ')[0]}`}>{op}</button>)}</div>}
                </div>
              </div>
            )}
          </div>
          <div className="flex gap-0.5 shrink-0">
            {isOp&&<button onClick={()=>setAddC(!addC)} className="p-1 hover:bg-black/10 rounded text-gray-500"><PlusI s={13}/></button>}
            <button onClick={()=>del(node.id)} className="p-1 hover:bg-black/10 rounded text-red-500"><TrashI s={13}/></button>
          </div>
        </div>
        {addC&&<div className="ml-5 mb-2 p-2 bg-gray-100 rounded flex gap-2 items-center">
          <select value={newCOp} onChange={e=>setNewCOp(e.target.value)} className="text-xs px-2 py-1 border border-gray-300 rounded"><option value="leaf">Leaf</option>{ops.map(op=><option key={op} value={op}>{op}</option>)}</select>
          {newCOp==='leaf'&&<input value={newCTxt} onChange={e=>setNewCTxt(e.target.value)} placeholder="Requirement..." className="flex-1 px-2 py-1 text-xs border border-gray-300 rounded" onKeyPress={e=>e.key==='Enter'&&ac()}/>}
          <button onClick={ac} className="px-2 py-1 text-xs bg-blue-600 text-white rounded">Add</button>
          <button onClick={()=>setAddC(false)} className="text-xs text-gray-500 px-1">×</button>
        </div>}
        {exp&&node.children?.map(c=><TreeNode key={c.id} node={c} depth={depth+1} upd={upd} del={del} addChild={addChild} mkNode={mkNode} conv={conv}/>)}
      </div>);
    }

    /* ── LOB SELECTOR ── */
    function LOBSel({sel,all,toggle,addNew}){
      const [show,setShow]=useState(false);const [val,setVal]=useState('');
      const add=()=>{if(val.trim()){addNew(val.trim());toggle(val.trim());setVal('');setShow(false);}};
      return(<div className="space-y-1">
        <div className="flex flex-wrap gap-1.5">
          {all.map(l=><label key={l} className="flex items-center gap-1 text-xs bg-gray-50 px-2 py-0.5 rounded border border-gray-200 cursor-pointer"><input type="checkbox" checked={sel.includes(l)} onChange={()=>toggle(l)} className="w-3 h-3"/>{l}</label>)}
          {!show&&<button onClick={()=>setShow(true)} className="text-xs text-blue-600 px-1">+ Add</button>}
        </div>
        {show&&<div className="flex gap-1"><input value={val} onChange={e=>setVal(e.target.value)} placeholder="LOB..." className="flex-1 px-2 py-1 text-xs border border-blue-300 rounded" onKeyPress={e=>e.key==='Enter'&&add()} autoFocus/><button onClick={add} className="px-2 py-1 text-xs bg-blue-600 text-white rounded">Add</button><button onClick={()=>setShow(false)} className="text-xs px-1 text-gray-500">×</button></div>}
      </div>);
    }

    /* ── STAGE 3 ── */
    function Stage3({sections,trees,cpts,setCpts,allLOBs,addLOB}){
      const [cpt,setCpt]=useState('');const [maps,setMaps]=useState({general:[],supplementary:[],exception:[]});const [entries,setEntries]=useState([]);
      const tc={general:'bg-blue-100 text-blue-800 border-blue-200',supplementary:'bg-purple-100 text-purple-800 border-purple-200',exception:'bg-orange-100 text-orange-800 border-orange-200'};
      const addEntry=()=>setEntries([...entries,{id:`e_${Date.now()}`,table_heading:'',coverage_status:'covered_if_criteria_met',lob_applicability:[],dependent_codes:'',condition_notes:''}]);
      const updEntry=(id,f,v)=>setEntries(entries.map(e=>e.id===id?{...e,[f]:v}:e));
      const togLOB=(id,l)=>setEntries(entries.map(e=>e.id!==id?e:{...e,lob_applicability:e.lob_applicability.includes(l)?e.lob_applicability.filter(x=>x!==l):[...e.lob_applicability,l]}));
      const dropSec=(e,t)=>{e.preventDefault();const sid=e.dataTransfer.getData('sectionId');if(!sid||maps[t].includes(sid))return;setMaps({...maps,[t]:[...maps[t],sid]});};
      const remMap=(t,sid)=>setMaps({...maps,[t]:maps[t].filter(id=>id!==sid)});
      const save=()=>{if(!cpt.trim())return;const m={cpt_code:cpt,general:maps.general,supplementary:maps.supplementary,exception:maps.exception,code_table_entries:entries.map(e=>({table_heading:e.table_heading,coverage_status:e.coverage_status,lob_applicability:e.lob_applicability,dependent_codes:e.dependent_codes.split(',').map(c=>c.trim()).filter(c=>c),condition_notes:e.condition_notes})),created_at:new Date().toISOString()};const idx=cpts.findIndex(x=>x.cpt_code===cpt);if(idx>=0){const u=[...cpts];u[idx]=m;setCpts(u);}else setCpts([...cpts,m]);setCpt('');setMaps({general:[],supplementary:[],exception:[]});setEntries([]);};
      const load=m=>{setCpt(m.cpt_code);setMaps({general:m.general||[],supplementary:m.supplementary||[],exception:m.exception||[]});setEntries((m.code_table_entries||[]).map((e,i)=>({id:`e_${Date.now()}_${i}`,table_heading:e.table_heading||'',coverage_status:e.coverage_status||'covered_if_criteria_met',lob_applicability:e.lob_applicability||[],dependent_codes:(e.dependent_codes||[]).join(', '),condition_notes:e.condition_notes||''})));};
      const getSec=id=>sections.find(s=>s.id===id);
      return(<div>
        <InstrPanel title="Stage 3: CPT Code Mapping">
          <ol className="list-decimal list-inside space-y-1 ml-2"><li>Enter CPT/HCPCS code</li><li>Add Code Table Entries per table header</li><li>Drag sections into drop zones</li><li>Save mapping</li></ol>
        </InstrPanel>
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
          <div className="lg:col-span-2 bg-white rounded-xl border border-gray-200 p-4">
            <h2 className="text-base font-semibold text-gray-900 mb-3">Saved ({cpts.length})</h2>
            <div className="space-y-2 max-h-[700px] overflow-y-auto">
              {cpts.length===0?<p className="text-xs text-gray-400 text-center py-4">None</p>:cpts.map(m=>(
                <div key={m.cpt_code} className="p-2 bg-gray-50 rounded border border-gray-200 group">
                  <div className="flex items-center justify-between"><button onClick={()=>load(m)} className="font-mono text-sm text-blue-600 hover:underline">{m.cpt_code}</button><button onClick={()=>setCpts(cpts.filter(x=>x.cpt_code!==m.cpt_code))} className="opacity-0 group-hover:opacity-100 text-red-400"><TrashI s={12}/></button></div>
                  <div className="text-xs text-gray-400">{m.general.length}g {m.supplementary.length}s {m.exception.length}e</div>
                </div>
              ))}
            </div>
          </div>
          <div className="lg:col-span-3 bg-white rounded-xl border border-gray-200 p-4">
            <h2 className="text-base font-semibold text-gray-900 mb-3">Available Sections</h2>
            <div className="space-y-2 max-h-[650px] overflow-y-auto">
              {sections.map(s=>(
                <div key={s.id} draggable onDragStart={e=>e.dataTransfer.setData('sectionId',s.id)} className={`p-2.5 rounded-lg border-2 cursor-grab ${tc[s.type]} hover:shadow-sm`}>
                  <div className="flex items-center gap-2"><GripI s={13} c="text-gray-400 shrink-0"/>
                    <div className="flex-1 min-w-0"><div className="flex items-center gap-1.5 mb-0.5"><span className="font-mono text-xs font-bold bg-white/50 px-1.5 py-0.5 rounded">{s.id}</span><span className="text-xs uppercase font-medium">{s.type}</span></div><p className="text-xs line-clamp-2">{s.text}</p></div>
                  </div>
                </div>
              ))}
            </div>
          </div>
          <div className="lg:col-span-7 bg-white rounded-xl border border-gray-200 p-4 max-h-[800px] overflow-y-auto">
            <h2 className="text-base font-semibold text-gray-900 mb-4">CPT Mapping</h2>
            <div className="mb-4"><label className="block text-sm font-medium text-gray-700 mb-1.5">CPT/HCPCS Code</label><input value={cpt} onChange={e=>setCpt(e.target.value.toUpperCase())} placeholder="e.g., 27447" className="w-full px-3 py-2 border border-gray-300 rounded-lg font-mono text-sm focus:ring-2 focus:ring-blue-500"/></div>
            <div className="mb-4 p-4 bg-amber-50 border border-amber-200 rounded-lg">
              <div className="flex items-center justify-between mb-3"><h3 className="text-sm font-semibold text-amber-900">Code Table Entries ({entries.length})</h3><button onClick={addEntry} className="flex items-center gap-1 px-3 py-1 bg-amber-200 text-amber-900 rounded text-xs"><PlusI s={13}/> Add</button></div>
              {entries.length===0?<p className="text-xs text-amber-700 text-center py-3">Click Add Entry.</p>:(
                <div className="space-y-3">{entries.map((e,i)=>(
                  <div key={e.id} className="p-3 bg-white rounded border border-amber-200">
                    <div className="flex justify-between mb-2"><span className="text-xs font-semibold text-amber-800">Entry {i+1}</span><button onClick={()=>setEntries(entries.filter(x=>x.id!==e.id))} className="text-red-400"><TrashI s={13}/></button></div>
                    <div className="space-y-2">
                      <div><label className="block text-xs font-medium text-gray-600 mb-1">Table Heading</label><input value={e.table_heading} onChange={x=>updEntry(e.id,'table_heading',x.target.value)} className="w-full px-2 py-1 text-xs border border-gray-300 rounded"/></div>
                      <div className="grid grid-cols-2 gap-2">
                        <div><label className="block text-xs font-medium text-gray-600 mb-1">Coverage</label><select value={e.coverage_status} onChange={x=>updEntry(e.id,'coverage_status',x.target.value)} className="w-full px-2 py-1 text-xs border border-gray-300 rounded"><option value="covered_if_criteria_met">Covered if criteria met</option><option value="not_covered">Not covered</option><option value="experimental">Experimental</option><option value="other_related">Other</option></select></div>
                        <div><label className="block text-xs font-medium text-gray-600 mb-1">LOB</label><LOBSel sel={e.lob_applicability} all={allLOBs} toggle={l=>togLOB(e.id,l)} addNew={addLOB}/></div>
                      </div>
                      <div><label className="block text-xs font-medium text-gray-600 mb-1">Dependent Codes</label><input value={e.dependent_codes} onChange={x=>updEntry(e.id,'dependent_codes',x.target.value)} className="w-full px-2 py-1 text-xs border border-gray-300 rounded font-mono"/></div>
                      <div><label className="block text-xs font-medium text-gray-600 mb-1">Notes</label><textarea value={e.condition_notes} onChange={x=>updEntry(e.id,'condition_notes',x.target.value)} rows={2} className="w-full px-2 py-1 text-xs border border-gray-300 rounded resize-none"/></div>
                    </div>
                  </div>
                ))}</div>
              )}
            </div>
            <div className="space-y-3">
              {['general','supplementary','exception'].map(t=>(
                <div key={t}><label className="block text-sm font-medium text-gray-700 mb-1.5 capitalize">{t}</label>
                  <div onDragOver={e=>e.preventDefault()} onDrop={e=>dropSec(e,t)} className={`min-h-[48px] border-2 border-dashed rounded-lg p-2 ${tc[t]}`}>
                    {maps[t].length>0?<div className="space-y-1">{maps[t].map(sid=>{const s=getSec(sid);return s?<div key={sid} className="flex items-center justify-between bg-white/70 p-1.5 rounded text-xs"><span className="font-mono font-bold mr-2">{sid}</span><span className="flex-1 truncate">{s.text}</span><button onClick={()=>remMap(t,sid)} className="text-red-500 ml-2"><TrashI s={11}/></button></div>:null;})}</div>
                    :<p className="text-center text-gray-400 text-xs py-2">Drop {t} section here</p>}
                  </div>
                </div>
              ))}
            </div>
            <button onClick={save} disabled={!cpt.trim()} className={`w-full mt-4 py-2.5 rounded-lg text-sm font-medium ${cpt.trim()?'bg-blue-600 text-white hover:bg-blue-700':'bg-gray-100 text-gray-400 cursor-not-allowed'}`}>Save CPT Mapping</button>
          </div>
        </div>
      </div>);
    }

    const root=ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AnnotationTool/>);
  </script>
</body>
</html>
